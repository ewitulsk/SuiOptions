name: Move CI

# Build + unit-test every options-protocol Move package on every change to
# the contracts. There was no Move CI before, so latent compile/test breaks
# (e.g. a missing type annotation, a test out of sync with a signature
# change) merged undetected — this catches them.
#
# ## SUI_VERSION is NOT a deploy-compatibility guard (SO-335)
#
# It used to be pinned to 1.71.1 to match `sui-move-build` @
# framework/mainnet rev 2f5992f1 — the Rust crate that actually compiles
# packages at publish time — on the reasoning that a newer CLI might accept
# code the deploy compiler rejects.
#
# That proxy was both weaker and wrong. Publishing never invokes this CLI;
# it calls `BuildConfig::build` from that crate. And the proxy produced a
# false positive: `trading-vault` and `oracle-switchboard` failed the
# 1.71.1 CLI's `sui move test` step with UNEXPECTED_VERIFIER_ERROR (2017)
# in `sui::rangeproofs` — a VM/framework issue at TEST runtime — while
# building perfectly under the deploy compiler, which never runs Move
# tests at all.
#
# The proxy is now replaced by asking the deploy compiler directly:
#
#     rust-backend/tools/deployment-manager/tests/deploy_build.rs
#     cargo test -p deployment-manager --test deploy_build
#
# That builds every publishable package with the exact pinned crate, so it
# answers "will a redeploy compile?" precisely rather than by version
# coincidence. Run it before a redeploy.
#
# SUI_VERSION here therefore only needs to be a CLI new enough to BUILD and
# TEST the packages. Bump it freely when a package needs a newer framework;
# it carries no deploy meaning.

on:
  push:
    branches: [staging, main]
    paths:
      - 'contracts/**'
      - '.github/workflows/move-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/move-ci.yml'

permissions:
  contents: read

env:
  SUI_VERSION: mainnet-1.75.2
  # Authenticated release downloads (suiup + the Move git deps) dodge anon rate limits.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  move:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every package `deployment-manager` publishes. The
        # contracts/.deprecated/ packages (vault SO-332, auction, rfq) are
        # absent because they are no longer published — see each package's
        # DEPRECATED.md; their sources stay in-tree but are not built here.
        package:
          # Guarded-launch ingress gate — leaf dep of core/trading-vault/exchange.
          - whitelist
          - core
          - mm-collateral
          - trading-vault
          # v2 curated vault (SO-417) — replaces trading-vault at rollout;
          # v1 stays in the matrix until it leaves the tree.
          - trading-vault-v2
          - oracle-pyth
          - oracle-switchboard
          # Multichain vault transport adapters (multichain-vault-plan §2.2):
          # separate packages over pinned LayerZero-v2 / chainlink-sui deps.
          - endpoint-layerzero
          - endpoint-ccip
          - equity-oracle
          - options-adapter
          - deepbook-adapter
          # Hybrid exchange settlement package — standalone audit scope
          # (framework-only deps), published via --deploy-exchange.
          - exchange
    steps:
      - uses: actions/checkout@v4

      - name: Install suiup
        run: |
          curl -sSfL https://raw.githubusercontent.com/MystenLabs/suiup/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install sui ${{ env.SUI_VERSION }}
        run: suiup install "sui@${SUI_VERSION}" -y

      - name: Version
        run: sui --version

      - name: Build
        working-directory: contracts/${{ matrix.package }}
        run: sui move build

      - name: Test
        working-directory: contracts/${{ matrix.package }}
        run: sui move test

name: Move CI

# Build + unit-test the four options-protocol Move packages on every change
# to the contracts. There was no Move CI before, so latent compile/test
# breaks (e.g. a missing type annotation, a test out of sync with a
# signature change) merged undetected — this catches them.
#
# The sui CLI is pinned to 1.71.1, the SAME framework the Rust workspace pins
# (`sui-move-build` @ branch framework/mainnet, rev 2f5992f1), which is what
# actually compiles the package at publish time. Keep SUI_VERSION in lockstep
# with that rev — a newer CLI can accept code the deploy compiler rejects.

on:
  push:
    branches: [staging, main]
    paths:
      - 'contracts/**'
      - '.github/workflows/move-ci.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/move-ci.yml'

permissions:
  contents: read

env:
  SUI_VERSION: mainnet-1.71.1
  # Authenticated release downloads (suiup + the Move git deps) dodge anon rate limits.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  move:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `vault` (options_vault) is deprecated and no longer published
        # (SO-332) — see contracts/vault/DEPRECATED.md. Its sources and
        # tests stay in-tree but are not built or tested here.
        #
        # trading-vault and oracle-switchboard are NOT here yet (SO-335).
        # Both fail under the pinned 1.71.1 CLI with
        # UNEXPECTED_VERIFIER_ERROR (2017) in `sui::rangeproofs` — a
        # framework module that verifier rejects — while passing on a
        # 1.75.x CLI. Bumping SUI_VERSION to make them pass would break the
        # lockstep rule above, so the open question is the other one: does
        # the DEPLOY compiler (sui-move-build @ framework/mainnet
        # 2f5992f1) accept them? Answer that before the SO-335 redeploy,
        # then add both packages here.
        package: [core, auction, rfq, mm-collateral, oracle-pyth]
    steps:
      - uses: actions/checkout@v4

      - name: Install suiup
        run: |
          curl -sSfL https://raw.githubusercontent.com/MystenLabs/suiup/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install sui ${{ env.SUI_VERSION }}
        run: suiup install "sui@${SUI_VERSION}" -y

      - name: Version
        run: sui --version

      - name: Build
        working-directory: contracts/${{ matrix.package }}
        run: sui move build

      - name: Test
        working-directory: contracts/${{ matrix.package }}
        run: sui move test

name: Deploy lower envs

# Build + selective deploy to dev and/or staging. The actual build/deploy
# logic lives in _deploy.yml; this file is the trigger + env list.
# Manual-only (workflow_dispatch) — see SO-17. Choose which env(s) to
# target via the `environment` input.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment(s) to deploy'
        required: true
        type: choice
        options:
          - both
          - dev
          - staging
        default: both
      image_tag:
        description: 'Image tag to deploy. Empty = current SHA. Non-empty = skip build and roll the given tag (rollback).'
        required: false
        type: string
        default: ''
      force_all:
        description: 'Bypass the affected-files filter and roll every service.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      envs: ${{ inputs.environment == 'both' && '["dev","staging"]' || format('["{0}"]', inputs.environment) }}
      image_tag: ${{ inputs.image_tag || '' }}
      force_all: ${{ inputs.force_all == true }}

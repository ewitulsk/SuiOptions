name: Deploy staging

# Build + selective deploy to staging. The actual build/deploy logic
# lives in _deploy.yml; this file is the trigger.
# Manual-only (workflow_dispatch) — see SO-17.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy. Empty = current SHA. Non-empty = skip build and roll the given tag (rollback).'
        required: false
        type: string
        default: ''
      force_all:
        description: 'Bypass the affected-files filter and roll every service.'
        required: false
        type: boolean
        default: false
      only_services:
        description: 'JSON array of services to build + roll, e.g. ["cctp-relay"]. Restricts the roll to exactly these, bypassing the affected-files filter. Does NOT advance the deployed-staging marker (partial roll). Empty = normal selection.'
        required: false
        type: string
        default: ''

permissions:
  contents: write   # _deploy.yml advances the `deployed-staging` marker tag
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      envs: '["staging"]'
      image_tag: ${{ inputs.image_tag || '' }}
      force_all: ${{ inputs.force_all == true }}
      only_services: ${{ inputs.only_services || '' }}

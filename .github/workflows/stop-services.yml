name: Stop services

# Manual workflow to gracefully stop all running Docker services for a
# given environment. Uses `docker compose stop` so containers are halted
# but not removed — a subsequent deploy (or `docker compose up -d`) will
# bring them back without needing a full image pull.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod

permissions:
  contents: read
  id-token: write   # OIDC to AWS

env:
  AWS_REGION:        ${{ vars.AWS_REGION }}
  DEPLOY_ROLE_ARN:   ${{ vars.DEPLOY_ROLE_ARN }}
  SSM_OUTPUT_BUCKET: ${{ vars.SSM_OUTPUT_BUCKET }}

jobs:
  stop:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4   # for ./.github/actions/resolve-ec2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/resolve-ec2
        with:
          region: ${{ env.AWS_REGION }}
          env: ${{ inputs.environment }}

      - name: SSM stop services
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          jq -nc \
            --arg env "$DEPLOY_ENV" '
            {
              commands: [
                "set -eu",
                "COMPOSE_FILE=/opt/options/\($env)/docker-compose.\($env).yml",
                "if [ ! -f \"$COMPOSE_FILE\" ]; then echo \"No compose file at $COMPOSE_FILE\" >&2; exit 1; fi",
                "echo \"Stopping all services in \($env)…\"",
                "docker compose -f \"$COMPOSE_FILE\" stop",
                "echo \"All services stopped in \($env)\"",
                "docker compose -f \"$COMPOSE_FILE\" ps"
              ]
            }' > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "stop services $DEPLOY_ENV" \
            --parameters file:///tmp/ssm-params.json \
            --output-s3-bucket-name "$SSM_OUTPUT_BUCKET" \
            --query Command.CommandId --output text)
          echo "ssm command: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text)
          echo "ssm status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi

# Reusable selective-deploy workflow.
#
# Called by deploy-lower.yml (manual dispatch → staging) and
# deploy-prod.yml (push to main → prod).
#
# Three jobs:
#   1. affected — compute the set of services touched by this commit's
#      changed files (via deployment/affected.py). Determines the matrix
#      for build + deploy.
#   2. build — one parallel job per affected service, runs `docker buildx
#      bake --push <service>` against deployment/bake.hcl.
#   3. deploy — one parallel job per env (per caller's `envs` input),
#      uploads the deploy bundle (deploy.sh + render-secrets.sh +
#      docker-compose.<env>.yml) to S3, then SSMs into the EC2 box to
#      download the bundle and run deploy.sh with the affected-services
#      list.
#
# Concurrency is scoped per env so two near-simultaneous pushes serialize
# their deploys to each env independently. Build can fan out freely.

name: _deploy (reusable)

on:
  workflow_call:
    inputs:
      envs:
        description: 'JSON array of envs to deploy to, e.g. ''["staging"]''.'
        required: true
        type: string
      image_tag:
        description: 'Image tag to deploy. Empty = derive from current SHA and rebuild affected services. Non-empty = skip build and roll the given tag onto the affected services (rollback path).'
        required: false
        type: string
        default: ''
      force_all:
        description: 'Bypass the changed-paths filter and treat every service as affected. Use for first deploy on a fresh box, or to redeploy everything after dep drift.'
        required: false
        type: boolean
        default: false
      ref:
        description: 'Git ref/SHA to check out for build + deploy bundle. Empty = the commit that triggered the run (normal path). The redeploy-contract workflow passes the commit it just pushed so the deploy bundle ships its new deployments.json.'
        required: false
        type: string
        default: ''
      only_services:
        description: 'JSON array of service names to build + roll, bypassing the changed-paths filter (e.g. ''["token-info"]''). Empty = normal selection. Unlike force_all this restricts the set to exactly these services; used by redeploy-contract to rebuild just token-info on top of a latest-build roll.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write   # OIDC to AWS

env:
  AWS_REGION:        ${{ vars.AWS_REGION }}
  ECR_REGISTRY:      ${{ vars.ECR_REGISTRY }}
  DEPLOY_ROLE_ARN:   ${{ vars.DEPLOY_ROLE_ARN }}
  RDS_HOST:          ${{ vars.RDS_HOST }}
  SSM_OUTPUT_BUCKET: ${{ vars.SSM_OUTPUT_BUCKET }}

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      services:   ${{ steps.derive.outputs.services }}
      tag:        ${{ steps.tag.outputs.tag }}
      skip_build: ${{ steps.tag.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}   # empty = triggering commit; redeploy passes its new commit
          fetch-depth: 0           # need history for the diff range

      - id: tag
        env:
          OVERRIDE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$OVERRIDE_TAG" ]; then
            echo "tag=$OVERRIDE_TAG" >> "$GITHUB_OUTPUT"
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "image_tag override → skipping build, deploying $OVERRIDE_TAG"
          else
            echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      - id: base
        if: ${{ !inputs.force_all && !inputs.image_tag && !inputs.only_services }}
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          DEPLOY_ENVS: ${{ inputs.envs }}
        run: |
          # Diff base, in priority order:
          #   1. push 'before' — deploy-prod.yml (push to main) gets an exact
          #      range here, so prod is unaffected by the rest of this logic.
          #   2. the `deployed-<env>` marker tag the last successful deploy
          #      moved (see the "Advance deploy marker" step). This is the
          #      manual-dispatch path: diffing against the last *deployed*
          #      commit covers EVERY commit merged since, so a multi-PR manual
          #      deploy rolls all affected services.
          #   3. HEAD^ — first-ever deploy, before any marker exists.
          #
          # The old fallback was HEAD^ directly, which only ever saw the
          # single triggering commit: merge two PRs then dispatch and only the
          # last PR's services rolled, silently skipping the earlier one.
          if [ -n "$PUSH_BEFORE" ] \
            && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
            echo "diff base: push before ($base)"
          else
            # Marker is per-env; only meaningful for a single-env deploy (all
            # current callers are single-env). Fetch it explicitly in case the
            # shallow-ish clone didn't bring tags.
            env_count="$(echo "$DEPLOY_ENVS" | jq 'length')"
            marker_env="$(echo "$DEPLOY_ENVS" | jq -r '.[0]')"
            marker="deployed-${marker_env}"
            git fetch --quiet origin "refs/tags/${marker}:refs/tags/${marker}" 2>/dev/null || true
            if [ "$env_count" = "1" ] \
              && git rev-parse -q --verify "refs/tags/${marker}^{commit}" >/dev/null 2>&1; then
              base="$(git rev-parse "refs/tags/${marker}")"
              echo "diff base: ${marker} marker ($base)"
            else
              base="$(git rev-parse HEAD^)"
              echo "diff base: HEAD^ ($base) — no ${marker} marker yet (first deploy?)"
            fi
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - id: changed
        if: ${{ !inputs.force_all && !inputs.image_tag && !inputs.only_services }}
        uses: tj-actions/changed-files@v44
        with:
          base_sha: ${{ steps.base.outputs.sha }}
          separator: "\n"

      - id: derive
        env:
          FORCE_ALL: ${{ inputs.force_all }}
          OVERRIDE_TAG: ${{ inputs.image_tag }}
          ONLY_SERVICES: ${{ inputs.only_services }}
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          if [ -n "$ONLY_SERVICES" ]; then
            # Explicit service list — build + roll exactly these, ignoring the
            # changed-paths filter. With no image_tag the `tag` step left
            # skip_build=false, so these get built at the current sha.
            services="$ONLY_SERVICES"
            echo "only_services override → $services"
          elif [ "$FORCE_ALL" = "true" ] || [ -n "$OVERRIDE_TAG" ]; then
            # force_all OR a tag override (rollback) → roll every service.
            # For rollbacks the user normally wants to bring the whole
            # stack to a known-good tag; if they want one service only,
            # they can use a hand-rolled SSM command.
            # Keep this in sync with ALL_SERVICES in deployment/ec2/deploy.sh
            # and affected.py — a service missing here is never tag-seeded on
            # force_all, so deploy.sh rejects the deploy on a fresh box.
            services='["indexer","quoting-service","mm-bot","option-scheduler","api-service","token-info","auth-service","gas-station","price-charting","balance-monitor","keeper","oracle-service","solana-indexer","solana-token-info","solana-auth-service","solana-api-service","solana-quoting-service","solana-oracle-service","solana-price-charting","solana-gas-station","solana-keeper","solana-option-scheduler","solana-mm-bot","solana-balance-monitor"]'
            echo "force_all or image_tag override → rolling all services"
          else
            services=$(printf '%s\n' "$CHANGED_FILES" \
              | python3 rust-backend/deployment/affected.py)
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "affected services: $services"

  build:
    needs: affected
    if: needs.affected.outputs.skip_build == 'false' && needs.affected.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.affected.outputs.services) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}   # empty = triggering commit; redeploy passes its new commit

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # No setup-qemu-action: bake.hcl targets linux/amd64 and the GH
      # runner is amd64, so the whole build runs native. Add back +
      # setup-qemu-action@v3 with `platforms: arm64` here if bake.hcl
      # ever moves back to linux/arm64.
      - uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }}
        env:
          ECR: ${{ env.ECR_REGISTRY }}
          IMAGE_TAG: ${{ needs.affected.outputs.tag }}
        working-directory: rust-backend
        run: docker buildx bake -f deployment/bake.hcl --push ${{ matrix.service }}

  deploy:
    needs: [affected, build]
    # contents: write so a successful deploy can advance the `deployed-<env>`
    # marker tag (see the final step). The affected/build jobs keep the
    # workflow-default read.
    permissions:
      contents: write
      id-token: write
    if: |
      always()
      && needs.affected.outputs.services != '[]'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJson(inputs.envs) }}
      fail-fast: false
    concurrency:
      group: deploy-${{ matrix.env }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}   # empty = triggering commit; redeploy passes its new commit

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/resolve-ec2
        with:
          region: ${{ env.AWS_REGION }}
          env: ${{ matrix.env }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Tag images for environment
        env:
          TAG: ${{ needs.affected.outputs.tag }}
          SERVICES: ${{ needs.affected.outputs.services }}
          DEPLOY_ENV: ${{ matrix.env }}
        run: |
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            repo="options/${svc}"
            echo "Fetching manifest for ${repo}:${TAG}…"
            manifest=$(aws ecr batch-get-image \
              --repository-name "$repo" \
              --image-ids imageTag="$TAG" \
              --query 'images[0].imageManifest' \
              --output text)

            if [ -z "$manifest" ] || [ "$manifest" = "None" ]; then
              echo "::warning::No image found for ${repo}:${TAG} — skipping env tags"
              continue
            fi

            # Rolling "latest for this env" tag — moves on every deploy
            aws ecr put-image \
              --repository-name "$repo" \
              --image-tag "$DEPLOY_ENV" \
              --image-manifest "$manifest" 2>/dev/null || true

            # Immutable env + build-id tag
            aws ecr put-image \
              --repository-name "$repo" \
              --image-tag "${DEPLOY_ENV}_${TAG}" \
              --image-manifest "$manifest" 2>/dev/null || true

            echo "Tagged ${repo}: ${DEPLOY_ENV}, ${DEPLOY_ENV}_${TAG}"
          done

      - name: Upload deploy bundle to S3
        env:
          TAG: ${{ needs.affected.outputs.tag }}
        working-directory: rust-backend
        run: |
          # Bundle only the files the box needs to run deploy.sh for
          # this env. Per-env compose files are split so each env's
          # bundle carries only its own compose.
          mkdir -p /tmp/bundle/nginx /tmp/bundle/deployments
          cp deployment/ec2/deploy.sh         /tmp/bundle/
          cp deployment/ec2/render-secrets.sh /tmp/bundle/
          cp deployment/compose/docker-compose.${{ matrix.env }}.yml /tmp/bundle/
          # deployments.json is no longer baked into the token-info image; it's
          # a runtime file mounted from /opt/options/<env>/deployments/. Ship it
          # in the bundle so the host file self-heals to the deployed commit on
          # every deploy (the redeploy-contract workflow checks out its new
          # commit via `ref`, so its fresh deployments.json rides along here).
          cp deployments.json /tmp/bundle/deployments/deployments.json
          # solana-deployments.json rides along the same way for
          # solana-token-info (its sole reader).
          cp solana-deployments.json /tmp/bundle/deployments/solana-deployments.json
          # nginx sidecar config — shipped inside a `nginx/` directory so
          # compose can bind-mount the directory (and nginx -c picks the
          # file out of it). Mounting the directory instead of the file
          # avoids Docker's bind-mount-a-file inode trap — tar's
          # unlink+create extraction would otherwise orphan the
          # container's view of the file on every deploy.
          cp deployment/nginx/nginx.${{ matrix.env }}.conf /tmp/bundle/nginx/nginx.conf
          tar czf /tmp/bundle.tgz -C /tmp/bundle .
          aws s3 cp /tmp/bundle.tgz \
            "s3://$SSM_OUTPUT_BUCKET/deploy-bundles/$TAG-${{ matrix.env }}.tgz"

      # prod ships OTLP spans to the shared host's Tempo over the private VPC
      # IP. cloud-init seeds /opt/options/prod/otel-endpoint on first boot
      # only; the live prod host booted before that line landed (SO-180), so
      # deploy.sh fell back to the docker-DNS default `tempo:4318` — a name
      # that doesn't resolve on the prod host. Re-assert the file on every
      # deploy so it self-heals regardless of when the host was provisioned.
      # Staging reaches Tempo via docker DNS and needs no file.
      - name: Resolve prod OTLP endpoint
        id: otel
        if: matrix.env == 'prod'
        run: |
          ip=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=options-host" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].PrivateIpAddress' --output text)
          if [ -z "$ip" ] || [ "$ip" = "None" ] || [ "$(printf '%s' "$ip" | wc -w)" -ne 1 ]; then
            echo "::error::Could not resolve a single options-host private IP (got: '$ip')"
            exit 1
          fi
          echo "endpoint=http://$ip:4318" >> "$GITHUB_OUTPUT"
          echo "prod OTLP endpoint → http://$ip:4318"

      - name: SSM deploy
        env:
          TAG: ${{ needs.affected.outputs.tag }}
          SERVICES: ${{ needs.affected.outputs.services }}
          DEPLOY_ENV: ${{ matrix.env }}
          OTEL_ENDPOINT_FILE: ${{ steps.otel.outputs.endpoint }}
        run: |
          # Build the SSM parameter file with jq so JSON escaping is
          # mechanical (the SERVICES variable contains double quotes).
          # Note: AWS-RunShellScript runs under /bin/sh (dash on Ubuntu),
          # which doesn't support `set -o pipefail` — keep this `set -eu`.
          # deploy.sh itself runs under bash and uses pipefail there.
          jq -nc \
            --arg region "$AWS_REGION" \
            --arg ecr "$ECR_REGISTRY" \
            --arg tag "$TAG" \
            --arg dbhost "$RDS_HOST" \
            --arg bucket "$SSM_OUTPUT_BUCKET" \
            --arg env "$DEPLOY_ENV" \
            --arg otel "$OTEL_ENDPOINT_FILE" \
            --arg services "$SERVICES" '
            {
              commands: [
                "set -eu",
                "export AWS_REGION=\($region)",
                "export ECR=\($ecr)",
                "export IMAGE_TAG=\($tag)",
                "export DB_HOST=\($dbhost)",
                "aws s3 cp s3://\($bucket)/deploy-bundles/\($tag)-\($env).tgz /tmp/bundle.tgz",
                "mkdir -p /opt/options/\($env)",
                "tar xzf /tmp/bundle.tgz -C /opt/options/\($env)",
                "chmod +x /opt/options/\($env)/deploy.sh /opt/options/\($env)/render-secrets.sh",
                "rm /tmp/bundle.tgz",
                "cd /opt/options/\($env)",
                # deploy.sh reads otel-endpoint into OTEL_ENDPOINT; written
                # only when the resolve step set one (prod). Empty → dropped.
                (if $otel != "" then "echo \($otel) > /opt/options/\($env)/otel-endpoint" else empty end),
                "./deploy.sh \($env) " + ($services|@sh)
              ]
            }' > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $DEPLOY_ENV @ $TAG" \
            --parameters file:///tmp/ssm-params.json \
            --output-s3-bucket-name "$SSM_OUTPUT_BUCKET" \
            --query Command.CommandId --output text)
          echo "ssm command: $CMD_ID"

          # Poll for a terminal state. The built-in `aws ssm wait
          # command-executed` caps at ~100s (20 attempts × 5s), which is
          # shorter than image pulls + health checks — it would report a
          # false failure while the command is still InProgress. Give the
          # deploy up to 10 minutes to reach Success/Failed.
          STATUS=Pending
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          echo "ssm status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi

      - name: Advance deploy marker
        # Record the commit just deployed so the NEXT manual dispatch diffs
        # against it (not HEAD^). Only runs after the deploy step above
        # succeeded. Skipped for image_tag rollbacks — those roll an older
        # tag, which must not become the "last deployed" baseline.
        # Best-effort: a marker hiccup must never fail an already-good deploy.
        if: ${{ !inputs.image_tag }}
        env:
          DEPLOY_ENV: ${{ matrix.env }}
        run: |
          marker="deployed-${DEPLOY_ENV}"
          git tag -f "$marker" HEAD
          if git push -f origin "refs/tags/${marker}"; then
            echo "advanced ${marker} → $(git rev-parse HEAD)"
          else
            echo "::warning::failed to push ${marker} marker (next manual deploy falls back to HEAD^)"
          fi

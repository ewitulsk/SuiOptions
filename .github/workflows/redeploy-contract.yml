# Redeploy the options-protocol Move package to staging or prod, then roll
# out the services so they run against the new contract's deployments.json.
#
# deployments.json is NOT baked into images: token-info reads it from a host
# bind-mount (/opt/options/<env>/deployments/), and the deploy bundle ships
# the file from the redeploy commit. So a redeploy only needs to drop the new
# file + restart token-info — it does NOT need to rebuild every service.
#
# Steps (in order):
#   1. Build + run the deployment-manager → publishes the Move package
#      on-chain and writes the new IDs to deployments.json.
#   2. Query the Sui GraphQL RPC to resolve the deployment checkpoint.
#   3. Update the indexer config's start_checkpoint to checkpoint − 1.
#   4. Stop the indexer + orderbook on EC2 and wipe + provision the
#      indexer_<env> and orderbook_<env> databases via the shared
#      wipe-provision-db.sh script (prod-guarded).
#      (The mm-bot needs no reset — it resolves its Account from chain state
#      for the current package on boot, bootstrapping a fresh one if none.)
#   5. Commit the updated deployments.json + indexer config to git.
#   6. Call _deploy.yml with ref=<the commit just pushed> per build_strategy:
#        - rebuild-all              : rebuild + roll every service (original).
#        - latest                   : skip builds, roll the last deployed
#                                     images; the bundle still ships the new
#                                     deployments.json.
#        - latest-build-token-info  : roll the stack on latest images, then
#                                     rebuild + roll only token-info.
#      deploy.sh pulls + up -d + runs migrations + health checks, bringing the
#      stopped indexer/orderbook back up on the wiped DBs.
#
# prod is a testnet deployment, so it IS a valid target here (it publishes
# to testnet and wipes the prod testnet DBs). What stays EXPLICITLY BLOCKED
# is any environment this workflow cannot PROVE is testnet.
#
# The guard is rust-backend/deployment/assert_testnet.sh. It derives the
# network from services/*/config/config.<env>.toml and refuses unless the
# answer is testnet — so mainnet, a half-migrated env whose services
# disagree, an unreadable config, and an env the resolver was never taught
# about all refuse. It runs as the FIRST step, so it gates the package
# publish as well as the DB wipe, and it is re-asserted inside the
# destructive step rather than trusted from an earlier step's output.
#
# The sentence that used to be here promised a refusal on mainnet while the
# network was hardcoded "testnet" for every env — so the guard tested a value
# it was structurally incapable of producing. It read as a safety guarantee
# and enforced nothing (SO-330).

name: Redeploy Contract

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to redeploy'
        required: true
        type: choice
        options:
          - staging
          - prod
      deploy_tokens:
        description: 'Also publish the test-tokens package (TUSDC/TBTC/TWAL/TSUI)'
        required: false
        type: boolean
        default: true
      grpc_url:
        description: 'gRPC URL for the publish (blank = the shared options/<env>/sui-rpc secret, else the public fullnode)'
        required: false
        type: string
        default: ''
      rebuild_manager:
        description: 'Force-rebuild the deployment-manager binary (ignore the cached one)'
        required: false
        type: boolean
        default: false
      gas_budget:
        description: 'Per-publish gas budget in MIST. Also the minimum balance the gas coin must hold before EACH package publish — lower it when the deployer runs lean (max observed real cost is ~0.27 SUI gross).'
        required: false
        type: string
        default: '2000000000'
      build_strategy:
        description: 'How to source service images for the rollout'
        required: false
        type: choice
        default: rebuild-all
        options:
          # Rebuild + roll every service from the redeploy commit (the original
          # behavior — slowest, but always valid incl. a fresh box).
          - rebuild-all
          # Skip all builds: roll every service on the last successfully
          # deployed images (the deployed-<env> marker's sha). The new
          # deployments.json still reaches token-info via the deploy bundle.
          # Requires a prior deploy on this env.
          - latest
          # Roll the whole stack on latest images, then rebuild + roll ONLY
          # token-info at the redeploy commit. Use when token-info code changed
          # (or to first cold-boot the bind-mount wiring) without waiting on a
          # full 12-service rebuild.
          - latest-build-token-info

permissions:
  contents: write    # push updated deployments.json + config
  id-token: write    # OIDC → AWS

env:
  AWS_REGION:        ${{ vars.AWS_REGION }}
  ECR_REGISTRY:      ${{ vars.ECR_REGISTRY }}
  DEPLOY_ROLE_ARN:   ${{ vars.DEPLOY_ROLE_ARN }}
  RDS_HOST:          ${{ vars.RDS_HOST }}
  SSM_OUTPUT_BUCKET: ${{ vars.SSM_OUTPUT_BUCKET }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      # The commit this job pushes (new deployments.json + indexer config).
      # The deploy job checks this out so its bundle ships the new file.
      new_sha: ${{ steps.commit.outputs.sha }}
      # Image tag for the `latest`/`latest-build-token-info` strategies: the sha
      # of the last successful deploy (the deployed-<env> marker). Empty on
      # rebuild-all.
      latest_tag: ${{ steps.latest.outputs.tag }}
    steps:
      # ── 0. Checkout ──────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 1. Derive network from environment ───────────────────────
      # Derived from the service configs, NOT hardcoded. The previous version
      # mapped both envs to "testnet" with a `case`, which meant the MAINNET
      # GUARD below tested a value it was structurally incapable of producing:
      # correct today, and unable to fire on the day prod becomes mainnet.
      #
      # assert_testnet.sh refuses unless the env is provably testnet — so an
      # unresolvable, ambiguous or partially-migrated env now blocks this
      # workflow instead of silently passing as testnet.
      - name: Resolve network (and refuse anything but testnet)
        id: net
        run: |
          NETWORK="$(bash rust-backend/deployment/assert_testnet.sh \
            "${{ inputs.environment }}")"
          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"

      # ── 1b. Resolve the "latest build" image tag (fail-fast) ─────
      # For the latest* strategies we roll the images from the last successful
      # deploy, identified by the deployed-<env> marker tag the deploy workflow
      # advances. Resolve it BEFORE publishing/wiping so a missing marker aborts
      # the run before it does anything destructive. rebuild-all ignores this.
      - name: Resolve latest build tag
        id: latest
        env:
          ENV: ${{ inputs.environment }}
          STRATEGY: ${{ inputs.build_strategy }}
        run: |
          marker="deployed-${ENV}"
          git fetch --quiet origin "refs/tags/${marker}:refs/tags/${marker}" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/${marker}^{commit}" >/dev/null 2>&1; then
            tag="$(git rev-parse --short=12 "refs/tags/${marker}")"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "latest build tag for ${ENV}: $tag (from ${marker})"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            if [ "$STRATEGY" != "rebuild-all" ]; then
              echo "::error::build_strategy=$STRATEGY needs a prior successful deploy, but no ${marker} marker exists. Use rebuild-all for the first deploy on this env."
              exit 1
            fi
            echo "no ${marker} marker yet — fine for rebuild-all"
          fi

      # ── 2. AWS credentials (OIDC) ───────────────────────────────
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/resolve-ec2
        with:
          region: ${{ env.AWS_REGION }}
          env: ${{ inputs.environment }}

      # ── 3. Fetch the prebuilt deployment-manager binary ──────────
      # The binary lives as a GitHub prerelease asset (tag:
      # deployment-manager-bin) named for the source it was built from:
      #
      #     deploy-linux-x64-<tree>    <tree> = git rev-parse HEAD:rust-backend
      #
      # Normal runs just download + run it — NO Rust toolchain, NO cargo, NO
      # apt build-deps. A compile happens when no asset matches the current
      # source tree, or when the rebuild_manager flag forces it; the fresh
      # binary is then uploaded under its own key for next time.
      #
      # The key is the point. This step used to store one unversioned
      # `deploy-linux-x64`, so a source change could not invalidate it: the
      # SO-336/SO-337 gRPC migration shipped on 2026-08-02, this workflow kept
      # running a binary built on 2026-07-26, and the publish step died
      # dialling the JSON-RPC endpoint Sui had already switched off. A week of
      # deploy-tooling changes had been silently discarded. A cache that
      # cannot tell whether it is stale is not a cache.
      #
      # It hashes the whole rust-backend tree rather than the manager's
      # dependency closure. A hand-maintained list of what the binary links
      # drifts out of sync with the Cargo manifests — see the map in
      # deployment/affected.py for the same failure in the other direction.
      # Over-rebuilding costs a few minutes; under-rebuilding deploys code
      # that is not the code in the commit.
      - name: Resolve deployment-manager source key
        id: dmkey
        run: |
          key="$(git rev-parse HEAD:rust-backend)"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "asset=deploy-linux-x64-$key" >> "$GITHUB_OUTPUT"
          echo "rust-backend source tree: $key"

      - name: Fetch prebuilt deployment-manager binary
        id: dm
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild_manager }}
          ASSET: ${{ steps.dmkey.outputs.asset }}
        run: |
          mkdir -p rust-backend/target/release
          if [ "$REBUILD" = "true" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "rebuild_manager flag set — compiling a fresh binary."
          elif gh release download deployment-manager-bin \
                 --pattern "$ASSET" \
                 --output rust-backend/target/release/deploy 2>/dev/null; then
            chmod +x rust-backend/target/release/deploy
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
            echo "Using cached $ASSET — built from this exact rust-backend tree."
          else
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            echo "No cached binary for $ASSET — compiling from this commit."
          fi

      # ── 4. Build the deployment manager (only when rebuilding) ───
      - uses: dtolnay/rust-toolchain@stable
        if: steps.dm.outputs.rebuild == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.dm.outputs.rebuild == 'true'
        with:
          workspaces: rust-backend

      - name: Install build dependencies
        if: steps.dm.outputs.rebuild == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev clang cmake protobuf-compiler

      - name: Build deployment manager
        if: steps.dm.outputs.rebuild == 'true'
        working-directory: rust-backend
        run: cargo build --release -p deployment-manager

      # ── 5. Publish the freshly built binary for next time ────────
      # Uploaded under its source key, so the next run for this tree hits the
      # cache and any other tree misses it. Old keys are pruned to bound the
      # release: each binary is ~48 MB.
      - name: Upload deployment-manager binary
        if: steps.dm.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.dmkey.outputs.asset }}
        run: |
          gh release view deployment-manager-bin >/dev/null 2>&1 || \
            gh release create deployment-manager-bin \
              --prerelease \
              --title "deployment-manager binary" \
              --notes "Prebuilt linux x86_64 deployment-manager binaries, auto-updated by the redeploy-contract workflow. Each asset is named deploy-linux-x64-<rust-backend tree hash>. Not a real release."
          cp rust-backend/target/release/deploy "/tmp/$ASSET"
          gh release upload deployment-manager-bin "/tmp/$ASSET" --clobber
          echo "Uploaded $ASSET."

          # The pre-SO-356 unversioned asset has no provable source and must
          # never be served again. Drop it on first sight; the guard makes
          # this a no-op once it is gone.
          # SC2015: not an if-then-else — the `|| true` is the no-op guard for
          # the delete, and the echo it also catches cannot fail.
          # shellcheck disable=SC2015
          gh release delete-asset deployment-manager-bin deploy-linux-x64 --yes 2>/dev/null \
            && echo "Deleted the legacy unkeyed deploy-linux-x64 asset." || true

          # Keep the newest 5 keyed binaries.
          gh release view deployment-manager-bin --json assets --jq '
            .assets
            | map(select(.name | startswith("deploy-linux-x64-")))
            | sort_by(.createdAt) | reverse | .[5:] | .[].name' \
          | while read -r stale; do
              [ -n "$stale" ] || continue
              gh release delete-asset deployment-manager-bin "$stale" --yes
              echo "Pruned $stale."
            done

      # ── 6. Fetch deployer key from Secrets Manager ───────────────
      - name: Write secrets file
        env:
          ENV: ${{ inputs.environment }}
          NETWORK: ${{ steps.net.outputs.network }}
        run: |
          # Holds the deployer key (AdminCap owner) — the canonical signing
          # key for publishes. The secret is still named `scheduler` for
          # historical reasons; the service of that name is gone.
          SCHEDULER_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "options/$ENV/scheduler" \
            --query SecretString --output text)
          SUI_KEY=$(echo "$SCHEDULER_JSON" | jq -r '.sui_key')

          if [ -z "$SUI_KEY" ] || [ "$SUI_KEY" = "null" ]; then
            echo "::error::No sui_key in options/$ENV/scheduler secret"
            exit 1
          fi

          # Carry the shared chain endpoints through so the deployment
          # manager resolves them exactly like every deployed service does
          # (render-secrets.sh convention). Absent secret → the binary falls
          # back to the public gRPC endpoint, which works.
          GRPC_FROM_SECRET=""
          if RPC_JSON=$(aws secretsmanager get-secret-value \
                --secret-id "options/$ENV/sui-rpc" \
                --query SecretString --output text 2>/dev/null); then
            GRPC_FROM_SECRET=$(echo "$RPC_JSON" | jq -r '.grpc_url // empty')
            [ "$GRPC_FROM_SECRET" = "REPLACE_ME" ] && GRPC_FROM_SECRET=""
          fi

          # Shell vars don't survive across steps — export for the
          # mm_collateral step below.
          echo "GRPC_FROM_SECRET=$GRPC_FROM_SECRET" >> "$GITHUB_ENV"

          mkdir -p /tmp/deploy-secrets
          {
            printf '[sui]\n%s = "%s"\n' "$NETWORK" "$SUI_KEY"
            if [ -n "$GRPC_FROM_SECRET" ]; then
              printf 'grpc_url = "%s"\n' "$GRPC_FROM_SECRET"
            fi
          } > /tmp/deploy-secrets/secrets.toml

      # ── 7. Run deployment manager ────────────────────────────────
      - name: Deploy contract on-chain
        working-directory: rust-backend
        env:
          NETWORK: ${{ steps.net.outputs.network }}
          ENV: ${{ inputs.environment }}
          GRPC_URL: ${{ inputs.grpc_url }}
          GAS_BUDGET: ${{ inputs.gas_budget }}
          INGRESS_MEMBERS: ${{ vars.INGRESS_MEMBERS_STAGING }}
        run: |
          ARGS=(
            --env        "$ENV"
            --network    "$NETWORK"
            --output     deployments.json
            --secrets    /tmp/deploy-secrets/secrets.toml
            # Ceiling per publish tx. The gas coin must hold at least this
            # much before EVERY package publish, so an oversized budget
            # fails a half-funded deployer even when actual costs fit
            # (observed 2026-08-04: 2 SUI budget vs 0.27 SUI max real
            # gross — the run died with plenty of gas for the work).
            # Dispatch input; default stays the historical 2 SUI.
            --gas-budget "$GAS_BUDGET"
          )
          if [ "${{ inputs.deploy_tokens }}" = "true" ]; then
            ARGS+=(--deploy-tokens)
          fi
          if [ -n "$GRPC_URL" ]; then
            ARGS+=(--grpc "$GRPC_URL")
          fi
          # Ingress whitelist members (guarded launch): comma-separated
          # addresses in the INGRESS_MEMBERS_STAGING repo variable, kept
          # out of the workflow file so service-wallet changes don't need
          # a commit. The deployer is always seeded automatically.
          if [ -n "$INGRESS_MEMBERS" ]; then
            IFS=',' read -ra MEMBERS <<< "$INGRESS_MEMBERS"
            for member in "${MEMBERS[@]}"; do
              ARGS+=(--ingress-member "$member")
            done
          fi
          ./target/release/deploy "${ARGS[@]}"

      # ── 7b. Re-publish mm_collateral against the fresh options_core ──
      # The mm-collateral template deps on core by LOCAL path, so every core
      # republish orphans the previous collateral package — without this,
      # mm-bot refuses to boot and its health gate rolls back the deploy.
      # Signs with the MM-BOT key (the CollateralAccount must be owned by the
      # bot's signer, not the deployer). Absent secret = mm-bot isn't deployed
      # in this env (render-secrets convention) — skip. The state file is
      # committed below and rides the deploy bundle onto the host
      # (/opt/options/<env>/mm-bot), so it stays fresh under ALL build
      # strategies — no image rebuild assumed.
      #
      # The same pass also creates the deployment's QuoteSigner (owner = the
      # MM-BOT key's address) and records quoteSignerId in deployments.json,
      # so mm-bot adopts it via token-info instead of bootstrapping at boot —
      # which needs gas at an unpredictable moment and once wedged the whole
      # deploy (SO-346 gas famine).
      - name: Publish mm_collateral + QuoteSigner
        working-directory: rust-backend
        env:
          ENV: ${{ inputs.environment }}
          NETWORK: ${{ steps.net.outputs.network }}
          GRPC_URL: ${{ inputs.grpc_url }}
        run: |
          if ! MM_JSON=$(aws secretsmanager get-secret-value \
                --secret-id "options/$ENV/mm-bot" \
                --query SecretString --output text 2>/dev/null); then
            echo "options/$ENV/mm-bot secret absent — mm-bot not deployed here; skipping"
            exit 0
          fi
          MM_KEY=$(echo "$MM_JSON" | jq -r '.sui_key')
          if [ -z "$MM_KEY" ] || [ "$MM_KEY" = "null" ]; then
            echo "::error::options/$ENV/mm-bot exists but has no sui_key"
            exit 1
          fi
          # quote_key derives the pubkey registered on the fresh QuoteSigner;
          # render-secrets.sh already hard-requires it on the host, so its
          # absence here is a broken secret, not an optional feature.
          MM_QUOTE_KEY=$(echo "$MM_JSON" | jq -r '.quote_key')
          if [ -z "$MM_QUOTE_KEY" ] || [ "$MM_QUOTE_KEY" = "null" ]; then
            echo "::error::options/$ENV/mm-bot exists but has no quote_key"
            exit 1
          fi
          {
            printf '[sui]\n%s = "%s"\n' "$NETWORK" "$MM_KEY"
            if [ -n "$GRPC_FROM_SECRET" ]; then
              printf 'grpc_url = "%s"\n' "$GRPC_FROM_SECRET"
            fi
            printf '[mm_bot]\nquote_key = "%s"\n' "$MM_QUOTE_KEY"
          } > /tmp/deploy-secrets/mm-secrets.toml

          ARGS=(
            --env        "$ENV"
            --network    "$NETWORK"
            --secrets    /tmp/deploy-secrets/mm-secrets.toml
            --deploy-mm-collateral
          )
          if [ -n "$GRPC_URL" ]; then
            ARGS+=(--grpc "$GRPC_URL")
          fi
          ./target/release/deploy "${ARGS[@]}"

      # ── 8. Resolve the deployment checkpoint from the tx digest ──
      - name: Get deployment checkpoint
        id: checkpoint
        env:
          NETWORK: ${{ steps.net.outputs.network }}
          ENV: ${{ inputs.environment }}
          GRPC_URL: ${{ inputs.grpc_url }}
        run: |
          # deployments.json is keyed by env now; the network only picks the
          # endpoint.
          DIGEST=$(jq -r ".[\"$ENV\"].package_info.publishDigest" \
            rust-backend/deployments.json)

          # The lookup goes through the Sui GraphQL RPC (JSON-RPC is
          # deactivated on Sui fullnodes — see
          # docs/sui-json-rpc-migration.md). A custom grpc_url still overrides
          # the *publish* step above, but this read always uses the public
          # GraphQL endpoint for the network.
          case "$NETWORK" in
            testnet) GRAPHQL="https://graphql.testnet.sui.io/graphql" ;;
            mainnet) GRAPHQL="https://graphql.mainnet.sui.io/graphql" ;;
          esac

          # Retry a few times — the RPC may lag behind the publish.
          for attempt in 1 2 3 4 5; do
            RESULT=$(curl -sf "$GRAPHQL" \
              -H "Content-Type: application/json" \
              -d "{
                \"query\": \"query(\$d: String!) { transaction(digest: \$d) { effects { checkpoint { sequenceNumber } } } }\",
                \"variables\": { \"d\": \"$DIGEST\" }
              }")

            CHECKPOINT=$(echo "$RESULT" | jq -r '.data.transaction.effects.checkpoint.sequenceNumber // empty')
            if [ -n "$CHECKPOINT" ]; then
              break
            fi
            echo "Attempt $attempt: checkpoint not yet available, retrying in 5s…"
            sleep 5
          done

          if [ -z "$CHECKPOINT" ]; then
            echo "::error::Could not resolve checkpoint for digest $DIGEST"
            exit 1
          fi

          START=$((CHECKPOINT - 1))
          echo "checkpoint=$CHECKPOINT" >> "$GITHUB_OUTPUT"
          echo "start_checkpoint=$START" >> "$GITHUB_OUTPUT"
          echo "Contract deployed at checkpoint $CHECKPOINT → indexer starts at $START"

      # ── 9. Update indexer config with the new start_checkpoint ───
      - name: Update indexer start_checkpoint
        env:
          ENV: ${{ inputs.environment }}
          START: ${{ steps.checkpoint.outputs.start_checkpoint }}
        run: |
          CONFIG="rust-backend/services/indexer/config/config.${ENV}.toml"

          # Remove any existing start_checkpoint block (comment + value).
          # Uses sed ranges to catch multi-line comment blocks above the key.
          sed -i '/^#.*[Bb]ackfill/,/^start_checkpoint/d' "$CONFIG"
          sed -i '/^#.*Auto-set by redeploy/,/^start_checkpoint/d' "$CONFIG"
          sed -i '/^start_checkpoint/d' "$CONFIG"
          # Trim trailing blank lines.
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' "$CONFIG"

          # Append the new value.
          printf '\n# Auto-set by redeploy-contract workflow.\nstart_checkpoint = %s\n' \
            "$START" >> "$CONFIG"

      # ── 10. Upload the DB-wipe script to S3 for EC2 ─────────────
      # Only the provisioning script needs to reach the box here. The new
      # deployments.json rides along in the deploy job's bundle (which checks
      # out this commit via `ref`) and lands on the host bind-mount; the indexer
      # config is read from the image config dir as before.
      - name: Upload redeploy bundle
        id: bundle
        env:
          ENV: ${{ inputs.environment }}
        run: |
          TS=$(date +%s)
          # Park under deploy-bundles/ — the only prefix the EC2 instance
          # role is allowed to GetObject from on this bucket (see iam.tf).
          BUNDLE_KEY="deploy-bundles/redeploy-${ENV}-${TS}.tgz"

          mkdir -p /tmp/redeploy-bundle
          cp rust-backend/deployment/ec2/wipe-provision-db.sh /tmp/redeploy-bundle/
          # render-secrets.sh seeds /opt/options/<env>/secrets/.db_password,
          # which wipe-provision-db.sh requires. On a fresh box (e.g. the new
          # prod host's first bootstrap) that file doesn't exist yet — the
          # deploy job that normally writes it runs AFTER this reset step.
          cp rust-backend/deployment/ec2/render-secrets.sh /tmp/redeploy-bundle/
          tar czf /tmp/redeploy-bundle.tgz -C /tmp/redeploy-bundle .

          aws s3 cp /tmp/redeploy-bundle.tgz \
            "s3://${SSM_OUTPUT_BUCKET}/${BUNDLE_KEY}"

          echo "key=$BUNDLE_KEY" >> "$GITHUB_OUTPUT"

      # ── 11. SSM: stop indexer/orderbook, wipe DBs ──────────────────
      # Does NOT restart anything — the deploy job rebuilds + rolls out the
      # whole stack afterward.
      - name: Reset databases on EC2
        env:
          ENV: ${{ inputs.environment }}
          NETWORK: ${{ steps.net.outputs.network }}
          BUNDLE_KEY: ${{ steps.bundle.outputs.key }}
        run: |
          # ── MAINNET GUARD ──
          # Re-asserted here rather than trusted from step 1, because this is
          # the step that destroys data and it should not depend on an earlier
          # step's output still being what it was.
          #
          # Inverted deliberately: refuse unless provably testnet. The old
          # form ("refuse if mainnet") proceeded on every other answer,
          # including "cannot tell".
          bash rust-backend/deployment/assert_testnet.sh "$ENV" >/dev/null

          # The schema reset (DROP/CREATE SCHEMA) must run as the RDS
          # master. The per-env indexer_<env> role owns its tables (so it
          # can DROP the schema) but lacks CREATE on the database, so it
          # cannot recreate the public schema. The master owns every db.
          MASTER_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "options/_master/db" \
            --query SecretString --output text)
          MASTER_USER=$(echo "$MASTER_JSON" | jq -r '.username')
          MASTER_PASS=$(echo "$MASTER_JSON" | jq -r '.password')

          # SSM commands run under /bin/sh (dash on Ubuntu); keep this
          # set -eu (no pipefail). deploy.sh itself is bash.
          jq -nc \
            --arg env "$ENV" \
            --arg network "$NETWORK" \
            --arg db_host "$RDS_HOST" \
            --arg master_user "$MASTER_USER" \
            --arg master_pass "$MASTER_PASS" \
            --arg bucket "$SSM_OUTPUT_BUCKET" \
            --arg bundle_key "$BUNDLE_KEY" \
            --arg region "$AWS_REGION" '
            {
              commands: [
                "set -eu",

                "# ── MAINNET GUARD (belt + suspenders) ──",
                "# Inverted: proceed only on a proven testnet. The previous",
                "# form refused mainnet and proceeded on anything else,",
                "# including an empty or unset value.",
                "# The network is bracketed, not apostrophised: an apostrophe",
                "# here closes the shell single quote that wraps this whole jq",
                "# program, and bash then dies on the now-bare paren before the",
                "# step makes a single AWS call (SO-342).",
                "if [ \"\($network)\" != \"testnet\" ]; then echo \"FATAL: refusing network [\($network)] — testnet only\"; exit 1; fi",

                "cd /opt/options/\($env)",
                "COMPOSE_FILE=\"docker-compose.\($env).yml\"",

                "# ── 1. Stop the services whose DBs we wipe ──",
                "docker compose -f \"$COMPOSE_FILE\" stop indexer orderbook || true",
                "echo \"indexer + orderbook stopped\"",

                "# ── 2. Download updated files + provisioning script from S3 ──",
                "aws s3 cp \"s3://\($bucket)/\($bundle_key)\" /tmp/redeploy-bundle.tgz --region \($region)",
                "mkdir -p /tmp/redeploy",
                "tar xzf /tmp/redeploy-bundle.tgz -C /tmp/redeploy",
                "chmod +x /tmp/redeploy/wipe-provision-db.sh /tmp/redeploy/render-secrets.sh",

                "# ── 3. Seed .db_password (fresh box may not have it yet) ──",
                "# render-secrets.sh writes /opt/options/<env>/secrets/.db_password,",
                "# which wipe-provision-db.sh reads for the per-env role password.",
                "/tmp/redeploy/render-secrets.sh \($env | @sh)",

                "# ── 4. Wipe + provision the indexer and orderbook DBs ──",
                "# Vault-APY rows now live in the price-charting Timescale DB keyed by the",
                "# new vault ids; old-vault rows simply orphan (harmless), so there is no",
                "# APY DB to wipe here anymore (folded out of derived-metric-worker).",
                "# orderbook included: the exchange package republishes every",
                "# redeploy, so resting orders/fills reference dead registries.",
                "for svc in indexer orderbook; do DB_HOST=\($db_host | @sh) MASTER_USER=\($master_user | @sh) MASTER_PASS=\($master_pass | @sh) sh /tmp/redeploy/wipe-provision-db.sh \($env | @sh) \"$svc\"; done",

                "# The mm-bot needs no reset — it resolves its Account from",
                "# chain state for the current package on boot, bootstrapping a",
                "# fresh one if none exists yet.",
                "# indexer + orderbook are left STOPPED on purpose — the",
                "# deploy job rolls the whole stack (rebuilding or pulling the",
                "# latest images per build_strategy, and dropping the new",
                "# deployments.json on the host) and `docker compose up -d`s it,",
                "# starting them fresh on the wiped DBs (migrations run on connect).",
                "# Cleanup",
                "rm -rf /tmp/redeploy /tmp/redeploy-bundle.tgz",
                "echo \"DB reset complete (\($env)) — handing off to rebuild/deploy\""
              ]
            }' > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "redeploy-contract $ENV" \
            --parameters file:///tmp/ssm-params.json \
            --output-s3-bucket-name "$SSM_OUTPUT_BUCKET" \
            --timeout-seconds 300 \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # Wait for completion. `aws ssm wait` gives up after ~100s and
          # the two-database wipe-provision can legitimately run longer
          # (observed 2026-08-04: the waiter expired on InProgress and
          # failed the run; the command reached Success seconds later).
          # Poll to a real deadline instead — 10 min, comfortably above
          # the command's own 300s execution timeout.
          STATUS=InProgress
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done
          echo "SSM status: $STATUS"

          # Print stdout.
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM command failed with status $STATUS"
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi

      # ── 12. Commit and push changes to git ──────────────────────
      # Must push BEFORE the deploy job runs: that job checks out this exact
      # commit (via the `ref` it receives) so its bundle ships this
      # deployments.json + the rebuilt images carry the indexer config.
      - name: Commit updated files
        id: commit
        env:
          ENV: ${{ inputs.environment }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add rust-backend/deployments.json
          git add "rust-backend/services/indexer/config/config.${ENV}.toml"
          # Each package publish rewrites its Published.toml to the fresh id;
          # keep the repo's record in sync with what's live.
          # The contracts/.deprecated/ packages (vault, auction, rfq) are not
          # in this list: they are no longer published, so their
          # Published.toml files are stale by design and must not be
          # re-stamped.
          git add contracts/core/Published.toml \
                  contracts/exchange/Published.toml
          # mm-bot collateral routing for the fresh core (absent when this
          # env has no mm-bot). Ships to the host in the deploy bundle.
          git add rust-backend/services/mm-bot/config/collateral.*.toml || true

          git commit -m "[redeploy] Fresh ${ENV} contract deployment" \
            -m "Network: ${{ steps.net.outputs.network }}" \
            -m "Deployment checkpoint: ${{ steps.checkpoint.outputs.checkpoint }}" \
            -m "Indexer start_checkpoint: ${{ steps.checkpoint.outputs.start_checkpoint }}"
          # The branch may have moved during the ~15-minute publish (run
          # 31353090511 lost a whole successful deploy to a mid-run merge:
          # the push was rejected and deployments.json only existed in this
          # workspace). Rebase our single commit onto the current tip —
          # none of the files this step commits are edited by normal PRs,
          # so conflicts are not expected; if one ever happens, failing
          # here is still correct.
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ── Roll out the stack on the new deployment ───────────────────
  # Three mutually exclusive strategies, selected by build_strategy. All check
  # out the commit `publish` just pushed (ref) so the deploy bundle ships the
  # new deployments.json onto the host bind-mount, and all are gated on
  # `publish` so the DB wipe + commit are done before any container comes up.

  # rebuild-all: rebuild every image from the redeploy commit and roll the
  # whole stack — the original behavior, and the only valid choice on a fresh
  # box (no prior images to fall back to).
  deploy-rebuild-all:
    if: ${{ inputs.build_strategy == 'rebuild-all' }}
    needs: publish
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      envs: ${{ format('["{0}"]', inputs.environment) }}
      force_all: true
      ref: ${{ needs.publish.outputs.new_sha }}

  # latest / latest-build-token-info (pass 1): skip all builds and roll every
  # service on the last deployed images (deployed-<env> sha). The new
  # deployments.json still reaches token-info via the bundle, so the stack is
  # correct against the fresh contract without a single rebuild.
  deploy-latest:
    if: ${{ inputs.build_strategy == 'latest' || inputs.build_strategy == 'latest-build-token-info' }}
    needs: publish
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      envs: ${{ format('["{0}"]', inputs.environment) }}
      image_tag: ${{ needs.publish.outputs.latest_tag }}
      ref: ${{ needs.publish.outputs.new_sha }}

  # latest-build-token-info (pass 2): after the latest-image roll, rebuild +
  # roll ONLY token-info from the redeploy commit. Sequenced after deploy-latest
  # so token-info ends on the freshly built image.
  deploy-token-info:
    if: ${{ inputs.build_strategy == 'latest-build-token-info' }}
    needs: [publish, deploy-latest]
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      envs: ${{ format('["{0}"]', inputs.environment) }}
      only_services: '["token-info"]'
      ref: ${{ needs.publish.outputs.new_sha }}

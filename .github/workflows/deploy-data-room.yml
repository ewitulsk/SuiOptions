name: Deploy data-room

# Build + push the two data-room images (data-room-collector,
# data-room-batch) and roll data-room-host. Deliberately SEPARATE from
# _deploy.yml (spec §10.1): no health-check-gated rollback choreography —
# the deploy is "advance TAG in /opt/data-room/.env, compose pull, up -d
# collector". Batch jobs pick up the new tag on their next timer firing.
# Rollback = re-dispatch with the previous tag.
#
# The registry repos (options/data-room-collector, options/data-room-batch)
# live in DOCR; the first push to a new name auto-creates the repo.

on:
  push:
    branches: [staging]
    paths:
      - 'rust-backend/data-room/**'
      - '.github/workflows/deploy-data-room.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy. Empty = build HEAD and deploy its 12-char sha tag. Non-empty = skip build and roll the given tag (rollback path; must already exist in the registry).'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  # ECR_REGISTRY keeps its historical name; since the DO migration its
  # value is the DOCR registry (registry.digitalocean.com/<team>).
  ECR_REGISTRY:   ${{ vars.ECR_REGISTRY }}
  DATA_ROOM_HOST: ${{ vars.DATA_ROOM_HOST }}

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag:        ${{ steps.tag.outputs.tag }}
      skip_build: ${{ steps.tag.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        env:
          OVERRIDE_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$OVERRIDE_TAG" ]; then
            echo "tag=$OVERRIDE_TAG" >> "$GITHUB_OUTPUT"
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "tag override → skipping build, deploying $OVERRIDE_TAG"
          else
            echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    if: needs.tag.outputs.skip_build == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [collector, batch]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: DOCR login
        run: doctl registry login --expiry-seconds 3600

      - uses: docker/setup-buildx-action@v3

      # Context is rust-backend/ (the merged workspace root, SO-449), NOT
      # data-room/ and not the repo root: the Dockerfiles copy only the root
      # manifest + lock and data-room/, then scope the workspace down to the
      # data-room members (data-room/scope-workspace.sh).
      # linux/amd64 native on the x86 runner — same platform stance as
      # deployment/bake.hcl; per-image gha cache scopes.
      - name: Build & push data-room-${{ matrix.image }}
        env:
          ECR: ${{ env.ECR_REGISTRY }}
          IMAGE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          docker buildx build rust-backend \
            --file "rust-backend/data-room/Dockerfile.${{ matrix.image }}" \
            --platform linux/amd64 \
            --tag "$ECR/options/data-room-${{ matrix.image }}:$IMAGE_TAG" \
            --cache-from "type=gha,scope=data-room-${{ matrix.image }}" \
            --cache-to "type=gha,mode=max,scope=data-room-${{ matrix.image }}" \
            --push

  deploy:
    needs: [tag, build]
    if: |
      always()
      && needs.tag.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-data-room
      cancel-in-progress: false
    steps:
      - name: Resolve data-room-host
        id: host
        run: |
          if [ -z "$DATA_ROOM_HOST" ]; then
            echo "::error::DATA_ROOM_HOST var not set"
            exit 1
          fi
          echo "addr=$DATA_ROOM_HOST" >> "$GITHUB_OUTPUT"

      - name: Set up deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST_ADDR" >> ~/.ssh/known_hosts 2>/dev/null

      # compose.yml + collector.toml + the systemd units are provisioned on
      # the host out-of-band (by hand, from rust-backend/data-room/deploy/); this
      # workflow only moves the tag — spec §10.3.
      - name: SSH deploy
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          SSH="ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@$HOST_ADDR"

          # NOTE: the registry prefix travels as ECR_BASE, not ECR — docker
          # compose lets the process environment override .env, so an
          # exported ECR here would clobber the /options-suffixed value the
          # compose file needs (bit us on the first DO deploy).
          $SSH env \
            "TAG=$TAG" \
            "ECR_BASE=$ECR_REGISTRY" \
            bash -s <<'REMOTE'
          set -euo pipefail
          mkdir -p /opt/data-room
          touch /opt/data-room/.env
          # Rewrite only TAG + ECR; operator-set lines survive.
          sed -i "/^TAG=/d;/^ECR=/d" /opt/data-room/.env
          echo "TAG=$TAG" >> /opt/data-room/.env
          echo "ECR=$ECR_BASE/options" >> /opt/data-room/.env
          docker login registry.digitalocean.com --username "$(cat /opt/options/docr-token)" --password-stdin < /opt/options/docr-token
          cd /opt/data-room
          # Pull both images (batch rides the same TAG for the next
          # timer firing); only the collector is a long-lived service.
          docker compose --profile batch pull
          docker compose up -d collector
          REMOTE

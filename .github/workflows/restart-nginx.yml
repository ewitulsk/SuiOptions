name: Restart nginx

# Manually restart (or reload) the nginx sidecar on a given env.
# Useful after pushing a config-only change or if nginx gets into a bad
# state. "restart" recreates the container (picks up new bind-mounted
# nginx.conf). "reload" sends SIGHUP for a zero-downtime config reload.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment(s)'
        required: true
        type: choice
        options:
          - all
          - dev
          - staging
          - prod
        default: all
      action:
        description: 'restart = full container restart; reload = nginx -s reload (no downtime)'
        required: true
        type: choice
        options:
          - restart
          - reload
        default: restart

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION:        ${{ vars.AWS_REGION }}
  EC2_INSTANCE_ID:   ${{ vars.EC2_INSTANCE_ID }}
  DEPLOY_ROLE_ARN:   ${{ vars.DEPLOY_ROLE_ARN }}
  SSM_OUTPUT_BUCKET: ${{ vars.SSM_OUTPUT_BUCKET }}

jobs:
  restart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ inputs.environment == 'all' && fromJson('["dev","staging","prod"]') || fromJson(format('["{0}"]', inputs.environment)) }}
      fail-fast: false
    concurrency:
      group: deploy-${{ matrix.env }}
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SSM ${{ inputs.action }} nginx (${{ matrix.env }})
        env:
          DEPLOY_ENV: ${{ matrix.env }}
          ACTION: ${{ inputs.action }}
        run: |
          case "$DEPLOY_ENV" in
            dev)     COMPOSE_FILE="docker-compose.dev.yml" ;;
            staging) COMPOSE_FILE="docker-compose.staging.yml" ;;
            prod)    COMPOSE_FILE="docker-compose.prod.yml" ;;
          esac

          if [ "$ACTION" = "reload" ]; then
            CMD="docker compose -f /opt/options/$DEPLOY_ENV/$COMPOSE_FILE exec nginx nginx -s reload"
          else
            CMD="docker compose -f /opt/options/$DEPLOY_ENV/$COMPOSE_FILE restart nginx"
          fi

          jq -nc --arg cmd "$CMD" --arg env "$DEPLOY_ENV" --arg action "$ACTION" '{
            commands: [
              "set -eu",
              $cmd,
              "echo \($action) nginx ok (\($env))"
            ]
          }' > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "$ACTION nginx $DEPLOY_ENV" \
            --parameters file:///tmp/ssm-params.json \
            --output-s3-bucket-name "$SSM_OUTPUT_BUCKET" \
            --query Command.CommandId --output text)
          echo "ssm command: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text)
          echo "ssm status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi

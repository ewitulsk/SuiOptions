name: Reload nginx

# Ship the current deployment/nginx/nginx.<env>.conf to the droplet and
# hot-reload the nginx sidecar — WITHOUT rebuilding or rolling any service.
#
# Use after merging an nginx-config-only change. A normal "Deploy lower
# envs" run would also work, but because the config lives under
# deployment/** the affected-files filter treats it as rebuild-all and
# rolls every service just to reload nginx. This is the lightweight path.
#
# Safety: the new config is validated with `nginx -t` *before* the reload.
# If validation fails the previous config is restored and the job fails,
# leaving the running nginx untouched.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod
        default: staging

permissions:
  contents: read

env:
  STAGING_HOST: ${{ vars.STAGING_HOST }}
  PROD_HOST:    ${{ vars.PROD_HOST }}

jobs:
  reload:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4   # for nginx.<env>.conf

      - name: Resolve target host
        id: host
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          case "$DEPLOY_ENV" in
            staging) addr="$STAGING_HOST" ;;
            prod)    addr="$PROD_HOST" ;;
            *) echo "::error::unknown env $DEPLOY_ENV"; exit 1 ;;
          esac
          if [ -z "$addr" ]; then
            echo "::error::no host var set for $DEPLOY_ENV"; exit 1
          fi
          echo "addr=$addr" >> "$GITHUB_OUTPUT"

      - name: Set up deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST_ADDR" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship config + reload nginx
        env:
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          # Stage the new config at a run-scoped tmp path; the remote script
          # moves it into place only after `nginx -t` passes. The nginx host
          # ports mirror deploy.sh (staging 9020 / prod 9030).
          SSH="ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@$HOST_ADDR"

          scp "rust-backend/deployment/nginx/nginx.${ENVIRONMENT}.conf" \
            "root@$HOST_ADDR:/tmp/nginx-reload-${{ github.run_id }}.conf"

          $SSH env \
            "DEPLOY_ENV=$ENVIRONMENT" \
            "NEW_CONF=/tmp/nginx-reload-${{ github.run_id }}.conf" \
            bash -s <<'REMOTE'
          set -euo pipefail
          cd "/opt/options/$DEPLOY_ENV"
          COMPOSE="docker-compose.$DEPLOY_ENV.yml"
          case "$DEPLOY_ENV" in staging) PORT=9020;; prod) PORT=9030;; esac
          mv "$NEW_CONF" nginx/nginx.conf.new
          # Ensure the sidecar is running on its CURRENT (known-good) config first.
          docker compose -f "$COMPOSE" up -d nginx
          # Swap in the new file (directory is bind-mounted, so the
          # container sees it by path on the next open). Keep a backup.
          cp nginx/nginx.conf nginx/nginx.conf.bak
          mv nginx/nginx.conf.new nginx/nginx.conf
          # Validate BEFORE reloading; restore + fail if the config is bad.
          if ! docker compose -f "$COMPOSE" exec -T nginx nginx -t -c /etc/nginx/options/nginx.conf; then
            echo "nginx -t failed — restoring previous config" >&2
            mv nginx/nginx.conf.bak nginx/nginx.conf
            exit 1
          fi
          rm -f nginx/nginx.conf.bak
          docker compose -f "$COMPOSE" exec -T nginx nginx -s reload
          echo "nginx reloaded — probing /$DEPLOY_ENV/api/health ..."
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS "http://localhost:$PORT/$DEPLOY_ENV/api/health" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then echo "health probe failed after reload" >&2; exit 1; fi
          echo "reload ok ($DEPLOY_ENV)"
          REMOTE

# TEMPORARY — regenerates rust-backend/Cargo.lock on the branch and commits
# it back. Exists only because the branch's lock is missing the
# token-info-client entry for vault-messenger and it could not be pushed
# directly. Delete this file once the lock commit lands.
#
# Triggered by pushes touching this file itself (the commit adding this
# trigger starts the run); the lockfile commit it pushes does not
# re-trigger it.

name: Regen Cargo.lock

on:
  push:
    branches: [claude/multichain-trading-vault-wer9q0]
    paths: ['.github/workflows/regen-cargo-lock.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `cargo metadata` syncs Cargo.lock with the manifests without
      # building anything.
      - name: Sync lockfile
        working-directory: rust-backend
        run: cargo metadata --format-version 1 > /dev/null

      - name: Commit lockfile if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- rust-backend/Cargo.lock; then
            echo "lockfile already in sync — nothing to commit"
            exit 0
          fi
          git add rust-backend/Cargo.lock
          git commit -m "Cargo.lock: sync vault-messenger dependencies"
          git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
          git push

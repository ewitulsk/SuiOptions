# Wipe + redeploy the leaderboard subsystem (go-backend): stop leaderboard +
# event-ingestor, wipe BOTH their databases (leaderboard_<env> AND
# event_ingestor_<env> — points ledger, tracked packages/rules, cursors, and
# the deliveries audit log all reset together so no stale delivery/cursor
# state survives a points wipe), then rebuild the two go images from the
# dispatched ref and roll them. Migrations re-provision the schemas at boot;
# the admin re-adds packages/rules through the /admin UI afterwards.
#
# This is deliberately SEPARATE from redeploy-contract.yml: a Move-package
# redeploy neither wipes nor rolls the go-backend services (they carry
# exclude_services there), and this workflow touches nothing else — no Rust
# builds, no indexer/orderbook wipe, no deployments.json.
#
# Guards mirror wipe-provision-db.yml: the env must be provably testnet
# (assert_testnet.sh), and prod additionally requires typing "prod".

name: Redeploy Leaderboard

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod
      confirm:
        description: "Type the env name to confirm (required for prod — it WIPES both leaderboard DBs)."
        required: false
        type: string
        default: ''

permissions:
  contents: write   # _deploy.yml's deploy job declares contents: write

env:
  DB_HOST:      ${{ vars.DB_HOST }}
  STAGING_HOST: ${{ vars.STAGING_HOST }}
  PROD_HOST:    ${{ vars.PROD_HOST }}

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      # ── 0. Checkout (for the script + the testnet guard) ─────────
      - uses: actions/checkout@v4

      # ── 1. Guards ────────────────────────────────────────────────
      - name: Guards
        id: guard
        env:
          ENV: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          NETWORK="$(bash rust-backend/deployment/assert_testnet.sh "$ENV")"
          echo "resolved network for $ENV: $NETWORK"
          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"
          if [ "$ENV" = "prod" ] && [ "$CONFIRM" != "prod" ]; then
            echo "::error::prod requires typing 'prod' into the confirm input"
            exit 1
          fi

      # ── 2. Resolve the target droplet + SSH key ──────────────────
      - name: Resolve target host
        id: host
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          case "$DEPLOY_ENV" in
            staging) addr="$STAGING_HOST" ;;
            prod)    addr="$PROD_HOST" ;;
            *) echo "::error::unknown env $DEPLOY_ENV"; exit 1 ;;
          esac
          if [ -z "$addr" ]; then
            echo "::error::no host var set for $DEPLOY_ENV"; exit 1
          fi
          echo "addr=$addr" >> "$GITHUB_OUTPUT"

      - name: Set up deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST_ADDR" >> ~/.ssh/known_hosts 2>/dev/null

      # ── 3. Fetch master DB creds (SOPS) ──────────────────────────
      - name: Install sops
        run: |
          sudo curl -fsSL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo chmod +x /usr/local/bin/sops

      - name: Fetch master DB creds
        id: master
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          ENV: ${{ inputs.environment }}
        run: |
          # The secrets store is per-env; only staging has been migrated to
          # SOPS so far.
          STORE="rust-backend/deployment/secrets/${ENV}.enc.yaml"
          if [ ! -f "$STORE" ]; then
            echo "::error::no SOPS store at $STORE — $ENV secrets are not yet migrated"
            exit 1
          fi
          MASTER_JSON=$(sops decrypt --extract '["_master/db"]' "$STORE")
          echo "user=$(echo "$MASTER_JSON" | jq -r '.username')" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(echo "$MASTER_JSON" | jq -r '.password')"
          echo "pass=$(echo "$MASTER_JSON" | jq -r '.password')" >> "$GITHUB_OUTPUT"

      # ── 4. Ship the provisioning script to the host ──────────────
      - name: Upload script
        env:
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          scp rust-backend/deployment/ec2/wipe-provision-db.sh \
            "root@$HOST_ADDR:/tmp/wipe-provision-db.sh"

      # ── 5. SSH: stop both services → wipe both DBs ───────────────
      # The services stay STOPPED; the deploy job below brings them back up
      # on freshly built images (embedded migrations re-provision the
      # schemas on connect).
      - name: Stop + wipe on host
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          NETWORK: ${{ steps.guard.outputs.network }}
          MASTER_USER: ${{ steps.master.outputs.user }}
          MASTER_PASS: ${{ steps.master.outputs.pass }}
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          SSH="ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@$HOST_ADDR"

          # The script defaults DB_PORT=25060 / MASTER_DB=defaultdb itself.
          $SSH env \
            "DEPLOY_ENV=$DEPLOY_ENV" \
            "NETWORK=$NETWORK" \
            "DB_HOST=$DB_HOST" \
            "MASTER_USER=$MASTER_USER" \
            "MASTER_PASS=$MASTER_PASS" \
            bash -s <<'REMOTE'
          set -euo pipefail
          # Bracketed, not apostrophised — see SO-342.
          if [ "$NETWORK" != "testnet" ]; then echo "FATAL: refusing network [$NETWORK] — testnet only"; exit 1; fi
          cd "/opt/options/$DEPLOY_ENV"
          COMPOSE_FILE="docker-compose.$DEPLOY_ENV.yml"

          chmod +x /tmp/wipe-provision-db.sh

          # ── Stop both go services (if present in this env) ──
          for svc in leaderboard event-ingestor; do
            if docker compose -f "$COMPOSE_FILE" config --services | grep -qx "$svc"; then
              docker compose -f "$COMPOSE_FILE" stop "$svc" || true
              echo "stopped $svc"
            else
              echo "$svc not in compose; skipping stop"
            fi
          done

          # ── Wipe + provision both DBs ──
          for svc in leaderboard event-ingestor; do
            DB_HOST="$DB_HOST" MASTER_USER="$MASTER_USER" MASTER_PASS="$MASTER_PASS" \
              sh /tmp/wipe-provision-db.sh "$DEPLOY_ENV" "$svc"
          done

          rm -f /tmp/wipe-provision-db.sh
          echo "leaderboard + event-ingestor DBs wiped ($DEPLOY_ENV); services left stopped for the deploy roll"
          REMOTE

  # ── Rebuild the two go images from the dispatched ref and roll them ──
  # deploy.sh pulls + up -d, restarting the stopped services on the wiped
  # DBs, then health-checks /{env}/leaderboard/health + /{env}/ingestor/health.
  deploy:
    needs: wipe
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      envs: ${{ format('["{0}"]', inputs.environment) }}
      only_services: '["leaderboard","event-ingestor"]'

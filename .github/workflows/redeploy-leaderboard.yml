# Wipe + redeploy the leaderboard subsystem (go-backend): stop leaderboard +
# event-ingestor, wipe BOTH their databases (leaderboard_<env> AND
# event_ingestor_<env> — points ledger, tracked packages/rules, cursors, and
# the deliveries audit log all reset together so no stale delivery/cursor
# state survives a points wipe), then rebuild the two go images from the
# dispatched ref and roll them. Migrations re-provision the schemas at boot;
# the admin re-adds packages/rules through the /admin UI afterwards.
#
# This is deliberately SEPARATE from redeploy-contract.yml: a Move-package
# redeploy neither wipes nor rolls the go-backend services (they carry
# exclude_services there), and this workflow touches nothing else — no Rust
# builds, no indexer/orderbook wipe, no deployments.json.
#
# Guards mirror wipe-provision-db.yml: the env must be provably testnet
# (assert_testnet.sh), and prod additionally requires typing "prod".

name: Redeploy Leaderboard

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod
      confirm:
        description: "Type the env name to confirm (required for prod — it WIPES both leaderboard DBs)."
        required: false
        type: string
        default: ''

permissions:
  contents: write   # _deploy.yml's deploy job declares contents: write
  id-token: write   # OIDC → AWS

env:
  AWS_REGION:        ${{ vars.AWS_REGION }}
  DEPLOY_ROLE_ARN:   ${{ vars.DEPLOY_ROLE_ARN }}
  RDS_HOST:          ${{ vars.RDS_HOST }}
  SSM_OUTPUT_BUCKET: ${{ vars.SSM_OUTPUT_BUCKET }}

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      # ── 0. Checkout (for the script + the testnet guard) ─────────
      - uses: actions/checkout@v4

      # ── 1. Guards ────────────────────────────────────────────────
      - name: Guards
        id: guard
        env:
          ENV: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          NETWORK="$(bash rust-backend/deployment/assert_testnet.sh "$ENV")"
          echo "resolved network for $ENV: $NETWORK"
          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"
          if [ "$ENV" = "prod" ] && [ "$CONFIRM" != "prod" ]; then
            echo "::error::prod requires typing 'prod' into the confirm input"
            exit 1
          fi

      # ── 2. AWS credentials (OIDC) ────────────────────────────────
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/resolve-ec2
        with:
          region: ${{ env.AWS_REGION }}
          env: ${{ inputs.environment }}

      # ── 3. Fetch RDS master creds ────────────────────────────────
      - name: Fetch master DB creds
        id: master
        run: |
          MASTER_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "options/_master/db" \
            --query SecretString --output text)
          echo "user=$(echo "$MASTER_JSON" | jq -r '.username')" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(echo "$MASTER_JSON" | jq -r '.password')"
          echo "pass=$(echo "$MASTER_JSON" | jq -r '.password')" >> "$GITHUB_OUTPUT"

      # ── 4. Upload the provisioning script to S3 ──────────────────
      - name: Upload script
        id: bundle
        env:
          ENV: ${{ inputs.environment }}
        run: |
          TS=$(date +%s)
          KEY="deploy-bundles/redeploy-leaderboard-${ENV}-${TS}.sh"
          aws s3 cp rust-backend/deployment/ec2/wipe-provision-db.sh \
            "s3://${SSM_OUTPUT_BUCKET}/${KEY}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # ── 5. SSM: stop both services → wipe both DBs ───────────────
      # The services stay STOPPED; the deploy job below brings them back up
      # on freshly built images (embedded migrations re-provision the
      # schemas on connect).
      - name: Stop + wipe on EC2
        env:
          ENV: ${{ inputs.environment }}
          NETWORK: ${{ steps.guard.outputs.network }}
          SCRIPT_KEY: ${{ steps.bundle.outputs.key }}
          MASTER_USER: ${{ steps.master.outputs.user }}
          MASTER_PASS: ${{ steps.master.outputs.pass }}
        run: |
          jq -nc \
            --arg env "$ENV" \
            --arg network "$NETWORK" \
            --arg script_key "$SCRIPT_KEY" \
            --arg db_host "$RDS_HOST" \
            --arg master_user "$MASTER_USER" \
            --arg master_pass "$MASTER_PASS" \
            --arg bucket "$SSM_OUTPUT_BUCKET" \
            --arg region "$AWS_REGION" '
            {
              commands: [
                "set -eu",
                "# Bracketed, not apostrophised: an apostrophe here closes the",
                "# shell single quote that wraps this whole jq program (SO-342).",
                "if [ \"\($network)\" != \"testnet\" ]; then echo \"FATAL: refusing network [\($network)] — testnet only\"; exit 1; fi",
                "cd /opt/options/\($env)",
                "COMPOSE_FILE=\"docker-compose.\($env).yml\"",

                "# ── Download the provisioning script ──",
                "aws s3 cp \"s3://\($bucket)/\($script_key)\" /tmp/wipe-provision-db.sh --region \($region)",
                "chmod +x /tmp/wipe-provision-db.sh",

                "# ── Stop both go services (if present in this env) ──",
                "for svc in leaderboard event-ingestor; do if docker compose -f \"$COMPOSE_FILE\" config --services | grep -qx \"$svc\"; then docker compose -f \"$COMPOSE_FILE\" stop \"$svc\" || true; echo \"stopped $svc\"; else echo \"$svc not in compose; skipping stop\"; fi; done",

                "# ── Wipe + provision both DBs ──",
                "for svc in leaderboard event-ingestor; do DB_HOST=\($db_host | @sh) MASTER_USER=\($master_user | @sh) MASTER_PASS=\($master_pass | @sh) sh /tmp/wipe-provision-db.sh \($env | @sh) \"$svc\"; done",

                "rm -f /tmp/wipe-provision-db.sh",
                "echo \"leaderboard + event-ingestor DBs wiped (\($env)); services left stopped for the deploy roll\""
              ]
            }' > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "redeploy-leaderboard wipe $ENV" \
            --parameters file:///tmp/ssm-params.json \
            --output-s3-bucket-name "$SSM_OUTPUT_BUCKET" \
            --timeout-seconds 300 \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text)
          echo "SSM status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM command failed with status $STATUS"
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi

  # ── Rebuild the two go images from the dispatched ref and roll them ──
  # deploy.sh pulls + up -d, restarting the stopped services on the wiped
  # DBs, then health-checks /{env}/leaderboard/health + /{env}/ingestor/health.
  deploy:
    needs: wipe
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      envs: ${{ format('["{0}"]', inputs.environment) }}
      only_services: '["leaderboard","event-ingestor"]'

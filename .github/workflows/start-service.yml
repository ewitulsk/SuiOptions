name: Start service

# Manual workflow to start a SINGLE previously-stopped Docker service for a
# given environment. Uses `docker compose start <service>` so the existing
# (halted) container is brought back without a full image pull or recreate.
# To create a missing container instead, run a deploy.
#
# The service list is the union across envs (e.g. mm-bot
# are staging-only); the chosen service is validated against the target
# env's compose file on the host before starting.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod
      service:
        description: 'Service to start'
        required: true
        type: choice
        options:
          - token-info
          - auth-service
          - indexer
          - quoting
          - mm-bot
          - api-service
          - price-charting
          - gas-station
          - balance-monitor
          - keeper
          - oracle-service
          - orderbook
          - staging-mm-bot
          - leaderboard
          - event-ingestor
          - nginx

permissions:
  contents: read

env:
  STAGING_HOST: ${{ vars.STAGING_HOST }}
  PROD_HOST:    ${{ vars.PROD_HOST }}

jobs:
  start:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Resolve target host
        id: host
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          case "$DEPLOY_ENV" in
            staging) addr="$STAGING_HOST" ;;
            prod)    addr="$PROD_HOST" ;;
            *) echo "::error::unknown env $DEPLOY_ENV"; exit 1 ;;
          esac
          if [ -z "$addr" ]; then
            echo "::error::no host var set for $DEPLOY_ENV"; exit 1
          fi
          echo "addr=$addr" >> "$GITHUB_OUTPUT"

      - name: Set up deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST_ADDR" >> ~/.ssh/known_hosts 2>/dev/null

      - name: SSH start service
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          SSH="ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@$HOST_ADDR"

          $SSH env \
            "DEPLOY_ENV=$DEPLOY_ENV" \
            "SERVICE=$SERVICE" \
            bash -s <<'REMOTE'
          set -euo pipefail
          COMPOSE_FILE="/opt/options/$DEPLOY_ENV/docker-compose.$DEPLOY_ENV.yml"
          if [ ! -f "$COMPOSE_FILE" ]; then echo "No compose file at $COMPOSE_FILE" >&2; exit 1; fi
          if ! docker compose -f "$COMPOSE_FILE" config --services | grep -qx "$SERVICE"; then
            echo "Service $SERVICE not defined in $DEPLOY_ENV" >&2; exit 1
          fi
          echo "Starting $SERVICE in $DEPLOY_ENV…"
          docker compose -f "$COMPOSE_FILE" start "$SERVICE"
          echo "$SERVICE started in $DEPLOY_ENV"
          docker compose -f "$COMPOSE_FILE" ps
          REMOTE

name: Sync monitoring stack

# Ship the repo's monitoring config (deployment/monitoring/**) to the shared
# host (options-host) and roll the monitoring stack — WITHOUT rebuilding or
# rolling any app service. This is the lightweight rollout path for changes to
# the Grafana/Prometheus/Tempo/Gatus config that normally only land via a full
# cloud-init re-provision (host bounce).
#
# What it does on the host (/opt/options/monitoring):
#   - Drops the updated config files in place (datasources, alerting,
#     prometheus.yml, tempo-config.yml, gatus config, compose file).
#   - Brings up prometheus + tempo + gatus (new containers / config).
#   - RESTARTS grafana so it re-reads the bind-mounted provisioning files.
#     (`restart`, not `up -d` — the compose spec is unchanged, so `up -d`
#     alone won't reload the changed datasources.yml.)
#
# Then pushes the repo's dashboards (deployment/monitoring/dashboards/*.json)
# into Grafana via the HTTP API (push-dashboards.sh) — dashboards are NOT
# file-provisioned, so this is the only path that imports them. Runs on the
# host against localhost:3000 using the admin password already in the host's
# monitoring .env.
#
# Does NOT touch loki/grafana/promtail beyond the grafana restart, and never
# touches any per-env app stack.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # OIDC to AWS

env:
  AWS_REGION:        ${{ vars.AWS_REGION }}
  DEPLOY_ROLE_ARN:   ${{ vars.DEPLOY_ROLE_ARN }}
  SSM_OUTPUT_BUCKET: ${{ vars.SSM_OUTPUT_BUCKET }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # for deployment/monitoring/** + resolve-ec2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Monitoring runs on the shared host (options-host); leave env empty.
      - uses: ./.github/actions/resolve-ec2
        with:
          region: ${{ env.AWS_REGION }}

      - name: Build + upload monitoring config bundle
        working-directory: rust-backend/deployment/monitoring
        run: |
          set -eu
          # Stage files at the exact paths cloud-init writes them, rooted at
          # `monitoring/` so `tar -C /opt/options` lands them in place.
          S=stage/monitoring
          mkdir -p \
            "$S/prometheus/config" \
            "$S/tempo/config" \
            "$S/grafana/provisioning/datasources" \
            "$S/grafana/provisioning/alerting" \
            "$S/gatus/config"
          cp docker-compose.monitoring.yml "$S/docker-compose.monitoring.yml"
          cp prometheus.yml                "$S/prometheus/config/prometheus.yml"
          cp tempo-config.yml              "$S/tempo/config/tempo-config.yml"
          cp grafana-datasources.yml       "$S/grafana/provisioning/datasources/datasources.yml"
          cp grafana-alerting.yml          "$S/grafana/provisioning/alerting/alerting.yml"
          cp gatus-config.yml              "$S/gatus/config/config.yaml"
          # Part B: dashboards + the push script (run on the host post-restart).
          cp push-dashboards.sh            "$S/push-dashboards.sh"
          cp -R dashboards                 "$S/dashboards"
          tar czf /tmp/mon-bundle.tgz -C stage monitoring

          # Under deploy-bundles/ on purpose: the EC2 host role's s3:GetObject
          # is scoped to that prefix (infra/iam.tf), and the bucket's 14-day
          # lifecycle rule cleans the object up.
          KEY="deploy-bundles/monitoring-sync-${{ github.run_id }}.tgz"
          aws s3 cp /tmp/mon-bundle.tgz "s3://$SSM_OUTPUT_BUCKET/$KEY"
          echo "S3_KEY=$KEY" >> "$GITHUB_ENV"

      - name: SSM ship config + roll monitoring stack
        run: |
          # AWS-RunShellScript joins `commands` into one /bin/sh (dash) script;
          # vars persist line-to-line but there's no pipefail, so keep `set -eu`.
          jq -nc \
            --arg bucket "$SSM_OUTPUT_BUCKET" \
            --arg key "$S3_KEY" '
            {
              commands: [
                "set -eu",
                "cd /opt/options/monitoring",
                "echo Fetching monitoring config bundle...",
                "aws s3 cp s3://\($bucket)/\($key) /tmp/mon-bundle.tgz",
                "echo Extracting config into /opt/options/monitoring ...",
                "tar xzf /tmp/mon-bundle.tgz -C /opt/options",
                "rm -f /tmp/mon-bundle.tgz",
                "# Ensure the metrics/trace data dirs exist and are owned by the",
                "# uids the containers run as. Cloud-init does this on a fresh box,",
                "# but a host provisioned before these services existed has no such",
                "# dirs — Docker would auto-create them as root and the containers",
                "# (prometheus uid 65534, tempo uid 10001) could not write. Idempotent.",
                "mkdir -p prometheus/data tempo/data",
                "chown -R 65534:65534 prometheus/data",
                "chown -R 10001:10001 tempo/data",
                "echo Pulling prometheus/tempo/gatus images...",
                "docker compose -f docker-compose.monitoring.yml pull prometheus tempo gatus",
                "echo Bringing up prometheus + tempo + gatus...",
                "docker compose -f docker-compose.monitoring.yml up -d prometheus tempo gatus",
                "echo Restarting grafana to re-read provisioning...",
                "docker compose -f docker-compose.monitoring.yml restart grafana",
                "echo Waiting for grafana /api/health ...",
                "ok=0; for i in $(seq 1 20); do if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then ok=1; break; fi; sleep 2; done",
                "if [ \"$ok\" -ne 1 ]; then echo \"grafana health probe failed\" >&2; exit 1; fi",
                "echo Pushing dashboards...",
                "GRAFANA_PASSWORD=$(grep ^GRAFANA_ADMIN_PASSWORD= .env | cut -d= -f2-)",
                "GRAFANA_URL=http://localhost:3000 GRAFANA_PASSWORD=\"$GRAFANA_PASSWORD\" bash push-dashboards.sh",
                "echo Monitoring containers:",
                "docker compose -f docker-compose.monitoring.yml ps",
                "echo \"sync ok\""
              ]
            }' > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "sync monitoring stack" \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "ssm command: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text)
          echo "ssm status: $STATUS"

          echo "--- stdout ---"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text

          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---"
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi

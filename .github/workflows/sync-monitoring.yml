name: Sync monitoring stack

# Ship the repo's monitoring config (deployment/monitoring/**) to the shared
# host (options-host) and roll the monitoring stack — WITHOUT rebuilding or
# rolling any app service. This is the lightweight rollout path for changes to
# the Grafana/Prometheus/Tempo/Gatus config that normally only land via a full
# host re-provision (host bounce).
#
# What it does on the host (/opt/options/monitoring):
#   - Drops the updated config files in place (datasources, alerting,
#     prometheus.yml, tempo-config.yml, gatus config, compose file).
#   - Brings up prometheus + tempo + gatus (new containers / config).
#   - RESTARTS prometheus and grafana so they re-read their bind-mounted
#     config/provisioning files. (`restart`, not `up -d` — the compose spec
#     is unchanged, so `up -d` alone won't reload a changed prometheus.yml
#     or datasources.yml; a scrape-config edit would silently never apply.)
#
# Then pushes the repo's dashboards (deployment/monitoring/dashboards/*.json)
# into Grafana via the HTTP API (push-dashboards.sh) — dashboards are NOT
# file-provisioned, so this is the only path that imports them. Runs on the
# host against localhost:3000 using the admin password already in the host's
# monitoring .env.
#
# Does NOT touch loki/grafana/promtail beyond the grafana restart, and never
# touches any per-env app stack.

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  STAGING_HOST: ${{ vars.STAGING_HOST }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # for deployment/monitoring/**

      # Monitoring runs on the shared host (the staging droplet).
      - name: Resolve target host
        id: host
        run: |
          if [ -z "$STAGING_HOST" ]; then
            echo "::error::STAGING_HOST var not set"; exit 1
          fi
          echo "addr=$STAGING_HOST" >> "$GITHUB_OUTPUT"

      - name: Set up deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST_ADDR" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build monitoring config bundle
        working-directory: rust-backend/deployment/monitoring
        run: |
          set -eu
          # Stage files at the exact paths host provisioning writes them,
          # rooted at `monitoring/` so `tar -C /opt/options` lands them in
          # place.
          S=stage/monitoring
          mkdir -p \
            "$S/prometheus/config" \
            "$S/tempo/config" \
            "$S/grafana/provisioning/datasources" \
            "$S/grafana/provisioning/alerting" \
            "$S/gatus/config"
          cp docker-compose.monitoring.yml "$S/docker-compose.monitoring.yml"
          cp prometheus.yml                "$S/prometheus/config/prometheus.yml"
          cp tempo-config.yml              "$S/tempo/config/tempo-config.yml"
          cp grafana-datasources.yml       "$S/grafana/provisioning/datasources/datasources.yml"
          cp grafana-alerting.yml          "$S/grafana/provisioning/alerting/alerting.yml"
          cp gatus-config.yml              "$S/gatus/config/config.yaml"
          # Part B: dashboards + the push script (run on the host post-restart).
          cp push-dashboards.sh            "$S/push-dashboards.sh"
          cp -R dashboards                 "$S/dashboards"
          tar czf /tmp/mon-bundle.tgz -C stage monitoring

      - name: Ship config + roll monitoring stack
        env:
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          SSH="ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@$HOST_ADDR"

          scp /tmp/mon-bundle.tgz "root@$HOST_ADDR:/tmp/mon-bundle.tgz"

          $SSH bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/options/monitoring
          echo "Extracting config into /opt/options/monitoring ..."
          tar xzf /tmp/mon-bundle.tgz -C /opt/options
          rm -f /tmp/mon-bundle.tgz
          # Ensure the metrics/trace data dirs exist and are owned by the
          # uids the containers run as. Host provisioning does this on a
          # fresh box, but a host provisioned before these services existed
          # has no such dirs — Docker would auto-create them as root and the
          # containers (prometheus uid 65534, tempo uid 10001) could not
          # write. Idempotent.
          mkdir -p prometheus/data tempo/data
          chown -R 65534:65534 prometheus/data
          chown -R 10001:10001 tempo/data
          echo "Pulling prometheus/tempo/gatus images..."
          docker compose -f docker-compose.monitoring.yml pull prometheus tempo gatus
          echo "Bringing up prometheus + tempo + gatus..."
          docker compose -f docker-compose.monitoring.yml up -d prometheus tempo gatus
          echo "Restarting prometheus + grafana to re-read bind-mounted config..."
          # `up -d` above no-ops when the compose spec is unchanged, so a
          # prometheus.yml edit alone never reaches the running process —
          # the scrape config silently stays stale (SO-407). Same reason
          # grafana is restarted for its provisioning files.
          docker compose -f docker-compose.monitoring.yml restart prometheus grafana
          echo "Waiting for grafana /api/health ..."
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then echo "grafana health probe failed" >&2; exit 1; fi
          echo "Pushing dashboards..."
          GRAFANA_PASSWORD=$(grep ^GRAFANA_ADMIN_PASSWORD= .env | cut -d= -f2-)
          GRAFANA_URL=http://localhost:3000 GRAFANA_PASSWORD="$GRAFANA_PASSWORD" bash push-dashboards.sh
          echo "Monitoring containers:"
          docker compose -f docker-compose.monitoring.yml ps
          echo "sync ok"
          REMOTE

name: Deploy prod

# Build + selective deploy to prod on every push to main. The actual
# build/deploy logic lives in _deploy.yml; this file is the trigger +
# env list.

on:
  push:
    branches: [main]
    paths:
      - 'rust-backend/**'
      - '.github/workflows/deploy-prod.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy. Empty = current SHA. Non-empty = skip build and roll the given tag (rollback).'
        required: false
        type: string
        default: ''
      force_all:
        description: 'Bypass the affected-files filter and roll every service.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # _deploy.yml advances the `deployed-prod` marker tag
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      envs: '["prod"]'
      image_tag: ${{ inputs.image_tag || '' }}
      force_all: ${{ inputs.force_all == true }}

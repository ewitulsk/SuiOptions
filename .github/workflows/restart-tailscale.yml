name: Restart Tailscale

# Kick the tailscale-up.service on the shared host. Use when the subnet
# router has stopped (e.g. someone ran `systemctl stop`, or systemd gave
# up after a long run of failures). For routine flaps the unit's own
# Restart=on-failure already self-heals — reach for this when it hasn't.
#
# If the unit fails after this run with "invalid key", the stored auth key
# (tailscale-auth-key in the secrets store) is dead and no amount of
# restarting will fix it; mint a new reusable one in the Tailscale admin
# console and re-populate the secret.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  STAGING_HOST: ${{ vars.STAGING_HOST }}

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target host
        id: host
        run: |
          if [ -z "$STAGING_HOST" ]; then
            echo "::error::STAGING_HOST var not set"; exit 1
          fi
          echo "addr=$STAGING_HOST" >> "$GITHUB_OUTPUT"

      - name: Set up deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST_ADDR" >> ~/.ssh/known_hosts 2>/dev/null

      - name: SSH restart tailscale-up.service
        env:
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          SSH="ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@$HOST_ADDR"

          $SSH bash -s <<'REMOTE'
          set -euo pipefail
          systemctl reset-failed tailscale-up.service || true
          systemctl restart tailscale-up.service
          sleep 8
          systemctl status tailscale-up.service --no-pager || true
          echo "--- tailscale status ---"
          tailscale status || true
          REMOTE

name: Restart Tailscale

# Kick the tailscale-up.service on the EC2 host. Use when the subnet
# router has stopped (e.g. someone ran `systemctl stop`, or systemd gave
# up after a long run of failures). For routine flaps the unit's own
# Restart=on-failure already self-heals — reach for this when it hasn't.
#
# If the unit fails after this run with "invalid key", the auth key in
# Secrets Manager (options/_master/tailscale-auth-key) is dead and no
# amount of restarting will fix it; mint a new reusable one in the
# Tailscale admin console and re-populate the secret.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION:      ${{ vars.AWS_REGION }}
  DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # for ./.github/actions/resolve-ec2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/resolve-ec2
        with:
          region: ${{ env.AWS_REGION }}

      - name: SSM restart tailscale-up.service
        run: |
          jq -nc '{
            commands: [
              "set -eu",
              "systemctl reset-failed tailscale-up.service || true",
              "systemctl restart tailscale-up.service",
              "sleep 8",
              "systemctl status tailscale-up.service --no-pager || true",
              "echo --- tailscale status ---",
              "tailscale status || true"
            ]
          }' > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "manual tailscale restart" \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "ssm command: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text)
          echo "ssm status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi

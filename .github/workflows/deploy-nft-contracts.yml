# Deploy NFT contracts to Aptos mainnet. Dispatch-only, runs the Aptos CLI
# in CI with the deployer key from secrets — never from a laptop.
# Publishes marketplace + router as new objects, runs both init entries
# (0% fees, APT allowlisted), discovers object addresses from the Born
# events, and prints them for the service/frontend deploys.
name: deploy-nft-contracts

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install Aptos CLI
        run: |
          curl -fsSL https://aptos.dev/scripts/install_cli.py -o install_cli.py
          python3 install_cli.py --version 9.5.1
          echo "$HOME/.aptos/bin" >> "$GITHUB_PATH"
      - name: Fund check
        run: |
          BAL=$(curl -s "https://fullnode.mainnet.aptoslabs.com/v1/accounts/0x0686db96a7fddab470d8823898b51f1460ee27f637a794f525c5057f719c6055/balance/0x1::aptos_coin::AptosCoin")
          echo "deployer balance: $BAL octas"
          python3 -c "import sys; sys.exit(0 if int('$BAL') > 100000000 else 1)" \
            || { echo "FUND 0x0686db96a7fddab470d8823898b51f1460ee27f637a794f525c5057f719c6055 BEFORE DEPLOYING" >&2; exit 1; }
      - name: Deploy marketplace package
        env:
          APTOS_KEY: ${{ secrets.APTOS_DEPLOYER_PRIVATE_KEY }}
        run: |
          aptos move deploy-object \
            --package-dir aptos/contracts/marketplace \
            --address-name marketplace \
            --private-key "$APTOS_KEY" \
            --url https://fullnode.mainnet.aptoslabs.com/v1 \
            --assume-yes --json | tee /tmp/venue-deploy.json
          python3 -c "import json; print(json.load(open('/tmp/venue-deploy.json'))['Result']['object_address'])" > /tmp/venue.txt
          echo "VENUE=$(cat /tmp/venue.txt)" >> "$GITHUB_ENV"
      - name: Deploy router package
        env:
          APTOS_KEY: ${{ secrets.APTOS_DEPLOYER_PRIVATE_KEY }}
        run: |
          aptos move deploy-object \
            --package-dir aptos/contracts/router \
            --address-name router \
            --private-key "$APTOS_KEY" \
            --url https://fullnode.mainnet.aptoslabs.com/v1 \
            --assume-yes --json | tee /tmp/router-deploy.json
          python3 -c "import json; print(json.load(open('/tmp/router-deploy.json'))['Result']['object_address'])" > /tmp/router.txt
          echo "ROUTER=$(cat /tmp/router.txt)" >> "$GITHUB_ENV"
      - name: Init marketplace and discover objects
        env:
          APTOS_KEY: ${{ secrets.APTOS_DEPLOYER_PRIVATE_KEY }}
        run: |
          DEPLOYER=0x0686db96a7fddab470d8823898b51f1460ee27f637a794f525c5057f719c6055
          aptos move run \
            --function-id "$VENUE::fee_schedule::init_entry" \
            --args address:$DEPLOYER u64:0 u64:0 u64:100 u64:0 \
            --private-key "$APTOS_KEY" --url https://fullnode.mainnet.aptoslabs.com/v1 \
            --assume-yes --json | tee /tmp/venue-init.json
          HASH=$(python3 -c "import json; print(json.load(open('/tmp/venue-init.json'))['Result']['transaction_hash'])")
          curl -s "https://fullnode.mainnet.aptoslabs.com/v1/transactions/by_hash/$HASH" > /tmp/venue-init-tx.json
          python3 - <<'EOF'
          import json
          tx = json.load(open('/tmp/venue-init-tx.json'))
          born = next(e['data'] for e in tx['events'] if e['type'].endswith('::fee_schedule::MarketplaceBorn'))
          open('/tmp/schedule.txt','w').write(born['fee_schedule'])
          open('/tmp/venuecap.txt','w').write(born['admin_cap'])
          print('schedule:', born['fee_schedule'])
          print('venue admin cap:', born['admin_cap'])
          EOF
          echo "SCHEDULE=$(cat /tmp/schedule.txt)" >> "$GITHUB_ENV"
          echo "VENUE_CAP=$(cat /tmp/venuecap.txt)" >> "$GITHUB_ENV"
      - name: Allowlist APT quote
        env:
          APTOS_KEY: ${{ secrets.APTOS_DEPLOYER_PRIVATE_KEY }}
        run: |
          aptos move run \
            --function-id "$VENUE::fee_schedule::allow_quote_token" \
            --args address:$VENUE_CAP address:$SCHEDULE address:0xa u64:0 \
            --private-key "$APTOS_KEY" --url https://fullnode.mainnet.aptoslabs.com/v1 \
            --assume-yes
      - name: Init router and discover config
        env:
          APTOS_KEY: ${{ secrets.APTOS_DEPLOYER_PRIVATE_KEY }}
        run: |
          DEPLOYER=0x0686db96a7fddab470d8823898b51f1460ee27f637a794f525c5057f719c6055
          aptos move run \
            --function-id "$ROUTER::router::init" \
            --args address:$DEPLOYER u64:0 u64:0 "vector<u8>:[1,2,3,4,5,6,7]" \
            --private-key "$APTOS_KEY" --url https://fullnode.mainnet.aptoslabs.com/v1 \
            --assume-yes --json | tee /tmp/router-init.json
          HASH=$(python3 -c "import json; print(json.load(open('/tmp/router-init.json'))['Result']['transaction_hash'])")
          curl -s "https://fullnode.mainnet.aptoslabs.com/v1/transactions/by_hash/$HASH" > /tmp/router-init-tx.json
          python3 - <<'EOF'
          import json
          tx = json.load(open('/tmp/router-init-tx.json'))
          born = next(e['data'] for e in tx['events'] if e['type'].endswith('::router::RouterBorn'))
          open('/tmp/routercfg.txt','w').write(born['config'])
          open('/tmp/routercap.txt','w').write(born['admin_cap'])
          print('router config:', born['config'])
          print('router admin cap:', born['admin_cap'])
          EOF
          echo "ROUTER_CONFIG=$(cat /tmp/routercfg.txt)" >> "$GITHUB_ENV"
          {
            echo "## NFT contract addresses"
            echo "venue: \`$VENUE\`"
            echo "fee schedule: \`$SCHEDULE\`"
            echo "venue admin cap: \`$VENUE_CAP\`"
            echo "router: \`$ROUTER\`"
            echo "router config: \`$ROUTER_CONFIG\`"
            echo ""
            echo "Pass these as inputs to deploy-nft / deploy-nft-frontend."
          } >> "$GITHUB_STEP_SUMMARY"

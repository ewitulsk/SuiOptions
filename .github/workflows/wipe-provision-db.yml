# Wipe + (idempotently) provision a single service's Postgres database for
# a target env. Creates the role + database if missing, then resets the
# public schema; the service binary re-runs its embedded migrations on the
# next start.
#
# Flow:
#   1. Resolve the compose service name from the chosen service.
#   2. Decrypt the master DB creds from the SOPS store (the per-env role
#      can't CREATE on the cluster).
#   3. scp deployment/ec2/wipe-provision-db.sh to the droplet.
#   4. Over SSH on the host: stop the service → run the script → start it.
#
# prod is a selectable target but GATED twice. Typing the env name into
# `confirm` catches an accidental dropdown pick; the environment must also be
# PROVABLY testnet, checked here and again in the remote script.
#
# That second gate is derived rather than hardcoded:
# rust-backend/deployment/assert_testnet.sh resolves the network from the
# service configs and refuses anything it cannot prove is testnet.
#
# What used to be here compared the env name against "production" and
# "mainnet" — two strings the `type: choice` input below cannot produce — so
# it could never fire, and the word "network" appeared nowhere in this file.
# The typed confirmation was the only guard that worked, and it catches a
# mis-click, not a category error (SO-330).

name: Wipe & Provision Service DB

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service whose DB to wipe + provision'
        required: true
        type: choice
        options:
          - indexer
          - token-info
          - orderbook
          - leaderboard
          - event-ingestor
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - prod
      confirm:
        description: "Type the env name to confirm (required for prod — it WIPES the DB)."
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  DB_HOST:      ${{ vars.DB_HOST }}
  STAGING_HOST: ${{ vars.STAGING_HOST }}
  PROD_HOST:    ${{ vars.PROD_HOST }}

jobs:
  wipe-provision:
    runs-on: ubuntu-latest
    steps:
      # ── 0. Checkout (for the script) ─────────────────────────────
      - uses: actions/checkout@v4

      # ── 1. Validate + resolve the compose service name ───────────
      - name: Resolve target
        id: target
        env:
          ENV: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          # ── MAINNET GUARD ──
          # This previously compared $ENV against "production"/"mainnet" —
          # two strings the `type: choice` input above cannot produce, so the
          # guard could never fire. It also never learned what CHAIN the env
          # was on: the word "network" did not appear anywhere in this file.
          #
          # Now derived from the service configs, which are what actually
          # change when an env becomes mainnet, and inverted to refuse unless
          # the env is provably testnet.
          NETWORK="$(bash rust-backend/deployment/assert_testnet.sh "$ENV")"
          echo "resolved network for $ENV: $NETWORK"
          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"
          # prod wipes a live DB — require an explicit typed confirmation.
          if [ "$ENV" = "prod" ] && [ "$CONFIRM" != "prod" ]; then
            echo "::error::prod requires typing 'prod' into the confirm input"
            exit 1
          fi
          case "$SERVICE" in
            indexer)         echo "compose_svc=indexer"               >> "$GITHUB_OUTPUT" ;;
            token-info)      echo "compose_svc=token-info"            >> "$GITHUB_OUTPUT" ;;
            orderbook)       echo "compose_svc=orderbook"             >> "$GITHUB_OUTPUT" ;;
            leaderboard)     echo "compose_svc=leaderboard"           >> "$GITHUB_OUTPUT" ;;
            event-ingestor)  echo "compose_svc=event-ingestor"        >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Invalid service '$SERVICE'"
              exit 1
              ;;
          esac

      # ── 2. Resolve the target droplet + SSH key ──────────────────
      - name: Resolve target host
        id: host
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          case "$DEPLOY_ENV" in
            staging) addr="$STAGING_HOST" ;;
            prod)    addr="$PROD_HOST" ;;
            *) echo "::error::unknown env $DEPLOY_ENV"; exit 1 ;;
          esac
          if [ -z "$addr" ]; then
            echo "::error::no host var set for $DEPLOY_ENV"; exit 1
          fi
          echo "addr=$addr" >> "$GITHUB_OUTPUT"

      - name: Set up deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST_ADDR" >> ~/.ssh/known_hosts 2>/dev/null

      # ── 3. Fetch master DB creds (SOPS) ──────────────────────────
      # The per-env <service>_<env> role lacks CREATE on the cluster, so
      # role/database creation and the schema reset run as the master.
      - name: Install sops
        run: |
          sudo curl -fsSL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo chmod +x /usr/local/bin/sops

      - name: Fetch master DB creds
        id: master
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          ENV: ${{ inputs.environment }}
        run: |
          # The secrets store is per-env; only staging has been migrated to
          # SOPS so far.
          STORE="rust-backend/deployment/secrets/${ENV}.enc.yaml"
          if [ ! -f "$STORE" ]; then
            echo "::error::no SOPS store at $STORE — $ENV secrets are not yet migrated"
            exit 1
          fi
          MASTER_JSON=$(sops decrypt --extract '["_master/db"]' "$STORE")
          echo "user=$(echo "$MASTER_JSON" | jq -r '.username')" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(echo "$MASTER_JSON" | jq -r '.password')"
          echo "pass=$(echo "$MASTER_JSON" | jq -r '.password')" >> "$GITHUB_OUTPUT"

      # ── 4. Ship the provisioning script to the host ──────────────
      - name: Upload script
        env:
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          scp rust-backend/deployment/ec2/wipe-provision-db.sh \
            "root@$HOST_ADDR:/tmp/wipe-provision-db.sh"

      # ── 5. SSH: stop → wipe+provision → start ────────────────────
      - name: Run on host
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          COMPOSE_SVC: ${{ steps.target.outputs.compose_svc }}
          NETWORK: ${{ steps.target.outputs.network }}
          SERVICE: ${{ inputs.service }}
          MASTER_USER: ${{ steps.master.outputs.user }}
          MASTER_PASS: ${{ steps.master.outputs.pass }}
          HOST_ADDR: ${{ steps.host.outputs.addr }}
        run: |
          SSH="ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 root@$HOST_ADDR"

          # The script defaults DB_PORT=25060 / MASTER_DB=defaultdb itself.
          $SSH env \
            "DEPLOY_ENV=$DEPLOY_ENV" \
            "NETWORK=$NETWORK" \
            "COMPOSE_SVC=$COMPOSE_SVC" \
            "SERVICE=$SERVICE" \
            "DB_HOST=$DB_HOST" \
            "MASTER_USER=$MASTER_USER" \
            "MASTER_PASS=$MASTER_PASS" \
            bash -s <<'REMOTE'
          set -euo pipefail
          # Bracketed, not apostrophised — see SO-342.
          if [ "$NETWORK" != "testnet" ]; then echo "FATAL: refusing network [$NETWORK] — testnet only"; exit 1; fi
          cd "/opt/options/$DEPLOY_ENV"
          COMPOSE_FILE="docker-compose.$DEPLOY_ENV.yml"

          chmod +x /tmp/wipe-provision-db.sh

          # ── Stop the service (if present in this env) ──
          if docker compose -f "$COMPOSE_FILE" config --services | grep -qx "$COMPOSE_SVC"; then
            docker compose -f "$COMPOSE_FILE" stop "$COMPOSE_SVC" || true
            echo "stopped $COMPOSE_SVC"
          else
            echo "$COMPOSE_SVC not in compose; skipping stop"
          fi

          # ── Wipe + provision the DB ──
          DB_HOST="$DB_HOST" MASTER_USER="$MASTER_USER" MASTER_PASS="$MASTER_PASS" \
            sh /tmp/wipe-provision-db.sh "$DEPLOY_ENV" "$SERVICE"

          # ── Start the service again (migrations run on connect) ──
          if docker compose -f "$COMPOSE_FILE" config --services | grep -qx "$COMPOSE_SVC"; then
            docker compose -f "$COMPOSE_FILE" start "$COMPOSE_SVC" || true
            echo "started $COMPOSE_SVC"
          fi

          rm -f /tmp/wipe-provision-db.sh
          echo "wipe+provision complete ($SERVICE / $DEPLOY_ENV)"
          REMOTE

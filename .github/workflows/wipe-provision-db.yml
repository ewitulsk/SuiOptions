# Wipe + (idempotently) provision a single service's Postgres database for
# a target env. Creates the role + database if missing, then resets the
# public schema; the service binary re-runs its embedded migrations on the
# next start.
#
# Flow:
#   1. Resolve the compose service name from the chosen service.
#   2. Fetch RDS master creds (the per-env role can't CREATE on the cluster).
#   3. Upload deployment/ec2/wipe-provision-db.sh to S3 (deploy-bundles/).
#   4. Over SSM on the EC2 host: stop the service → run the script → start it.
#
# PRODUCTION IS EXPLICITLY BLOCKED — the choice list offers only dev and
# staging, and the remote script also guards at runtime.

name: Wipe & Provision Service DB

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service whose DB to wipe + provision'
        required: true
        type: choice
        options:
          - indexer
          - scheduler
          - token-info
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging

permissions:
  contents: read
  id-token: write    # OIDC → AWS

env:
  AWS_REGION:        ${{ vars.AWS_REGION }}
  DEPLOY_ROLE_ARN:   ${{ vars.DEPLOY_ROLE_ARN }}
  RDS_HOST:          ${{ vars.RDS_HOST }}
  SSM_OUTPUT_BUCKET: ${{ vars.SSM_OUTPUT_BUCKET }}

jobs:
  wipe-provision:
    runs-on: ubuntu-latest
    steps:
      # ── 0. Checkout (for the script) ─────────────────────────────
      - uses: actions/checkout@v4

      # ── 1. Validate + resolve the compose service name ───────────
      - name: Resolve target
        id: target
        env:
          ENV: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
        run: |
          if [ "$ENV" = "prod" ] || [ "$ENV" = "production" ] || [ "$ENV" = "mainnet" ]; then
            echo "::error::REFUSING to touch production"
            exit 1
          fi
          case "$SERVICE" in
            indexer)    echo "compose_svc=indexer"          >> "$GITHUB_OUTPUT" ;;
            scheduler)  echo "compose_svc=option-scheduler" >> "$GITHUB_OUTPUT" ;;
            token-info) echo "compose_svc=token-info"       >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Invalid service '$SERVICE'"
              exit 1
              ;;
          esac

      # ── 2. AWS credentials (OIDC) ────────────────────────────────
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/resolve-ec2
        with:
          region: ${{ env.AWS_REGION }}

      # ── 3. Fetch RDS master creds ────────────────────────────────
      # The per-env <service>_<env> role lacks CREATE on the cluster, so
      # role/database creation and the schema reset run as the master.
      - name: Fetch master DB creds
        id: master
        run: |
          MASTER_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "options/_master/db" \
            --query SecretString --output text)
          echo "user=$(echo "$MASTER_JSON" | jq -r '.username')" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(echo "$MASTER_JSON" | jq -r '.password')"
          echo "pass=$(echo "$MASTER_JSON" | jq -r '.password')" >> "$GITHUB_OUTPUT"

      # ── 4. Upload the provisioning script to S3 ──────────────────
      - name: Upload script
        id: bundle
        env:
          ENV: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service }}
        run: |
          TS=$(date +%s)
          # deploy-bundles/ is the only prefix the EC2 instance role may
          # GetObject from on this bucket (see infra/iam.tf).
          KEY="deploy-bundles/wipe-provision-db-${ENV}-${SERVICE}-${TS}.sh"
          aws s3 cp rust-backend/deployment/ec2/wipe-provision-db.sh \
            "s3://${SSM_OUTPUT_BUCKET}/${KEY}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # ── 5. SSM: stop → wipe+provision → start ────────────────────
      - name: Run on EC2
        env:
          ENV: ${{ inputs.environment }}
          COMPOSE_SVC: ${{ steps.target.outputs.compose_svc }}
          SERVICE: ${{ inputs.service }}
          SCRIPT_KEY: ${{ steps.bundle.outputs.key }}
          MASTER_USER: ${{ steps.master.outputs.user }}
          MASTER_PASS: ${{ steps.master.outputs.pass }}
        run: |
          jq -nc \
            --arg env "$ENV" \
            --arg svc "$COMPOSE_SVC" \
            --arg service "$SERVICE" \
            --arg script_key "$SCRIPT_KEY" \
            --arg db_host "$RDS_HOST" \
            --arg master_user "$MASTER_USER" \
            --arg master_pass "$MASTER_PASS" \
            --arg bucket "$SSM_OUTPUT_BUCKET" \
            --arg region "$AWS_REGION" '
            {
              commands: [
                "set -eu",
                "if [ \"\($env)\" = \"prod\" ] || [ \"\($env)\" = \"production\" ]; then echo \"FATAL: refusing prod\"; exit 1; fi",
                "cd /opt/options/\($env)",
                "COMPOSE_FILE=\"docker-compose.\($env).yml\"",

                "# ── Download the provisioning script ──",
                "aws s3 cp \"s3://\($bucket)/\($script_key)\" /tmp/wipe-provision-db.sh --region \($region)",
                "chmod +x /tmp/wipe-provision-db.sh",

                "# ── Stop the service (if present in this env) ──",
                "if docker compose -f \"$COMPOSE_FILE\" config --services | grep -qx \($svc | @sh); then docker compose -f \"$COMPOSE_FILE\" stop \($svc | @sh) || true; echo \"stopped \($svc)\"; else echo \"\($svc) not in compose; skipping stop\"; fi",

                "# ── Wipe + provision the DB ──",
                "DB_HOST=\($db_host | @sh) MASTER_USER=\($master_user | @sh) MASTER_PASS=\($master_pass | @sh) sh /tmp/wipe-provision-db.sh \($env | @sh) \($service | @sh)",

                "# ── Start the service again (migrations run on connect) ──",
                "if docker compose -f \"$COMPOSE_FILE\" config --services | grep -qx \($svc | @sh); then docker compose -f \"$COMPOSE_FILE\" start \($svc | @sh) || true; echo \"started \($svc)\"; fi",

                "rm -f /tmp/wipe-provision-db.sh",
                "echo \"wipe+provision complete (\($service) / \($env))\""
              ]
            }' > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "wipe-provision-db $SERVICE $ENV" \
            --parameters file:///tmp/ssm-params.json \
            --output-s3-bucket-name "$SSM_OUTPUT_BUCKET" \
            --timeout-seconds 300 \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status --output text)
          echo "SSM status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM command failed with status $STATUS"
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi

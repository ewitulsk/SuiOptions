[project]
name = "scraper-backend"
version = "0.1.0"
description = "Marketplace arbitrage bot: scrapers + AI valuation + deal tracking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "litellm>=1.55",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
    "bcrypt>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends(...)` in argument defaults is the idiomatic FastAPI pattern
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# conftest must set env vars before importing the app (settings are cached)
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

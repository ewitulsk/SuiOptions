<svg width="264" height="64" viewBox="0 0 264 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pismo Protocol">
  <!-- Mark: see pismo-mark.svg for the full construction notes.
       One #tl-swoosh painted twice, the second rotated 180° about (32,32). -->
  <defs>
    <linearGradient id="tl-grad-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CC4FF"/>
      <stop offset="1" stop-color="#2872D1"/>
    </linearGradient>
    <linearGradient id="tl-grad-bottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#AEDCFF"/>
      <stop offset="1" stop-color="#4DA2FF"/>
    </linearGradient>
    <path id="tl-swoosh" d="M12 30 C 26 30 31 20 50 20 C 39 24 35 34 16 35 Z"/>
  </defs>

  <g transform="translate(-2,0)">
    <use href="#tl-swoosh" fill="url(#tl-grad-top)"/>
    <use href="#tl-swoosh" fill="url(#tl-grad-bottom)" transform="rotate(180 32 32)"/>
  </g>

  <!-- wordmark (renders in Sora where the font is loaded) -->
  <text x="62" y="41" font-family="Sora, -apple-system, system-ui, sans-serif"
        font-size="27" font-weight="600" letter-spacing="-0.6" fill="#0B2545">pismo protocol</text>
</svg>

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# DeploySpoke.s.sol writes its deploy artifact (and the script test reads
# it back) under deployments/ — nothing else is reachable.
fs_permissions = [{ access = "read-write", path = "deployments" }]

[fmt]
line_length = 100

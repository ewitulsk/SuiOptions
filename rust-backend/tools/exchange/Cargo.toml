[package]
name = "exchange"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "exchange"
path = "src/main.rs"

[dependencies]
protocol-types = { workspace = true }
runtime-config = { workspace = true }
cli-spec       = { workspace = true }
sui-tx         = { workspace = true }
token-info-client = { workspace = true }
# Reuse the scheduler's codegen→publish→create_bucket roll pipeline so the
# manual `create-buckets` admin command mints per-bucket option coins the same
# way the scheduler does.
option-scheduler = { path = "../../services/option-scheduler" }

sui-types = { workspace = true }

tokio = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

hex = { workspace = true }

clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

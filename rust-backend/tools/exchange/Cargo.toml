[package]
name = "exchange"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "exchange"
path = "src/main.rs"

[dependencies]
protocol-types = { workspace = true }
runtime-config = { workspace = true }
cli-spec       = { workspace = true }
sui-tx         = { workspace = true }
token-info-client = { workspace = true }
sui-types = { workspace = true }

tokio = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }

hex = { workspace = true }

clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# StructTag fixtures in roller tests; the binary only pattern-matches against
# ObjectChange, so move-core-types stays out of the runtime dep tree.
move-core-types = { workspace = true }
# anystrike_localnet.rs (#[ignore], needs a live localnet): publish the
# protocol, drive a real create-buckets, read buckets back.
shared-crypto = { workspace = true }
# Decode `sui move build --dump-bytecode-as-base64`.
base64 = "0.22"
# Faucet calls in the localnet harness.
reqwest = { workspace = true }

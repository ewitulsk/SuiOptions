# Redemption-stress Monte Carlo: steady TVL growth, a withdrawal trickle,
# and an 80% bank-run at round 26, under the calibrated pessimistic
# premium parameters. The gate here is survival, not APY: every queue
# must clear at its locked pps on all 1000 paths.
#
#   backtester sweep --scenario scenarios/sui_stress.toml --out out/sui_stress/

[scenario]
asset = "SUI"
paths = "bootstrap"
candles = "data/sui_usd_1d.csv"
n_paths = 1000
rounds = 52
deposit_tokens_per_round = 100.0
withdraw_fraction_bps = 100
stress_round = 26
stress_fraction_bps = 8000

[strategy]
delta_target = 0.10
deploy_fraction = 1.0
slices = [1, 4]
premium_policy = "at_roll"

[premium]
iv_provider = "vrp_transfer"
vrp_ratio = 1.19
skew_bps = [-1100]
mechanism = ["onchain_auction", "pessimist"]
haircut_bps = [3500]
n_bidders_mean = [1]

[exercise]
policy = "rational"

[fees]
mgmt_bps_annual = 200
perf_bps = 1000

[swap]
slippage_bps = 50

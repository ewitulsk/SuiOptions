# SUI Monte Carlo bands: 2000 stationary-bootstrap paths over a 3-year
# horizon, sweeping the headline strategy axes. The cross-path APY p5 and
# P(underperform HODL) are the launch gate's risk numbers (doc 06 §9.1).
#
#   backtester sweep --scenario scenarios/sui_mc.toml --out out/sui_mc/

[scenario]
asset = "SUI"
paths = "bootstrap"
candles = "data/sui_usd_1d.csv"
n_paths = 2000
rounds = 156

[strategy]
delta_target = [0.05, 0.10, 0.20]
deploy_fraction = 1.0
slices = [1, 4]
premium_policy = ["at_roll", "hold_usdc"]

[premium]
iv_provider = "vrp_transfer"
vrp_ratio = 1.19
skew_bps = [-600]
mechanism = "onchain_auction"
haircut_bps = [1500, 2500, 3500]
n_bidders_mean = [1, 3, 6]

[exercise]
policy = "rational"

[fees]
mgmt_bps_annual = 200
perf_bps = 1000

[swap]
slippage_bps = 50

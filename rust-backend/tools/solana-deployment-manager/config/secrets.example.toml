# Copy to secrets.toml (gitignored) and fill in. The [solana] keys are the
# ADMIN / deployer keypair per network — this key becomes `config.admin`.
# Accepted encodings: base58 64-byte keypair, or the Solana-CLI JSON byte
# array (the contents of ~/.config/solana/id.json).
[solana]
devnet = "<base58 64-byte keypair or [12,34,...] JSON array>"
# testnet = "..."
# mainnet = "..."
# Optional shared fallback used when the per-network slot is unset.
# default = "..."
# Optional RPC override (e.g. a keyed Helius URL). Absent → public endpoint.
# rpc_url = "https://devnet.helius-rpc.com/?api-key=..."

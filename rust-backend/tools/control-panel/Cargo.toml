[package]
name = "control-panel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "control"
path = "src/main.rs"

[dependencies]
shared = { workspace = true }

# Every other binary in the workspace, pulled in as a library so we can
# introspect its clap CommandFactory. Each registers a `program_spec()` via
# shared::define_program!.
indexer            = { path = "../../services/indexer" }
quoting-service    = { path = "../../services/quoting-service" }
mm-bot             = { path = "../../services/mm-bot" }
exchange           = { path = "../../tools/exchange" }
writer             = { path = "../../tools/writer" }
deployment-manager = { path = "../../tools/deployment-manager" }

clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

# TUI.
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = { workspace = true }
futures-util = { workspace = true }

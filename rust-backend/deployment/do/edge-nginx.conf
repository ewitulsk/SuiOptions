# Edge ingress for the DO staging host — replaces the AWS ALB + ACM.
# Installed at /etc/nginx/sites-available/options (symlinked into
# sites-enabled). Certs live in /etc/letsencrypt/live/sui-options.com/
# (first issuance was DNS-01 from the operator machine; renewals run
# webroot HTTP-01 on this host via the acme-challenge location below).
#
# Routing parity with the old ALB listener rules:
#   /staging/*  -> per-env nginx sidecar on 127.0.0.1:9020
#   /prod/*     -> per-env nginx sidecar on 127.0.0.1:9030 (future prod
#                  droplet: change the upstream to its VPC IP)
#   /grafana*   -> Grafana on 3000
#   status.<domain> host -> Gatus on 8080
# Everything else 404s, matching the ALB's fixed-response default.
#
# proxy_read/send_timeout 300s mirrors the ALB's idle_timeout=300 — it
# exists for the quoting and oracle WebSockets; a 60s default kills them
# (migration gotcha G2).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name sui-options.com;

    ssl_certificate     /etc/letsencrypt/live/sui-options.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sui-options.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /staging/ {
        proxy_pass http://127.0.0.1:9020;
    }

    location /prod/ {
        proxy_pass http://127.0.0.1:9030;
    }

    location /grafana {
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name status.sui-options.com;

    ssl_certificate     /etc/letsencrypt/live/sui-options.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sui-options.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

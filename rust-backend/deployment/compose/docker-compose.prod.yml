# Compose stack for the `prod` env (Sui testnet — a distinct deployment
# from staging). Variables come from /opt/options/prod/.env, written by
# deploy.sh. Runs on the dedicated prod EC2 host (options-prod-host).
#
# Full service stack — mirrors docker-compose.staging.yml so redeploy-contract
# brings prod up identically (option-scheduler re-rolls buckets for a fresh
# contract, mm-bot quotes against it). When deploy.sh is asked to roll a
# service that isn't declared here it logs and skips, so a per-env opt-out is
# just omitting the block.

name: options-prod

services:
  # Token catalog. Binds a public read port (9005, proxied by nginx) and an
  # internal mutate port (9006, never proxied — reachable only on `net`/VPN).
  # Publishes no host ports.
  token-info:
    image: ${ECR}/options/token-info:${TOKEN_INFO_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      RUST_LOG: info,token_info=info
    # deployments.json is mounted from the host (the deploy bundle drops it
    # there) instead of baked into the image. Bind-mount the DIRECTORY, not the
    # file, so the bundle's tar unlink+create doesn't orphan the container's
    # view of the inode — same trap nginx avoids. config.prod.toml points
    # deployments_path at /app/deployments/deployments.json.
    volumes:
      - /opt/options/prod/deployments/:/app/deployments/:ro
    depends_on: [auth-service]
    restart: unless-stopped
    networks: [net]

  # Admin auth. Issues + verifies the JWTs that gate token-info's public
  # mutate endpoints. Public port (9007, proxied by nginx) + internal verify
  # port (9008, never proxied). Reads its JWT secret from /run/secrets.
  auth-service:
    image: ${ECR}/options/auth-service:${AUTH_SERVICE_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,auth_service=info
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [net]

  indexer:
    image: ${ECR}/options/indexer:${INDEXER_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      RUST_LOG: info,indexer=info
    # Reads only [sui] rpc_url from /run/secrets/indexer.toml (shared Sui RPC
    # override, rendered by render-secrets.sh). Optional — absent file → public RPC.
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    depends_on: [token-info]
    restart: unless-stopped
    networks: [net]

  # Single internal Pyth gateway (SO-254): one Hermes SSE subscription + all
  # Pyth caching, fanned out over REST + WS on 9013 (never proxied). Reads the
  # Pyth API key from /run/secrets/oracle-service.toml; discovers feeds from
  # token-info. Every other service reads prices/vol from here.
  oracle-service:
    image: ${ECR}/options/oracle-service:${ORACLE_SERVICE_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,oracle_service=info
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    depends_on: [token-info]
    restart: unless-stopped
    networks: [net]

  quoting:
    image: ${ECR}/options/quoting-service:${QUOTING_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,quoting_service=info
    depends_on: [indexer, token-info]
    restart: unless-stopped
    # If the tokio runtime wedges (see SO-65), the container's TCP listener
    # stays open but /health stops responding. Surfacing that as
    # `unhealthy` in `docker ps` is what we need to trip our nginx-proxied
    # ALB probe and Gatus; docker doesn't auto-restart on unhealthy.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:9002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [net]

  mm-bot:
    image: ${ECR}/options/mm-bot:${MM_BOT_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      TOKEN_INFO_URL: http://token-info:9005
      ORACLE_URL: http://oracle-service:9013
      API_URL: http://api-service:9003
      RUST_LOG: info,mm_bot=info
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    depends_on: [quoting, token-info, api-service, oracle-service]
    restart: unless-stopped
    networks: [net]

  option-scheduler:
    image: ${ECR}/options/option-scheduler:${SCHEDULER_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      # Mandatory: the scheduler refuses to start without its rolls DB.
      # Expanded into scheduler_database_url in config.prod.toml.
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      TOKEN_INFO_URL: http://token-info:9005
      ORACLE_URL: http://oracle-service:9013
      RUST_LOG: info,option_scheduler=info
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    depends_on: [indexer, token-info, oracle-service]
    restart: unless-stopped
    networks: [net]

  api-service:
    image: ${ECR}/options/api-service:${API_SERVICE_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,api_service=info
    depends_on: [indexer, token-info]
    restart: unless-stopped
    networks: [net]

  # OHLC charting for DeepBook option pools (SO-156). Stores fills in the
  # env's Tiger Data TimescaleDB (CHART_DATABASE_URL from Secrets Manager
  # via render-secrets.sh); serves bars over REST + WS on 9011.
  price-charting:
    image: ${ECR}/options/price-charting:${PRICE_CHARTING_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      CHART_DATABASE_URL: ${CHART_DATABASE_URL}
      ORACLE_URL: http://oracle-service:9013
      RUST_LOG: info,price_charting=debug
    # Reads only [sui] rpc_url from /run/secrets/price-charting.toml (shared Sui
    # RPC override). The watcher's poll loop is a heavy RPC consumer, so this is
    # the main reason price-charting mounts secrets. Optional — absent → public RPC.
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    depends_on: [token-info, api-service, indexer, oracle-service]
    restart: unless-stopped
    networks: [net]

  # Gas station. Sponsors user transactions by paying their gas. Public port
  # (9009, proxied by nginx). Reads the sponsor key from /run/secrets.
  gas-station:
    image: ${ECR}/options/gas-station:${GAS_STATION_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,gas_station=info
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [net]

  # SUI balance gauges + low-balance alerts for the operational wallets
  # (SO-180). Derives addresses from the same rendered secrets the services
  # mount; scraped by the Prometheus agent on 9012. Not proxied by nginx.
  balance-monitor:
    image: ${ECR}/options/balance-monitor:${BALANCE_MONITOR_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,balance_monitor=debug
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [net]

  # Permissionless covered-call vault crank (guide doc 04). Holds only a
  # gas wallet (/run/secrets/keeper.toml, from options/prod/keeper).
  # Vaults are auto-discovered from the indexer's vaults view — a vault
  # created on chain is picked up on the next tick, no config change;
  # with none on chain the keeper idles with /health up.
  keeper:
    image: ${ECR}/options/keeper:${KEEPER_TAG}
    environment:
      APP_ENV: prod
      TOKEN_INFO_URL: http://token-info:9005
      ORACLE_URL: http://oracle-service:9013
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,keeper=info
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    depends_on: [indexer, token-info, oracle-service]
    restart: unless-stopped
    networks: [net]

  # Single public entrypoint per env. Strips the /prod/{quoting,api,indexer,scheduler,mm-bot}
  # prefix before forwarding. depends_on is start-order only; nginx
  # tolerates backends being briefly unreachable on first boot.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9030:80"
    # See docker-compose.staging.yml for why we mount the directory
    # instead of the file.
    volumes:
      - /opt/options/prod/nginx/:/etc/nginx/options/:ro
    command: ["nginx", "-c", "/etc/nginx/options/nginx.conf", "-g", "daemon off;"]
    depends_on: [quoting, api-service, indexer, option-scheduler, mm-bot, token-info, auth-service, gas-station, keeper]
    restart: unless-stopped
    networks: [net]

networks:
  net:

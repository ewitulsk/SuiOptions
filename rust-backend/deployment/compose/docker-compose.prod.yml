# Compose stack for the `prod` env (Sui testnet — a distinct deployment
# from staging). Variables come from /opt/options/prod/.env, written by
# deploy.sh. Runs on the dedicated prod EC2 host (options-prod-host).
#
# Full service stack — mirrors docker-compose.staging.yml so redeploy-contract
# brings prod up identically (buckets are created on demand for a fresh
# contract, mm-bot quotes against it). When deploy.sh is asked to roll a
# service that isn't declared here it logs and skips, so a per-env opt-out is
# just omitting the block.

name: options-prod

services:
  # Token catalog. Binds a public read port (9005, proxied by nginx) and an
  # internal mutate port (9006, never proxied — reachable only on `net`/VPN).
  # Publishes no host ports.
  token-info:
    image: ${ECR}/options/token-info:${TOKEN_INFO_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      RUST_LOG: info,token_info=info
    # deployments.json is mounted from the host (the deploy bundle drops it
    # there) instead of baked into the image. Bind-mount the DIRECTORY, not the
    # file, so the bundle's tar unlink+create doesn't orphan the container's
    # view of the inode — same trap nginx avoids. config.prod.toml points
    # deployments_path at /app/deployments/deployments.json.
    volumes:
      - /opt/options/prod/deployments/:/app/deployments/:ro
    depends_on: [auth-service]
    restart: unless-stopped
    networks: [net]

  # Admin auth. Issues + verifies the JWTs that gate token-info's public
  # mutate endpoints. Public port (9007, proxied by nginx) + internal verify
  # port (9008, never proxied). Reads its JWT secret from /run/secrets.
  auth-service:
    image: ${ECR}/options/auth-service:${AUTH_SERVICE_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,auth_service=info
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [net]

  indexer:
    image: ${ECR}/options/indexer:${INDEXER_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      RUST_LOG: info,indexer=info
    # Reads only [sui] rpc_url from /run/secrets/indexer.toml (shared Sui RPC
    # override, rendered by render-secrets.sh). Optional — absent file → public RPC.
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    depends_on: [token-info]
    restart: unless-stopped
    networks: [net]

  # Hybrid exchange off-chain orderbook (REST/WS on 9014). Markets + the
  # exchange package come from the baked deployments.json (`exchange` block);
  # the relayer key + Sui endpoint overrides from
  # /run/secrets/orderbook.toml (optional — absent file → public endpoints,
  # open-orderbook mode only, no matched settlement).
  orderbook:
    image: ${ECR}/options/orderbook:${ORDERBOOK_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      RUST_LOG: info,orderbook=info
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [net]

  # Single internal Pyth gateway (SO-254): one Hermes SSE subscription + all
  # Pyth caching, fanned out over REST + WS on 9013 (never proxied). Reads the
  # Pyth API key from /run/secrets/oracle-service.toml; discovers feeds from
  # token-info. Every other service reads prices/vol from here.
  oracle-service:
    image: ${ECR}/options/oracle-service:${ORACLE_SERVICE_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,oracle_service=info
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    depends_on: [token-info]
    restart: unless-stopped
    networks: [net]

  quoting:
    image: ${ECR}/options/quoting-service:${QUOTING_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,quoting_service=info
    depends_on: [indexer, token-info]
    restart: unless-stopped
    # If the tokio runtime wedges (see SO-65), the container's TCP listener
    # stays open but /health stops responding. Surfacing that as
    # `unhealthy` in `docker ps` is what we need to trip our nginx-proxied
    # ALB probe and Gatus; docker doesn't auto-restart on unhealthy.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:9002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [net]

  mm-bot:
    image: ${ECR}/options/mm-bot:${MM_BOT_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      TOKEN_INFO_URL: http://token-info:9005
      ORACLE_URL: http://oracle-service:9013
      API_URL: http://api-service:9003
      # The desk reconstructs its book from the indexer (SO-299).
      INDEXER_GRAPHQL_URL: http://indexer:9002/graphql
      RUST_LOG: info,mm_bot=info
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    depends_on: [quoting, token-info, api-service, oracle-service]
    restart: unless-stopped
    networks: [net]

  api-service:
    image: ${ECR}/options/api-service:${API_SERVICE_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,api_service=info
    depends_on: [indexer, token-info, oracle-service]
    restart: unless-stopped
    networks: [net]

  # OHLC charting for DeepBook option pools (SO-156). Stores fills in the
  # env's Tiger Data TimescaleDB (CHART_DATABASE_URL from Secrets Manager
  # via render-secrets.sh); serves bars over REST + WS on 9011.
  price-charting:
    image: ${ECR}/options/price-charting:${PRICE_CHARTING_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      CHART_DATABASE_URL: ${CHART_DATABASE_URL}
      ORACLE_URL: http://oracle-service:9013
      RUST_LOG: info,price_charting=debug
    # Reads only [sui] rpc_url from /run/secrets/price-charting.toml (shared Sui
    # RPC override). The watcher's poll loop is a heavy RPC consumer, so this is
    # the main reason price-charting mounts secrets. Optional — absent → public RPC.
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    depends_on: [token-info, api-service, indexer, oracle-service]
    restart: unless-stopped
    networks: [net]

  # NOTE: cctp-relay is deliberately NOT declared in prod. deploy.sh filters
  # the requested set against `docker compose config --services`, so leaving
  # it out is what keeps it from ever being planned or health-gated here.
  # (Same mechanism that excludes market-sim, twitter-service and social-bot.)
  # Re-adding it needs `options/prod/cctp-relay` in Secrets Manager first —
  # render-secrets.sh skips an absent secret silently and the container would
  # crash-loop on the missing /run/secrets/cctp-relay.toml.

  # Gas station. Sponsors user transactions by paying their gas. Public port
  # (9009, proxied by nginx). Reads the sponsor key from /run/secrets.
  gas-station:
    image: ${ECR}/options/gas-station:${GAS_STATION_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,gas_station=info
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [net]

  # Policy-gated co-signer for trading-vault external accounts (mm-bot V2,
  # docs 03/04 §3b). Public port (9017, proxied by nginx). Reads its multisig
  # member key from /run/secrets; appends the decision audit log to the
  # hedge_signer_data volume.
  hedge-signer:
    image: ${ECR}/options/hedge-signer:${HEDGE_SIGNER_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,hedge_signer=info
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
      - hedge_signer_data:/app/data
    depends_on: [token-info]
    restart: unless-stopped
    networks: [net]

  # SUI balance gauges + low-balance alerts for the operational wallets
  # (SO-180). Derives addresses from the same rendered secrets the services
  # mount; scraped by the Prometheus agent on 9012. Not proxied by nginx.
  balance-monitor:
    image: ${ECR}/options/balance-monitor:${BALANCE_MONITOR_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,balance_monitor=debug
      # Enables the SO-387 admin-change watch (whitelist/pause tripwire).
      TOKEN_INFO_URL: http://token-info:9005
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [net]

  # Permissionless trading-vault crank: settles auctions, redeems expired
  # positions, sweeps custody, posts external equity and fulfills the
  # withdrawal queue. Holds only a gas wallet (/run/secrets/keeper.toml,
  # from options/prod/keeper); with no trading vault on chain it idles
  # with /health up. The covered-call crank it used to run alongside this
  # is deprecated (SO-332) and lives in the undeployed keeper-legacy bin.
  keeper:
    image: ${ECR}/options/keeper:${KEEPER_TAG}
    environment:
      APP_ENV: prod
      TOKEN_INFO_URL: http://token-info:9005
      ORACLE_URL: http://oracle-service:9013
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,keeper=info
    volumes:
      - /opt/options/prod/secrets:/run/secrets:ro
    depends_on: [indexer, token-info, oracle-service]
    restart: unless-stopped
    networks: [net]

  # Switchboard Crossbar — third-party utility server for Switchboard
  # on-demand feeds. See docker-compose.staging.yml for the full
  # explanation; this env proxies it as /prod/crossbar.
  crossbar:
    image: switchboardlabs/rust-crossbar:stable
    environment:
      SOLANA_MAINNET_RPC: ${SOLANA_MAINNET_RPC:-https://api.mainnet-beta.solana.com}
      SOLANA_DEVNET_RPC: ${SOLANA_DEVNET_RPC:-https://api.devnet.solana.com}
      SOLANA_MAINNET_RPC_URL: ${SOLANA_MAINNET_RPC:-https://api.mainnet-beta.solana.com}
      SOLANA_DEVNET_RPC_URL: ${SOLANA_DEVNET_RPC:-https://api.devnet.solana.com}
      SUI_TESTNET_RPC: ${SUI_TESTNET_RPC:-https://sui-testnet-rpc.publicnode.com}
      SUI_MAINNET_RPC: ${SUI_MAINNET_RPC:-https://sui-rpc.publicnode.com}
      RUST_LOG: info
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks: [net]

  # Points/leaderboard read+write API (go-backend). Public reads on 9021
  # (nginx /prod/leaderboard/), internal writes on 9022 (never proxied —
  # the event-ingestor posts points there).
  leaderboard:
    image: ${ECR}/options/leaderboard:${LEADERBOARD_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
    restart: unless-stopped
    networks: [net]

  # DB-driven Sui event→points rules (go-backend): polls Sui GraphQL module
  # streams and posts to leaderboard's internal API. Admin plane on 9023
  # (nginx /prod/ingestor/, JWT via auth-service /verify), health/metrics
  # on 9024 (never proxied). No secrets mount — the GraphQL URL is public.
  event-ingestor:
    image: ${ECR}/options/event-ingestor:${EVENT_INGESTOR_TAG}
    environment:
      APP_ENV: prod
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
    depends_on: [leaderboard, auth-service]
    restart: unless-stopped
    networks: [net]

  # Single public entrypoint per env. Strips the /prod/{quoting,api,indexer,mm-bot}
  # prefix before forwarding. depends_on is start-order only; nginx
  # tolerates backends being briefly unreachable on first boot.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9030:80"
    # See docker-compose.staging.yml for why we mount the directory
    # instead of the file.
    volumes:
      - /opt/options/prod/nginx/:/etc/nginx/options/:ro
    command: ["nginx", "-c", "/etc/nginx/options/nginx.conf", "-g", "daemon off;"]
    depends_on: [quoting, api-service, indexer, mm-bot, token-info, auth-service, gas-station, hedge-signer, keeper, crossbar]
    restart: unless-stopped
    networks: [net]

networks:
  net:

volumes:
  # hedge-signer's append-only decision audit log (/app/data/audit.jsonl).
  hedge_signer_data:

# Compose stack for the `prod` env (Sui mainnet).
# Variables come from /opt/options/prod/.env, written by deploy.sh.
#
# mm-bot and option-scheduler are commented out until the faucet-less
# mainnet bootstrap path and deployer-key handling are in place. The
# indexer and quoting-service deploy cleanly on mainnet on their own.
# When deploy.sh is asked to roll a service that isn't declared here it
# logs and skips, so leaving the blocks commented is the supported way
# to opt-out per env.

name: options-prod

services:
  indexer:
    image: ${ECR}/options/indexer:${INDEXER_TAG}
    environment:
      APP_ENV: prod
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      RUST_LOG: info,indexer=info
    restart: unless-stopped
    networks: [net]

  quoting:
    image: ${ECR}/options/quoting-service:${QUOTING_TAG}
    environment:
      APP_ENV: prod
      RUST_LOG: info,quoting_service=info
    depends_on: [indexer]
    restart: unless-stopped
    # If the tokio runtime wedges (see SO-65), the container's TCP listener
    # stays open but /health stops responding. Surfacing that as
    # `unhealthy` in `docker ps` is what we need to trip our nginx-proxied
    # ALB probe and Gatus; docker doesn't auto-restart on unhealthy.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:9002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [net]

  # mm-bot:
  #   image: ${ECR}/options/mm-bot:${MM_BOT_TAG}
  #   environment:
  #     APP_ENV: prod
  #     RUST_LOG: info,mm_bot=info
  #   volumes:
  #     - mm_bot_state:/app/state
  #     - /opt/options/prod/secrets:/run/secrets:ro
  #   depends_on: [quoting]
  #   restart: unless-stopped
  #   networks: [net]

  # option-scheduler:
  #   image: ${ECR}/options/option-scheduler:${SCHEDULER_TAG}
  #   environment:
  #     APP_ENV: prod
  #     RUST_LOG: info,option_scheduler=info
  #   volumes:
  #     - /opt/options/prod/secrets:/run/secrets:ro
  #   depends_on: [indexer]
  #   restart: unless-stopped
  #   networks: [net]

  api-service:
    image: ${ECR}/options/api-service:${API_SERVICE_TAG}
    environment:
      APP_ENV: prod
      RUST_LOG: info,api_service=info
    depends_on: [indexer]
    restart: unless-stopped
    networks: [net]

  # Single public entrypoint per env. Strips the /prod/{quoting,api,indexer,scheduler,mm-bot}
  # prefix before forwarding. depends_on is start-order only; nginx
  # tolerates backends being briefly unreachable on first boot.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9030:80"
    # See docker-compose.staging.yml for why we mount the directory
    # instead of the file.
    volumes:
      - /opt/options/prod/nginx/:/etc/nginx/options/:ro
    command: ["nginx", "-c", "/etc/nginx/options/nginx.conf", "-g", "daemon off;"]
    depends_on: [quoting, api-service, indexer]
    restart: unless-stopped
    networks: [net]

networks:
  net:

volumes:
  mm_bot_state:

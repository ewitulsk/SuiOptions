# Compose stack for the `staging` env (Sui testnet).
# Variables come from /opt/options/staging/.env, written by deploy.sh.
# Each service has its own _TAG variable so selective deploys only roll
# the containers whose image moved.

name: options-staging

services:
  # Token catalog. Binds a public read port (9005, proxied by nginx) and an
  # internal mutate port (9006, never proxied — reachable only on `net`/VPN).
  # Publishes no host ports.
  token-info:
    image: ${ECR}/options/token-info:${TOKEN_INFO_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      RUST_LOG: info,token_info=debug
    # deployments.json is mounted from the host (the deploy bundle drops it
    # there) instead of baked into the image. Bind-mount the DIRECTORY, not the
    # file, so the bundle's tar unlink+create doesn't orphan the container's
    # view of the inode — same trap nginx avoids. config.staging.toml points
    # deployments_path at /app/deployments/deployments.json.
    volumes:
      - /opt/options/staging/deployments/:/app/deployments/:ro
    depends_on: [auth-service]
    restart: unless-stopped
    networks: [net]

  # Admin auth. Issues + verifies the JWTs that gate token-info's public
  # mutate endpoints. Public port (9007, proxied by nginx) + internal verify
  # port (9008, never proxied). Reads its JWT secret from /run/secrets.
  auth-service:
    image: ${ECR}/options/auth-service:${AUTH_SERVICE_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,auth_service=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [net]

  indexer:
    image: ${ECR}/options/indexer:${INDEXER_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      RUST_LOG: info,indexer=debug
    # Reads only [sui] rpc_url from /run/secrets/indexer.toml (shared Sui RPC
    # override, rendered by render-secrets.sh). Optional — absent file → public RPC.
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    depends_on: [token-info]
    restart: unless-stopped
    networks: [net]

  # Solana-port indexer: ingests the three Solana programs' emit_cpi events
  # from Helius LaserStream (devnet) and serves the GraphQL query API on
  # 9002 / ops on 8081 (proxied by nginx under /staging/solana-indexer).
  # Requires /run/secrets/solana-indexer.toml ([helius] api_key).
  solana-indexer:
    image: ${ECR}/options/solana-indexer:${SOLANA_INDEXER_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      RUST_LOG: info,solana_indexer=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [net]

  # Single internal Pyth gateway (SO-254): one Hermes SSE subscription + all
  # Pyth caching, fanned out over REST + WS on 9013 (never proxied). Reads the
  # Pyth API key from /run/secrets/oracle-service.toml; discovers feeds from
  # token-info. Every other service reads prices/vol from here.
  oracle-service:
    image: ${ECR}/options/oracle-service:${ORACLE_SERVICE_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,oracle_service=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    depends_on: [token-info]
    restart: unless-stopped
    networks: [net]

  quoting:
    image: ${ECR}/options/quoting-service:${QUOTING_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,quoting_service=debug
    depends_on: [indexer, token-info]
    restart: unless-stopped
    # If the tokio runtime wedges (see SO-65), the container's TCP listener
    # stays open but /health stops responding. Surfacing that as
    # `unhealthy` in `docker ps` is what we need to trip our nginx-proxied
    # ALB probe and Gatus; docker doesn't auto-restart on unhealthy.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:9002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [net]

  mm-bot:
    image: ${ECR}/options/mm-bot:${MM_BOT_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      TOKEN_INFO_URL: http://token-info:9005
      ORACLE_URL: http://oracle-service:9013
      API_URL: http://api-service:9003
      RUST_LOG: info,mm_bot=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    depends_on: [quoting, token-info, api-service, oracle-service]
    restart: unless-stopped
    networks: [net]

  option-scheduler:
    image: ${ECR}/options/option-scheduler:${SCHEDULER_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      # Mandatory: the scheduler refuses to start without its rolls DB.
      # Expanded into scheduler_database_url in config.staging.toml.
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      TOKEN_INFO_URL: http://token-info:9005
      ORACLE_URL: http://oracle-service:9013
      RUST_LOG: info,option_scheduler=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    depends_on: [indexer, token-info, oracle-service]
    restart: unless-stopped
    networks: [net]

  api-service:
    image: ${ECR}/options/api-service:${API_SERVICE_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,api_service=debug
    depends_on: [indexer, token-info]
    restart: unless-stopped
    networks: [net]

  # OHLC charting for DeepBook option pools (SO-156). Stores fills in the
  # env's Tiger Data TimescaleDB (CHART_DATABASE_URL from Secrets Manager
  # via render-secrets.sh); serves bars over REST + WS on 9011.
  price-charting:
    image: ${ECR}/options/price-charting:${PRICE_CHARTING_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      CHART_DATABASE_URL: ${CHART_DATABASE_URL}
      ORACLE_URL: http://oracle-service:9013
      RUST_LOG: info,price_charting=debug
    # Reads only [sui] rpc_url from /run/secrets/price-charting.toml (shared Sui
    # RPC override). The watcher's poll loop is a heavy RPC consumer, so this is
    # the main reason price-charting mounts secrets. Optional — absent → public RPC.
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    depends_on: [token-info, api-service, indexer, oracle-service]
    restart: unless-stopped
    networks: [net]

  # Gas station. Sponsors user transactions by paying their gas. Public port
  # (9009, proxied by nginx). Reads the sponsor key from /run/secrets.
  gas-station:
    image: ${ECR}/options/gas-station:${GAS_STATION_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,gas_station=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [net]

  # SUI balance gauges + low-balance alerts for the operational wallets
  # (SO-180). Derives addresses from the same rendered secrets the services
  # mount; scraped by Prometheus on 9012. Not proxied by nginx.
  balance-monitor:
    image: ${ECR}/options/balance-monitor:${BALANCE_MONITOR_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,balance_monitor=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [net]

  # Permissionless covered-call vault crank (guide doc 04). Holds only a
  # gas wallet (/run/secrets/keeper.toml, from options/staging/keeper).
  # Vaults are auto-discovered from the indexer's vaults view — a vault
  # created on chain is picked up on the next tick, no config change;
  # with none on chain the keeper idles with /health up.
  keeper:
    image: ${ECR}/options/keeper:${KEEPER_TAG}
    environment:
      APP_ENV: staging
      TOKEN_INFO_URL: http://token-info:9005
      ORACLE_URL: http://oracle-service:9013
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,keeper=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    depends_on: [indexer, token-info, oracle-service]
    restart: unless-stopped
    networks: [net]

  # ── Solana stack (docs/solana/backend/00-architecture.md) ─────────────
  # Runs alongside the Sui services on the same host. Ports duplicate the
  # Sui twins' numbers deliberately — containers are distinct on `net` and
  # nginx routes by service name, so there is no collision.

  # Solana token catalog — the sole reader of solana-deployments.json.
  # Public read port 9005 (proxied under /staging/solana-token-info) +
  # internal mutate port 9006 (never proxied).
  solana-token-info:
    image: ${ECR}/options/solana-token-info:${SOLANA_TOKEN_INFO_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      RUST_LOG: info,solana_token_info=debug
    # solana-deployments.json rides in the same deploy-bundle directory
    # mount as the Sui token-info's deployments.json (see that block's
    # inode-trap note). config.staging.toml points deployments_path at
    # /app/deployments/solana-deployments.json.
    volumes:
      - /opt/options/staging/deployments/:/app/deployments/:ro
    depends_on: [solana-auth-service]
    restart: unless-stopped
    networks: [net]

  # Solana admin auth (JWTs for solana-token-info's mutate endpoints).
  # Public port 9007 (proxied under /staging/solana-auth) + internal verify
  # port 9008 (never proxied). Reads its JWT secret from /run/secrets.
  solana-auth-service:
    image: ${ECR}/options/solana-auth-service:${SOLANA_AUTH_SERVICE_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,solana_auth_service=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [net]

  # Single internal Pyth gateway for the Solana stack (mirrors
  # oracle-service): one Hermes SSE subscription, REST + WS on 9013 (never
  # proxied). Reads the Pyth API key from
  # /run/secrets/solana-oracle-service.toml; discovers feeds from
  # solana-token-info.
  solana-oracle-service:
    image: ${ECR}/options/solana-oracle-service:${SOLANA_ORACLE_SERVICE_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,solana_oracle_service=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    depends_on: [solana-token-info]
    restart: unless-stopped
    networks: [net]

  # Solana RFQ hub (WS + HTTP on 9002, proxied under /staging/solana-quoting).
  solana-quoting-service:
    image: ${ECR}/options/solana-quoting-service:${SOLANA_QUOTING_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,solana_quoting_service=debug
    depends_on: [solana-indexer, solana-token-info]
    restart: unless-stopped
    networks: [net]

  solana-api-service:
    image: ${ECR}/options/solana-api-service:${SOLANA_API_SERVICE_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,solana_api_service=debug
    depends_on: [solana-indexer, solana-token-info]
    restart: unless-stopped
    networks: [net]

  # Solana OHLC/APY store (Tiger Data TimescaleDB via
  # SOLANA_CHART_DATABASE_URL, rendered by render-secrets.sh); REST + WS on
  # 9011 (proxied under /staging/solana-charts). No secrets mount — no
  # chain reads (no ingestion tasks until a Solana DEX integration lands).
  solana-price-charting:
    image: ${ECR}/options/solana-price-charting:${SOLANA_PRICE_CHARTING_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      SOLANA_CHART_DATABASE_URL: ${SOLANA_CHART_DATABASE_URL}
      RUST_LOG: info,solana_price_charting=debug
    depends_on: [solana-token-info, solana-indexer, solana-oracle-service]
    restart: unless-stopped
    networks: [net]

  # Solana gas station: co-signs the fee-payer slot with the station wallet
  # and serves the non-mainnet test-token faucet. Public port 9009 (proxied
  # under /staging/solana-gas-station). Reads the station key from
  # /run/secrets.
  solana-gas-station:
    image: ${ECR}/options/solana-gas-station:${SOLANA_GAS_STATION_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,solana_gas_station=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    depends_on: [solana-token-info]
    restart: unless-stopped
    networks: [net]

  # Solana covered-call vault crank (guide doc 09). Holds only a gas wallet
  # (/run/secrets/solana-keeper.toml); vaults are auto-discovered from the
  # solana-indexer's vaults view. Ops-only /health + /metrics on 8086.
  solana-keeper:
    image: ${ECR}/options/solana-keeper:${SOLANA_KEEPER_TAG}
    environment:
      APP_ENV: staging
      TOKEN_INFO_URL: http://solana-token-info:9005
      ORACLE_URL: http://solana-oracle-service:9013
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,solana_keeper=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    depends_on: [solana-indexer, solana-token-info, solana-oracle-service]
    restart: unless-stopped
    networks: [net]

  # Solana bucket/vault roller (guide doc 10). Signs with the admin keypair
  # (/run/secrets/solana-scheduler.toml). Ops-only /health + /metrics on
  # 8087.
  solana-option-scheduler:
    image: ${ECR}/options/solana-option-scheduler:${SOLANA_SCHEDULER_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      # Mandatory: the scheduler refuses to start without its rolls DB
      # (solana_scheduler_staging). Expanded in config.staging.toml.
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      TOKEN_INFO_URL: http://solana-token-info:9005
      ORACLE_URL: http://solana-oracle-service:9013
      RUST_LOG: info,solana_option_scheduler=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    depends_on: [solana-indexer, solana-token-info, solana-oracle-service]
    restart: unless-stopped
    networks: [net]

  # Solana market maker (guide doc 11). Signs quotes with
  # /run/secrets/solana-mm-bot.toml. Ops-only /health + /metrics on 9010.
  solana-mm-bot:
    image: ${ECR}/options/solana-mm-bot:${SOLANA_MM_BOT_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      TOKEN_INFO_URL: http://solana-token-info:9005
      ORACLE_URL: http://solana-oracle-service:9013
      API_URL: http://solana-api-service:9003
      RUST_LOG: info,solana_mm_bot=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    depends_on: [solana-quoting-service, solana-token-info, solana-api-service, solana-oracle-service]
    restart: unless-stopped
    networks: [net]

  # SOL balance gauges + low-balance alerts for the Solana operational
  # wallets. Derives addresses from the same rendered secrets the services
  # mount (whole secrets dir, like the Sui balance-monitor); scraped by
  # Prometheus on 9012. Not proxied by nginx.
  solana-balance-monitor:
    image: ${ECR}/options/solana-balance-monitor:${SOLANA_BALANCE_MONITOR_TAG}
    environment:
      APP_ENV: staging
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      RUST_LOG: info,solana_balance_monitor=debug
    volumes:
      - /opt/options/staging/secrets:/run/secrets:ro
    restart: unless-stopped
    networks: [net]

  # Single public entrypoint per env. Strips the /staging/{quoting,api,indexer,scheduler,mm-bot}
  # prefix before forwarding. depends_on is start-order only; nginx
  # tolerates backends being briefly unreachable on first boot.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9020:80"
    # Bind-mount the directory (not the file) so file replacements by
    # the bundle's tar extraction are visible inside the container —
    # a single-file mount binds the host inode, which tar's
    # unlink+create silently orphans. nginx -c picks the file out of
    # the mounted directory; the image's default /etc/nginx/nginx.conf
    # stays untouched and unused.
    volumes:
      - /opt/options/staging/nginx/:/etc/nginx/options/:ro
    command: ["nginx", "-c", "/etc/nginx/options/nginx.conf", "-g", "daemon off;"]
    depends_on: [quoting, api-service, indexer, option-scheduler, mm-bot, token-info, auth-service, gas-station, keeper, solana-indexer, solana-token-info, solana-auth-service, solana-api-service, solana-quoting-service, solana-price-charting, solana-gas-station]
    restart: unless-stopped
    networks: [net]

networks:
  net:

# Prometheus configuration — central server on the shared services EC2.
#
# Scrapes every staging service's /metrics over the options-staging_net
# docker network (Prometheus joins it, see docker-compose.monitoring.yml).
# The dedicated prod host runs a Prometheus agent (docker-compose.prom-agent.yml)
# that remote-writes here with env=prod external labels — this server has
# --web.enable-remote-write-receiver for that.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: services-staging
    static_configs:
      - targets: ["indexer:8081"]
        labels: { env: staging, service: indexer }
      - targets: ["quoting:9002"]
        labels: { env: staging, service: quoting }
      - targets: ["api-service:9003"]
        labels: { env: staging, service: api-service }
      - targets: ["token-info:9006"] # internal port; /metrics is never public
        labels: { env: staging, service: token-info }
      - targets: ["auth-service:9008"] # internal port
        labels: { env: staging, service: auth-service }
      - targets: ["gas-station:9009"]
        labels: { env: staging, service: gas-station }
      - targets: ["price-charting:9011"]
        labels: { env: staging, service: price-charting }
      - targets: ["mm-bot:8084"]
        labels: { env: staging, service: mm-bot }
      - targets: ["staging-mm-bot:8085"]
        labels: { env: staging, service: staging-mm-bot }
      - targets: ["balance-monitor:9012"]
        labels: { env: staging, service: balance-monitor }
      - targets: ["oracle-service:9013"] # internal Pyth gateway; /metrics on the service port
        labels: { env: staging, service: oracle-service }
      - targets: ["cctp-relay:9015"] # bridge relay; cctp_bridge_duration_seconds lives here
        labels: { env: staging, service: cctp-relay }
      - targets: ["leaderboard:9022"] # internal port; /metrics is never public
        labels: { env: staging, service: leaderboard }
      - targets: ["event-ingestor:9024"] # internal port; poll lag + delivery counters
        labels: { env: staging, service: event-ingestor }

  # data-room-host is a separate EC2 instance in the same VPC, not on
  # options-staging_net, so it is scraped by private IP rather than by
  # container name. The data-room SG already allows 9100 from the shared
  # host's SG. The IP is static in practice (the instance is long-lived:
  # delete_on_termination=false, user_data_replace_on_change=false); it is
  # exposed as the `data_room_private_ip` terraform output, so re-derive it
  # from there if the host is ever replaced.
  #
  # job_name is deliberately `services-*` so the existing
  # `scrape-target-down` Grafana rule (job=~"services-.*") covers it with
  # no new rule.
  - job_name: services-data-room
    static_configs:
      # DO data-room droplet's VPC-private IP (infra-do output
      # data_room_private_ip) — update if the droplet is ever replaced.
      - targets: ["10.60.0.3:9100"]
        labels: { env: data-room, service: data-room-collector }

  # The monitoring stack watches itself.
  - job_name: monitoring
    static_configs:
      - targets: ["prometheus:9090"]
        labels: { env: monitoring, service: prometheus }
      - targets: ["loki:3100"]
        labels: { env: monitoring, service: loki }
      - targets: ["tempo:3200"]
        labels: { env: monitoring, service: tempo }

# Tempo configuration — single-binary, local storage, 7-day retention.
#
# Receives OTLP/HTTP spans on 4318 from the services (staging over the
# docker network; prod over the VPC private IP, SG-gated like Loki 3100).
# The metrics-generator remote-writes RED span metrics + service graphs
# into the co-located Prometheus, which powers Grafana's traces-to-metrics
# and service-map views.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    local:
      path: /tempo/blocks
    wal:
      path: /tempo/wal

compactor:
  compaction:
    block_retention: 168h

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

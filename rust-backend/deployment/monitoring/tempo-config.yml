# Tempo configuration — single-binary, local storage, 5-day retention.
#
# Receives OTLP/HTTP spans on 4318 from the services (staging over the
# docker network; prod over the VPC private IP, SG-gated like Loki 3100).
# The metrics-generator remote-writes RED span metrics + service graphs
# into the co-located Prometheus, which powers Grafana's traces-to-metrics
# and service-map views.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 120h

metrics_generator:
  registry:
    external_labels:
      source: tempo
    # Evict series idle >10m (default 15m) so the in-memory registry doesn't
    # retain stale span/edge series during traffic dips.
    stale_duration: 10m
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
      # Hard cap on in-memory active series so the generator can't grow
      # unbounded and OOM the host (SO-210). Excess series are dropped past
      # the cap; watch tempo_metrics_generator_registry_active_series and
      # raise this if it's legitimately hit.
      max_active_series: 20000

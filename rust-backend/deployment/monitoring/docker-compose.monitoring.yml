# Monitoring stack: Grafana + Loki + Prometheus + Tempo.
# Runs on the services EC2 alongside the per-env compose stacks.
# Promtail (in docker-compose.promtail.yml) joins the same network.
#
# Prometheus and Tempo also join options-staging_net so Prometheus can
# scrape the staging services by compose DNS name and the services can
# push OTLP spans to `tempo:4318` (same pattern as gatus). The prod host
# pushes both signals over the VPC instead: Promtail→Loki:3100,
# prom-agent→Prometheus:9090, OTLP→Tempo:4318 — all SG-gated to co-SG
# hosts, never public.

name: options-monitoring

services:
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/loki-config.yml -config.expand-env=true
    environment:
      LOKI_S3_BUCKET: ${LOKI_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - ${DATA_DIR}/loki/config:/etc/loki:ro
      - ${DATA_DIR}/loki/data:/loki
    ports:
      # Bound on all interfaces (not just loopback) so the dedicated prod
      # host's Promtail can push over the private VPC IP. Access is gated
      # by the EC2 SG, which only allows 3100 between co-SG hosts (see
      # infra/security_groups.tf) — never the ALB or the internet.
      - "3100:3100"
    restart: unless-stopped
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ${DATA_DIR}/grafana/data:/var/lib/grafana
      - ${DATA_DIR}/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on: [loki]
    restart: unless-stopped
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      # The prod host's agent remote-writes here.
      - --web.enable-remote-write-receiver
    volumes:
      - ${DATA_DIR}/prometheus/config:/etc/prometheus:ro
      - ${DATA_DIR}/prometheus/data:/prometheus
    ports:
      # All-interfaces bind for the prod host's remote_write over the
      # private VPC IP; SG allows 9090 only between co-SG hosts.
      - "9090:9090"
    restart: unless-stopped
    networks:
      - monitoring
      - options-staging_net

  tempo:
    image: grafana/tempo:2.8.0
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ${DATA_DIR}/tempo/config:/etc/tempo:ro
      - ${DATA_DIR}/tempo/data:/var/tempo
    ports:
      # OTLP/HTTP ingest from the prod host over the private VPC IP;
      # SG allows 4318 only between co-SG hosts.
      - "4318:4318"
    restart: unless-stopped
    networks:
      - monitoring
      - options-staging_net

  gatus:
    image: twinproduction/gatus:v5.17.0
    volumes:
      - ${DATA_DIR}/gatus/config:/config:ro
      - ${DATA_DIR}/gatus/data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - monitoring
      - options-staging_net

networks:
  monitoring:
  options-staging_net:
    external: true

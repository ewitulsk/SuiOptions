# Loki configuration — single-binary mode, S3-compatible storage
# (DigitalOcean Spaces since the DO migration).
# Environment variables expanded at runtime by Loki's -config.expand-env flag:
#   LOKI_S3_BUCKET, LOKI_S3_ENDPOINT, LOKI_S3_REGION,
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (Spaces key)

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  wal:
    enabled: true
    dir: /loki/wal

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
  aws:
    # The old `s3://region/bucket` shorthand is AWS-only; Spaces needs an
    # explicit endpoint. Credentials come from AWS_ACCESS_KEY_ID /
    # AWS_SECRET_ACCESS_KEY in the container env (the Spaces key).
    bucketnames: ${LOKI_S3_BUCKET}
    endpoint: ${LOKI_S3_ENDPOINT}
    region: ${LOKI_S3_REGION}
    s3forcepathstyle: true

limits_config:
  retention_period: 120h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_series: 5000
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: s3

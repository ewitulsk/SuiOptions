# Grafana alert-rule provisioning (SO-180).
#
# Five rules:
#  1. alert-id-errors — ANY error!() log carrying an `alert_id` field, in any
#     service, fires within a minute, grouped by alert_id. Adding a new alert
#     is purely `error!(alert_id = "stable-id", ...)` in code — no infra.
#  2. low-sui-balance — balance-monitor's `sui_balance_low` gauge.
#  3. scrape-target-down — Prometheus `up == 0` for any service.
#  4. dataroom-collector-stalled — a data-room capture feed that has gone
#     quiet while the process is still up (SO-402).
#  5. dataroom-stream-stalled — ONE fixed-cadence poller stream quiet
#     while sibling streams on the same exchange stay live (SO-427).
#
# Contact points / notification policies are NOT provisioned — configure
# them in the Grafana UI (they persist in the grafana data volume); these
# rules route through the default policy.

apiVersion: 1

groups:
  - orgId: 1
    name: options-alerts
    folder: Options
    interval: 1m
    rules:
      - uid: alert-id-errors
        title: Tagged error logs (alert_id)
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'error!() with alert_id={{ $labels.alert_id }} in {{ $labels.service }} ({{ $labels.env }})'
        labels:
          source: alert_id_logs
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: 'sum by (env, service, alert_id) (count_over_time({service=~".+"} | json | fields_alert_id != `` | label_format alert_id=fields_alert_id [5m]))'
              queryType: instant
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last, params: [] }

      - uid: low-sui-balance
        title: Low SUI balance
        condition: B
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: '{{ $labels.service }} wallet ({{ $labels.env }}) is below its SUI threshold'
        labels:
          source: balance_monitor
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'max by (env, service) (sui_balance_low) > 0'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last, params: [] }

      - uid: scrape-target-down
        title: Service metrics target down
        condition: B
        for: 3m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: '{{ $labels.service }} ({{ $labels.env }}) /metrics is unreachable'
        labels:
          source: prometheus_up
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'max by (env, service) (up{job=~"services-.*"}) == 0'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last, params: [] }

      # A feed that has gone quiet while the collector process is still up.
      # `up == 0` (scrape-target-down) covers the process dying; this covers
      # the nastier case where the daemon lives but one exchange's socket or
      # poller has stopped producing. Threshold is 10m: the slowest poller in
      # collector.toml runs at 60s, so 10m is ~10 missed cycles and will not
      # flap. noDataState is OK deliberately — a vanished target is
      # scrape-target-down's job, not this rule's.
      - uid: dataroom-collector-stalled
        title: data-room collector feed stalled
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'data-room capture from {{ $labels.exchange }} has produced no messages for >10m'
        labels:
          source: dataroom_collector
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'time() - max by (exchange) (dataroom_collector_last_message_unix_seconds) > 600'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last, params: [] }

      # Per-STREAM stall (SO-427): the exchange-level rule above
      # aggregates `max by (exchange)`, so one dead poller hides behind a
      # live sibling stream on the same exchange. Scoped to fixed-cadence
      # streams only (chain./book./ticker./route. — pollers at 30–300s
      # plus the continuous Bluefin diff-depth): 15m is ≥3 missed cycles
      # of the slowest 300s ladder poll. Event-driven streams (trades.*,
      # control.*) can legitimately gap and stay under the exchange rule.
      # Needs the `stream` label on the freshness gauge (collector
      # ≥ SO-427).
      - uid: dataroom-stream-stalled
        title: data-room collector stream stalled
        condition: B
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'data-room stream {{ $labels.exchange }}/{{ $labels.stream }} has produced no messages for >15m while its exchange is otherwise live'
        labels:
          source: dataroom_collector
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'time() - max by (exchange, stream) (dataroom_collector_last_message_unix_seconds{stream=~"(chain|book|ticker|route)\\..*"}) > 900'
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { type: last, params: [] }

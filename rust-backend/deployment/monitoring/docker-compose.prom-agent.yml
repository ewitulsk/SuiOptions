# Prometheus agent — dedicated prod host only.
# Scrapes the prod services over options-prod_net and remote-writes to the
# central Prometheus on the shared services host (same push pattern as the
# prod Promtail → central Loki). REMOTE_WRITE_URL comes from the monitoring
# .env written by cloud-init.

name: options-prom-agent

services:
  prom-agent:
    image: prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus-agent.yml
      - --config.expand-env=true
      - --agent
    environment:
      REMOTE_WRITE_URL: ${REMOTE_WRITE_URL}
    volumes:
      - ${DATA_DIR}/prom-agent/config:/etc/prometheus:ro
      - ${DATA_DIR}/prom-agent/data:/prometheus
    restart: unless-stopped
    networks:
      - options-prod_net

networks:
  options-prod_net:
    external: true

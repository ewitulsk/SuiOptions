# nginx sidecar for the `staging` env. See nginx.dev.conf for the full
# explanation — this file only swaps the env name in the location blocks.

worker_processes 1;
events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  resolver 127.0.0.11 ipv6=off valid=10s;

  server {
    listen 80;
    server_name _;

    location = /staging/health {
      default_type text/plain;
      return 200 "ok\n";
    }

    location ~ ^/staging/quoting(?:/(?<tail>.*))?$ {
      set $upstream "quoting:9002";
      proxy_pass http://$upstream/$tail;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location ~ ^/staging/api(?:/(?<tail>.*))?$ {
      set $upstream "api-service:9003";
      proxy_pass http://$upstream/$tail;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      default_type text/plain;
      return 404 "not found\n";
    }
  }
}

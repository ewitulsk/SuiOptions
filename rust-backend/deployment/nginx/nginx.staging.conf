# nginx sidecar for the `staging` env. Single entrypoint per env — the
# ALB forwards /staging/* here, this config dispatches to the right
# backend and strips the public URL prefix so services stay
# prefix-unaware. nginx.prod.conf is identical apart from the env name
# in the location blocks.
#
# Public URL shape (terminated by the ALB):
#   wss://<host>/staging/quoting            -> quoting-service WS handshake
#   https://<host>/staging/api/<path>       -> api-service /<path>
#   https://<host>/staging/indexer/<path>   -> indexer /<path>
#   https://<host>/staging/scheduler/<path> -> option-scheduler /<path>
#   https://<host>/staging/mm-bot/<path>    -> mm-bot /<path>
#   https://<host>/staging/market-sim/<path> -> market-sim /<path> (health/metrics)

worker_processes 1;
events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  resolver 127.0.0.11 ipv6=off valid=10s;

  server {
    listen 80;
    server_name _;

    # Real upstream probe — the ALB target group hits this every 15s.
    # Quoting is the WS hub and historically the most fragile service;
    # if it's unresponsive, the env should be marked unhealthy so the
    # listener serves 503 instead of silently routing into a hung pool.
    # This upstream must NOT be a slow-starting `ops::spawn` service. Since
    # SO-324 those answer 503 until startup completes, and this probe is what
    # takes the environment out of service:
    #
    #   interval 15s, unhealthy threshold 3  -> ~30-45s of continuous 503
    #   deregisters the whole environment, staging and prod alike
    #
    # So the hazard is a startup longer than that window, not any 503 at all.
    # Measured 2026-07-30, spawn -> ready, all six ops::spawn services: mm-bot
    # 10.0s (the slowest by far), option-scheduler 0.66s, keeper 0.64s,
    # market-sim 0.16s, balance-monitor 0.14s, indexer ~0s. Every one is inside
    # a single failed probe today, so repointing this at any
    # current ops::spawn service would not deregister anything — but nothing
    # holds those startups where they are, and mm-bot has already grown to
    # two-thirds of one probe interval.
    #
    # quoting-service serves /health from its axum router, which binds only
    # after startup has succeeded, so it has no not-ready window at all.
    location = /staging/health {
      set $upstream "quoting:9002";
      proxy_pass http://$upstream/health;
      proxy_connect_timeout 2s;
      proxy_read_timeout    3s;
      proxy_send_timeout    3s;
      proxy_set_header Host $host;
    }

    location ~ ^/staging/quoting(?:/(?<tail>.*))?$ {
      set $upstream "quoting:9002";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location ~ ^/staging/api(?:/(?<tail>.*))?$ {
      set $upstream "api-service:9003";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public GraphQL query API (read-only, depth/complexity-limited). Matched
    # before the catch-all indexer block below so it routes to 9002, not 8081.
    location ~ ^/staging/indexer/graphql(?:/(?<tail>.*))?$ {
      set $upstream "indexer:9002";
      proxy_pass http://$upstream/graphql$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/staging/indexer(?:/(?<tail>.*))?$ {
      set $upstream "indexer:8081";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # token-info read API. Only the public read port (9005) is proxied;
    # the internal mutate port (9006) is deliberately never routed here.
    location ~ ^/staging/token-info(?:/(?<tail>.*))?$ {
      set $upstream "token-info:9005";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # auth-service public API (challenge / login / refresh). The internal
    # verify port (9008) is deliberately never routed here.
    location ~ ^/staging/auth(?:/(?<tail>.*))?$ {
      set $upstream "auth-service:9007";
      proxy_pass http://$upstream/$tail;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gas-station public API (balance / sponsor).
    # price-charting (SO-156): REST bars + live-bar WebSocket.
    location ~ ^/staging/charts(?:/(?<tail>.*))?$ {
      set $upstream "price-charting:9011";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # cctp-relay: bridge transfer registration + status polling.
    location ~ ^/staging/cctp(?:/(?<tail>.*))?$ {
      set $upstream "cctp-relay:9015";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/staging/gas-station(?:/(?<tail>.*))?$ {
      set $upstream "gas-station:9009";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hedge-signer: external-account co-signing (pubkey / policy / sign).
    location ~ ^/staging/hedge-signer(?:/(?<tail>.*))?$ {
      set $upstream "hedge-signer:9017";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/staging/scheduler(?:/(?<tail>.*))?$ {
      set $upstream "option-scheduler:8083";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/staging/mm-bot(?:/(?<tail>.*))?$ {
      set $upstream "mm-bot:8084";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # market-sim health/metrics surface (SO-302).
    location ~ ^/staging/market-sim(?:/(?<tail>.*))?$ {
      set $upstream "market-sim:9018";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # social-bot route removed with the PR #280 strip (see the compose file
    # note) — restore it together with the service blocks.

    # vault-keeper health/metrics surface (8086 — see observability::ops).
    location ~ ^/staging/keeper(?:/(?<tail>.*))?$ {
      set $upstream "keeper:8086";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      default_type text/plain;
      return 404 "not found\n";
    }
  }
}

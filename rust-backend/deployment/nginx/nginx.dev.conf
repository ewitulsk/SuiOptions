# nginx sidecar for the `dev` env. Single entrypoint per env — the ALB
# forwards /dev/* here, this config dispatches to the right backend and
# strips the public URL prefix so services stay prefix-unaware.
#
# Public URL shape (terminated by the ALB):
#   wss://<host>/dev/quoting          -> quoting-service WS handshake
#   https://<host>/dev/api/<path>     -> api-service /<path>
#   https://<host>/dev/indexer/<path> -> indexer /<path>
#   https://<host>/dev/scheduler/<path> -> option-scheduler /<path>
#   https://<host>/dev/mm-bot/<path>  -> mm-bot /<path>

worker_processes 1;
events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker's embedded DNS. Re-resolve upstream IPs every 10s so a backend
  # container restart (which may rotate the IP) doesn't permanently break
  # us — nginx caches IPs at startup otherwise and never refreshes.
  resolver 127.0.0.11 ipv6=off valid=10s;

  # The variable-in-proxy_pass form requires us to construct the upstream
  # URL ourselves; in exchange nginx re-resolves DNS at request time
  # rather than at startup.
  server {
    listen 80;
    server_name _;

    # Real upstream probe — the ALB target group hits this every 15s.
    # Quoting is the WS hub and historically the most fragile service;
    # if it's unresponsive, the env should be marked unhealthy so the
    # listener serves 503 instead of silently routing into a hung pool.
    location = /dev/health {
      set $upstream "quoting:9002";
      proxy_pass http://$upstream/health;
      proxy_connect_timeout 2s;
      proxy_read_timeout    3s;
      proxy_send_timeout    3s;
      proxy_set_header Host $host;
    }

    # quoting-service WS. Matches both /dev/quoting (bare) and
    # /dev/quoting/<anything>; forwards as /<anything> (or /) to the
    # upstream so the WS handshake sees a normal request line.
    location ~ ^/dev/quoting(?:/(?<tail>.*))?$ {
      set $upstream "quoting:9002";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # api-service HTTP. Same prefix-strip pattern.
    location ~ ^/dev/api(?:/(?<tail>.*))?$ {
      set $upstream "api-service:9003";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public GraphQL query API (read-only, depth/complexity-limited). Matched
    # before the catch-all indexer block below so it routes to 9002, not 8081.
    location ~ ^/dev/indexer/graphql(?:/(?<tail>.*))?$ {
      set $upstream "indexer:9002";
      proxy_pass http://$upstream/graphql$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # indexer HTTP.
    location ~ ^/dev/indexer(?:/(?<tail>.*))?$ {
      set $upstream "indexer:8081";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # token-info read API. Only the public read port (9005) is proxied;
    # the internal mutate port (9006) is deliberately never routed here.
    location ~ ^/dev/token-info(?:/(?<tail>.*))?$ {
      set $upstream "token-info:9005";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # auth-service public API (challenge / login / refresh). The internal
    # verify port (9008) is deliberately never routed here.
    location ~ ^/dev/auth(?:/(?<tail>.*))?$ {
      set $upstream "auth-service:9007";
      proxy_pass http://$upstream/$tail;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gas-station public API (balance / sponsor).
    location ~ ^/dev/gas-station(?:/(?<tail>.*))?$ {
      set $upstream "gas-station:9009";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # option-scheduler HTTP.
    location ~ ^/dev/scheduler(?:/(?<tail>.*))?$ {
      set $upstream "option-scheduler:8083";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # mm-bot HTTP.
    location ~ ^/dev/mm-bot(?:/(?<tail>.*))?$ {
      set $upstream "mm-bot:8084";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      default_type text/plain;
      return 404 "not found\n";
    }
  }
}

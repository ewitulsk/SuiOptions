# nginx sidecar for the `prod` env. See nginx.staging.conf for the full
# explanation — this file only swaps the env name in the location blocks.

worker_processes 1;
events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  resolver 127.0.0.11 ipv6=off valid=10s;

  server {
    listen 80;
    server_name _;

    # Real upstream probe — the ALB target group hits this every 15s.
    # Quoting is the WS hub and historically the most fragile service;
    # if it's unresponsive, the env should be marked unhealthy so the
    # listener serves 503 instead of silently routing into a hung pool.
    # This upstream must NOT be a slow-starting `ops::spawn` service. Since
    # SO-324 those answer 503 until startup completes, and this probe is what
    # takes the environment out of service:
    #
    #   interval 15s, unhealthy threshold 3  -> ~30-45s of continuous 503
    #   deregisters the whole environment, staging and prod alike
    #
    # So the hazard is a startup longer than that window, not any 503 at all.
    # Measured 2026-07-30, spawn -> ready, all six ops::spawn services: mm-bot
    # 10.0s (the slowest by far), option-scheduler 0.66s, keeper 0.64s,
    # market-sim 0.16s, balance-monitor 0.14s, indexer ~0s. Every one is inside
    # a single failed probe today, so repointing this at any
    # current ops::spawn service would not deregister anything — but nothing
    # holds those startups where they are, and mm-bot has already grown to
    # two-thirds of one probe interval.
    #
    # quoting-service serves /health from its axum router, which binds only
    # after startup has succeeded, so it has no not-ready window at all.
    location = /prod/health {
      set $upstream "quoting:9002";
      proxy_pass http://$upstream/health;
      proxy_connect_timeout 2s;
      proxy_read_timeout    3s;
      proxy_send_timeout    3s;
      proxy_set_header Host $host;
    }

    location ~ ^/prod/quoting(?:/(?<tail>.*))?$ {
      set $upstream "quoting:9002";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location ~ ^/prod/api(?:/(?<tail>.*))?$ {
      set $upstream "api-service:9003";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/prod/indexer/graphql(?:/(?<tail>.*))?$ {
      set $upstream "indexer:9002";
      proxy_pass http://$upstream/graphql$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/prod/indexer(?:/(?<tail>.*))?$ {
      set $upstream "indexer:8081";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # token-info read API. Only the public read port (9005) is proxied;
    # the internal mutate port (9006) is deliberately never routed here.
    location ~ ^/prod/token-info(?:/(?<tail>.*))?$ {
      set $upstream "token-info:9005";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # auth-service public API (challenge / login / refresh). The internal
    # verify port (9008) is deliberately never routed here.
    location ~ ^/prod/auth(?:/(?<tail>.*))?$ {
      set $upstream "auth-service:9007";
      proxy_pass http://$upstream/$tail;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gas-station public API (balance / sponsor).
    # price-charting (SO-156): REST bars + live-bar WebSocket.
    location ~ ^/prod/charts(?:/(?<tail>.*))?$ {
      set $upstream "price-charting:9011";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # cctp-relay has no /prod route: the service is not declared in
    # docker-compose.prod.yml, so the upstream would never resolve.

    location ~ ^/prod/gas-station(?:/(?<tail>.*))?$ {
      set $upstream "gas-station:9009";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hedge-signer: external-account co-signing (pubkey / policy / sign).
    location ~ ^/prod/hedge-signer(?:/(?<tail>.*))?$ {
      set $upstream "hedge-signer:9017";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/prod/scheduler(?:/(?<tail>.*))?$ {
      set $upstream "option-scheduler:8083";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/prod/mm-bot(?:/(?<tail>.*))?$ {
      set $upstream "mm-bot:8084";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # vault-keeper health/metrics surface (8086 — see observability::ops).
    location ~ ^/prod/keeper(?:/(?<tail>.*))?$ {
      set $upstream "keeper:8086";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Switchboard Crossbar HTTP API (feed simulation + update bundles for
    # the frontend Switchboard SDK). Only the HTTP port is proxied; the
    # separate WS port (8081) is deliberately not routed until needed.
    location ~ ^/prod/crossbar(?:/(?<tail>.*))?$ {
      set $upstream "crossbar:8080";
      proxy_pass http://$upstream/$tail$is_args$args;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # oracle-service — descriptor + price data plane (SO-335, SO-355).
    #
    # The browser has to learn which oracle provider is live to build the
    # right price legs, and that answer lives in one backend config field.
    # Without this route the frontend silently falls back to its compiled
    # Pyth ids and would NOT follow a provider switch.
    #
    # Deliberately scoped to exact paths: oracle-service is otherwise an
    # internal service (`/vol/realized`, `/oracle/legs` etc. stay
    # unexposed). Widen only if the browser genuinely needs more.
    location = /prod/oracle/descriptor {
      set $upstream "oracle-service:9013";
      proxy_pass http://$upstream/oracle/descriptor;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live price fanout (SO-355): the frontend's ONLY spot-price source
    # since hermes-beta went dark 2026-08-04. Broadcast-only, read-only.
    location = /prod/oracle/ws {
      set $upstream "oracle-service:9013";
      proxy_pass http://$upstream/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    # One-shot snapshot so the UI paints prices on load instead of
    # waiting for the first WS frame.
    location = /prod/oracle/prices {
      set $upstream "oracle-service:9013";
      proxy_pass http://$upstream/prices;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      default_type text/plain;
      return 404 "not found\n";
    }
  }
}

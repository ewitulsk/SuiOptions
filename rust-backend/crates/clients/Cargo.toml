[package]
name = "clients"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "exchange"
path = "src/bin/exchange.rs"

[[bin]]
name = "writer"
path = "src/bin/writer.rs"

[[bin]]
name = "mm-bot"
path = "src/bin/mm_bot.rs"

[dependencies]
# Workspace internals.
protocol-types = { workspace = true }
deployments = { workspace = true }
secrets = { workspace = true }

# Sui — same versions the deployment-manager pins, so we share resolution.
sui-sdk = { workspace = true }
sui-types = { workspace = true }
sui-keys = { workspace = true }
sui-json = { workspace = true }
sui-json-rpc-types = { workspace = true }
sui-transaction-builder = { workspace = true }
shared-crypto = { workspace = true }
move-core-types = { workspace = true }

# Async / WS.
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

# Serialization.
serde = { workspace = true }
serde_json = { workspace = true }
bcs = { workspace = true }

# Crypto & encoding. k256 / p256 cover the Secp256k1 / Secp256r1 quote
# signing schemes; ed25519-dalek covers the default Ed25519 path.
ed25519-dalek = { workspace = true }
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
base64 = "0.22"

# Plumbing.
clap = { workspace = true }
config = { version = "0.14", features = ["toml"] }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# Doc 07 §5 reproduction: 30d ATM calls, 30% NAV premium budget (M ≈ 3×
# NAV notional), Aug 2025 – Jul 2026, SUI spot as the path and the perp
# mark (proxy_venue). Sweep --bands to reproduce the turnover table.
name = "sui-doc07-calls"
asset = "SUI"
spot_exchange = "binance"
spot_symbol = "SUI-USDT"
funding_exchange = "binance"
funding_symbol = "SUI-USDT-PERP"
from = "2025-08-01"
to = "2026-07-31"
nav0 = 1_000_000.0

# Doc 07 ran one position per turn, so the whole 30% budget sits in one
# expiry: lift the doc 08 per-expiry/per-type caps to the total budget.
[limits]
per_expiry_max = 0.30
call_premium_max = 0.30

# Doc 07 priced fair − 5 vol points with no size penalty on a single
# 30%-NAV position.
[bid]
size_penalty_volpts_per_pct_nav = 0.0

[flow]
mode = "per_turn"
notional_nav_multiple = 3.0
call_share = 1.0
tenor_days = 30.0

[estimator]
sample_interval_s = 900

[hedge]
band_pct_nav = 20.0
band_wide_pct_nav = 30.0

# Doc 08 §6.3/§6.4 (PR K): per-stage latencies (all assumed until the
# data room captures inclusion/detection timestamps) and the gap policy.
# Omitted stages take the code defaults; `[latency]` is labeled in every
# summary as `latency_assumptions`.
[latency]
strategy = { mean_ms = 200, jitter_ms = 100, assumed = true }
venue_submit = { mean_ms = 150, jitter_ms = 100, assumed = true }
venue_fill_report = { mean_ms = 200, jitter_ms = 100, assumed = true }
sui_inclusion = { mean_ms = 1500, jitter_ms = 1000, assumed = true }
indexer_detection = { mean_ms = 2000, jitter_ms = 1000, assumed = true }
seed = 1

[gaps]
required_feeds = ["spot"]
max_gap_ms = 300_000
policy = "invalidate"

# Doc 08 §7.2/§7.3 (PR L): execution assumption and Bluefin SUI-PERP
# margin rules (contract specs verified 2026-09-02, see margin.rs).
# `taker_only` is the calibrated-free default; passive assumptions are
# sensitivity only in the proxy-BBO era.
[venue]
execution_assumption = "taker_only"
maker_fee_bps = 1.0
contract_size = 1.0
min_order_units = 1.0
order_timeout_secs = 60

[margin]
imr = 0.045
mmr = 0.025
leverage = 10.0
topup_trigger_mr = 0.035
topup_transfer_ms = 30_000
max_topup_24h_pct_nav = 0.10

# Doc 08 §7.5/§7.6 (PR M): the live exit policy on the exits cadence
# (daily check + 5-minute near-expiry sweep), routed through a modeled
# DeepBook ladder; pool balances (flash capacity) are an ASSUMPTION
# until a pool-balance poller exists (doc 08 §4.6).
[exercise]
check_interval_secs = 86_400
sweep_interval_secs = 300
near_expiry_hours = 24.0
min_profit_usd = 10.0
min_profit_bps = 5.0
route_uncertainty_bps = 20.0
route_uncertainty_mult = 2.0
max_slice_units = 100_000.0
route_depth_units_per_bps = 2_000.0
pool_base_balance_units = 5_000_000.0
pool_quote_balance = 10_000_000.0
ptb_failure_prob = 0.0

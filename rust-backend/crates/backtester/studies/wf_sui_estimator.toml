# Walk-forward estimator study on SUI (doc 08 §9.2, PR O): `windows` (the
# live two-window blend) against the HAR forecaster at several q_bid, on
# the doc 07 call desk. Selection on training folds only; the holdout is
# 2025-11 → 2026-07 and stays sealed unless `--open-holdout` is passed.
name = "sui-estimator"
scenario = "../scenarios/sui_doc07_calls.toml"
calibration_from = "2023-05-03"
train = [["2024-05-01", "2024-10-31"], ["2024-11-01", "2025-04-30"]]
validation = [["2025-05-01", "2025-10-31"]]
holdout = ["2025-11-01", "2026-07-31"]
objective = "depositor_net_return_annualized"
gate_max_drawdown = 0.15

# Doc 07 / doc 10 framing: no margin model (the margin question is
# answered by the stress suite and the grid, where leverage is an axis),
# and 2x NAV of notional per turn so the high-vol turns fit inside the
# 30% premium cap instead of being declined outright.
[overrides]
"margin.enabled" = false
"flow.notional_nav_multiple" = 2.0

[[candidates]]
name = "windows"
[candidates.overrides]
"estimator.kind" = "windows"

[[candidates]]
name = "har-q0.25"
[candidates.overrides]
"estimator.kind" = "har"
"estimator.q_bid" = 0.25
"estimator.risk_premium" = 0.0
"estimator.max_lean" = 0.0

[[candidates]]
name = "har-q0.35"
[candidates.overrides]
"estimator.kind" = "har"
"estimator.q_bid" = 0.35
"estimator.risk_premium" = 0.0
"estimator.max_lean" = 0.0

[[candidates]]
name = "har-q0.45"

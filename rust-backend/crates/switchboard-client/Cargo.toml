[package]
name = "switchboard-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protocol-types = { workspace = true }
sui-types = { workspace = true }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
# Client-side recovery-id resolution: crossbar's reported recoveryId is
# unreliable (observed live: v=1 bundles never verified on chain), so the
# right v is recovered against the response's ethAddress before submit.
k256 = { version = "0.13", features = ["ecdsa"] }
# sha2: the consensus message is SHA256-signed (sui ecdsa_k1 hash id 1);
# sha3: ethAddress is keccak160 of the recovered pubkey.
sha2 = "0.10"
sha3 = "0.10"

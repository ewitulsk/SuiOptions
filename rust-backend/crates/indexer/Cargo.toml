[package]
name = "indexer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "indexer"
path = "src/main.rs"

[dependencies]
protocol-types = { workspace = true }

# Sui checkpoint ingestion framework. Same git deps Pismo uses in production —
# pulls in sui-types + a chunk of the Sui workspace, so first build is slow.
sui-data-ingestion-core = { git = "https://github.com/mystenlabs/sui", package = "sui-data-ingestion-core" }
sui-types = { git = "https://github.com/mystenlabs/sui", package = "sui-types" }

tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
bcs = { workspace = true }

chrono = { version = "0.4", features = ["serde"] }
config = { version = "0.14", features = ["toml"] }

thiserror = { workspace = true }
anyhow = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

dashmap = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

# price-charting — prod (testnet). The DB URL is the Tiger Data
# TimescaleDB secret, injected as CHART_DATABASE_URL by the deploy
# pipeline (Secrets Manager: options/prod/price-charting).

environment   = "prod"
network       = "testnet"
bind_addr     = "0.0.0.0:9011"

database_url  = "${CHART_DATABASE_URL}"
db_pool_size  = 4

api_service_url = "http://api-service:9003"
token_info_url  = "http://token-info:9005"
indexer_graphql_url = "http://indexer:9002/graphql"
oracle_url      = "http://oracle-service:9013"

discovery_interval_secs = 15
poll_interval_ms        = 2000
mid_sample_interval_secs = 10
ttl_hours               = 168

allowed_origins = ["*"]

# Vault-APY sampler (folded in from derived-metric-worker). Recomputes
# predicted APY (Pyth spot + vol + Black–Scholes) and mirrors the indexer's
# realized series into Timescale every tick.
apy_tick_secs = 120

# Spot + realized vol now come from oracle-service (oracle_url above); these
# only tune the consumer-side guards + vol window.
[pyth]
vol_window_days = 30
max_publish_lag_ms = 30_000
max_conf_bps       = 100

# Fees, strike band, and round cadence are NOT here — they're the vault's
# on-chain VaultConfig, read per-vault from the served config.
[model]
forecast_horizon = 4
delta_target     = 0.10

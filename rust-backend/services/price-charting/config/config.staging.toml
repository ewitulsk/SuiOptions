# price-charting — staging (testnet). The DB URL is the Tiger Data
# TimescaleDB secret, injected as CHART_DATABASE_URL by the deploy
# pipeline (Secrets Manager: options/staging/price-charting).

environment   = "staging"
network       = "testnet"
bind_addr     = "0.0.0.0:9011"

database_url  = "${CHART_DATABASE_URL}"
db_pool_size  = 4

api_service_url = "http://api-service:9003"
token_info_url  = "http://token-info:9005"
indexer_graphql_url = "http://indexer:9002/graphql"

discovery_interval_secs = 15
poll_interval_ms        = 2000
mid_sample_interval_secs = 10
ttl_hours               = 168

allowed_origins = ["*"]

# Vault-APY sampler (folded in from derived-metric-worker). Recomputes
# predicted APY (Pyth spot + vol + Black–Scholes) and mirrors the indexer's
# realized series into Timescale every tick.
apy_tick_secs = 120

# BETA hermes — testnet feed ids are the beta set; stable hermes 404s.
# Benchmarks is stable-only, so beta-id vol lookups fall back to the model.
[pyth]
hermes_url      = "https://hermes-beta.pyth.network"
benchmarks_url  = "https://benchmarks.pyth.network"
vol_window_days = 30
max_publish_lag_ms = 30_000
max_conf_bps       = 100

# Fees, strike band, and round cadence are NOT here — they're the vault's
# on-chain VaultConfig, read per-vault from the served config.
[model]
forecast_horizon = 4
delta_target     = 0.10
# Predicted APY is net of expected assignment, simply annualized and capped.
# The edge comes from an assumed variance risk premium (implied vol richer
# than realized); the range brackets that assumption (Tier 2) or vol (Tier 1).
apy_cap          = 5.0   # ±500% ceiling
assumed_vrp      = 0.04  # implied = realized + 4 vol points
vrp_band         = 0.02  # Tier-2 range: +2…+6 vol points
vol_band         = 0.25  # Tier-1 range: realized vol ±25%

# staging-mm-bot — staging deployment. In-compose service URLs come from
# the environment (ORDERBOOK_URL / TOKEN_INFO_URL / ORACLE_URL); this file
# holds the trading knobs.

health_addr = "0.0.0.0:8085"

network = "testnet"

max_fee_bps = 50

[funding]
enabled = true
check_interval_secs = 60

# Vault-direct mode (below): these are VAULT free-balance floats, topped
# up by faucet mint + attested deposit (SO-375).
[funding.targets]
TUSDC = 1_000_000_000_000 # $1M at 6 decimals
TBTC = 1_000_000_000      # 10 TBTC at 8 decimals
TSUI = 100_000_000_000_000 # 100k TSUI at 9 decimals
TWAL = 100_000_000_000_000 # 100k TWAL at 9 decimals

[quoting]
ttl_secs = 90
refresh_secs = 5
requote_drift_bps = 5
escrow_utilization = 0.8
# Batched on-chain cancel_up_to sweep cadence. Replaced orders expire after
# ttl_secs anyway, so this is a slow belt, not the primary cancel.
watermark_interval_secs = 3_600

[[quoting.levels]]
bps = 10
lots = 1

[[quoting.levels]]
bps = 25
lots = 2

[[quoting.levels]]
bps = 50
lots = 4

[pyth]
max_price_age_ms = 5_000
max_publish_lag_ms = 10_000
max_conf_bps = 0

# ── Vault-direct escrow (SO-372) ────────────────────────────────────────
# Quote as a direct-escrow vault's delegated signer: orders name the
# vault's identity BM and settle from its free balances per fill.
# vault_id is deliberately UNSET: a contract redeploy invalidates any pin,
# and the bot now resolves its vault itself — adopt a vault this wallet
# created (wired for direct escrow > largest stake), or provision + wire a
# fresh one (custody, quote adapter, signer delegation, deposit-asset
# allowlist; the SO-375 funding pass then seeds it). Pin vault_id only to
# adopt a vault someone else provisioned. Remove this section to fall back
# to the funded-BM mode.
[vault_direct]
api_url = "http://api-service:9003"
buffer_bps = 1_000
# v2 (SO-418): escrowed curator-commitment funding, accounting-asset raw
# units. The funding pass deposits it via deposit_into_commitment when
# the slot is missing (this wallet holds the CuratorCap). 0 disables —
# but an unfunded commitment parks quoting risk-off once the protocol
# floor is nonzero.
commitment_deposit = 100_000_000_000 # $100k at TUSDC's 6 decimals

# SO-420: the bot's direct-escrow vault is TRANCHED (senior/junior,
# preferred-only senior upside). Takes effect on the next fresh provision
# — the bot keeps adopting its existing vault until a redeploy orphans
# it. The funding pass deposits all-junior; senior stays empty until
# someone deposits senior.
[vault_direct.provision]
enabled = true
structure_code             = 1     # senior/junior
senior_hurdle_bps_annual   = 1_000 # 10% annual senior hurdle
target_junior_bps          = 2_000 # 20% junior target
maintenance_junior_bps     = 1_000 # 10% maintenance floor
upside_code                = 0     # preferred-only senior
residual_participation_bps = 0
total_return_cap_bps       = 0
terms_version              = 1

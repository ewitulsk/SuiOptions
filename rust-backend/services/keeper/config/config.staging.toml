# vault-keeper config — staging env (Sui testnet).
#
# Ships with an EMPTY vault list: no covered-call vault object exists on
# chain yet, and the keeper idles healthily until one is configured here
# (mirrors the scheduler's empty prod [[pairs]] pattern). To enable a
# vault, uncomment the [[vaults]] template below, fill the object ids
# from the vault deployment, and roll the keeper.
#
# Chain-side token data (coin types, decimals, Pyth feed ids) resolves
# from token-info at boot; the Sui gas key comes from
# /run/secrets/keeper.toml (rendered by render-secrets.sh from
# `options/staging/keeper` in Secrets Manager).

# GraphQL endpoint of the indexer inside the compose stack — bucket
# candidates for strike selection + the current bucket's call type.
indexer_graphql_url = "http://indexer:9002/graphql"

tick_secs   = 15
health_addr = "0.0.0.0:8086"

[pyth]
hermes_url     = "https://hermes.pyth.network"
benchmarks_url = "https://benchmarks.pyth.network"
# Sui TESTNET Pyth + Wormhole deployment, per
# https://docs.pyth.network/price-feeds/contract-addresses/sui
# (verified against the live fullnode: both packages exist and both
# state objects are typed at these package addresses).
pyth_package_id     = "0xabf837e98c26087cba0883c0a7a28326b1fa3c5e1e2c5abdb486f9e8f594c837"
wormhole_package_id = "0xf47329f4344f3bf0f8e436e2f7b485466cff300f12a166563995d3888c296a94"
pyth_state_id       = "0x243759059f4c3111179da5878c12f68d612c21a8d54d85edc86164bb18be1c7c"
wormhole_state_id   = "0x31358d198147da50db32eda2562951d53973a0c0ad5ed738e9b17d88b213d790"
update_fee_mist     = 1

# ── vaults (none yet — template below) ─────────────────────────────────
# Launch parameters per the decision memo (guide doc 08): Δ target 0.20,
# 4 slices / 90 min stagger, iv_ratio 1.15.
#
# [[vaults]]
# vault_id   = "0x…"                    # shared Vault<U, S, VShare> object
# underlying = "SUI"                    # token-info tickers
# settlement = "TUSDC"
# share_type = "0x…::vshare_sui::VSHARE_SUI"
# underlying_price_info = "0x…"         # shared PriceInfoObject ids for the
# settlement_price_info = "0x…"         # vault's two pinned feeds
# # Owned Coin<DEEP> + amount split per swap_proceeds; omit both for a
# # zero coin (whitelisted pools).
# # deep_funding_coin = "0x…"
# # deep_fee_per_swap = 1000000
# iv_ratio = 1.15
# target_delta = 0.20
# sigma_fallback = 0.85
# vol_window_days = 30
# [vaults.slicing]
# slices = 4
# stagger_minutes = 90

# vault-keeper config — prod env (Sui testnet, a distinct deployment
# from staging; flip the [pyth] block to the mainnet ids + stable hermes
# together with render-secrets.sh and the Dockerfile.keeper APP_ENV
# mapping if prod ever moves to mainnet).
#
# Vaults are NOT configured here: the keeper discovers them from the
# indexer's `trading_vaults` view and resolves Pyth PriceInfoObject ids
# from chain state (src/discovery.rs). As soon as a prod vault is
# created on chain, the next tick picks it up — no config edit, no
# redeploy. With no vaults on chain, the keeper idles with /health up.

indexer_graphql_url = "http://indexer:9002/graphql"

tick_secs   = 15
health_addr = "0.0.0.0:8086"

[pyth]
# Sui TESTNET PriceInfoObjects are keyed by the BETA feed set; update
# data must come from hermes-beta (see config.staging.toml for the
# verification notes).
hermes_url     = "https://hermes-beta.pyth.network"
# Sui TESTNET Pyth + Wormhole deployment (prod runs testnet today), per
# https://docs.pyth.network/price-feeds/contract-addresses/sui
# (verified against the live fullnode). Replace with the mainnet ids
# from the same page when prod moves to mainnet.
pyth_package_id     = "0xabf837e98c26087cba0883c0a7a28326b1fa3c5e1e2c5abdb486f9e8f594c837"
wormhole_package_id = "0xf47329f4344f3bf0f8e436e2f7b485466cff300f12a166563995d3888c296a94"
pyth_state_id       = "0x243759059f4c3111179da5878c12f68d612c21a8d54d85edc86164bb18be1c7c"
# The state's price_info table (publicnode can't serve the dynamic-field lookup):
price_info_table_id = "0xcb858b77d8068c6c8c0d8a4ddfba95053268e4a31f8ecc49adccc4ec1570d3a7"
wormhole_state_id   = "0x31358d198147da50db32eda2562951d53973a0c0ad5ed738e9b17d88b213d790"
update_fee_mist     = 1

[vault_defaults]
vol_window_days = 30   # realized-vol window for the VolBook premium-mark crank

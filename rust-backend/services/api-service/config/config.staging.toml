# api-service config — staging env (testnet).
#
# Bind on all interfaces so the docker port mapping works. The compose
# file publishes 9023:9003 on the host.

bind_addr        = "0.0.0.0:9003"

# Sui network slot in deployments.json. staging -> testnet (matches
# indexer/mm-bot configs and deployment.md; testnet is where the
# deployed package lives).

# Talk to the indexer over the env's compose-internal network.

# Indexer GraphQL query API (SO-97) for Dashboard position enrichment.
indexer_graphql_url = "http://indexer:9002/graphql"

# Frontend staging origins. Tighten once a real staging frontend URL exists.
allowed_origins  = ["*"]

# token-info public API over the compose-internal network.
token_info_url   = "http://token-info:9005"

# Predicted-APY read API, composed into /vaults/:id/apy. Now served by
# price-charting (the derived-metric-worker was folded into it); the
# /vault-apy/:id shape is unchanged. Omit to serve realized-only.
derived_metrics_url = "http://price-charting:9011"

# Sui GraphQL RPC for the live-vault read in GET /vaults/:id (staging is
# testnet). A read failure degrades to omitting live round state, never a 5xx.
sui_graphql_url = "https://graphql.testnet.sui.io/graphql"

# Data-room gold lake for /analytics/* (SO-389). Read-only via the host
# IAM role; unset disables analytics endpoints (503).
data_room_url = "s3://options-data-room-20260813122351104900000001"

# oracle-service — spot + realized vol for the `/buckets` strike ladder
# (SO-400). Unset would degrade `/buckets` to existing buckets only.
oracle_url = "http://oracle-service:9013"

# Series families the board lists. `tick_pct` sizes the strike lattice: the
# tick is the largest {1,2,2.5,5}x10^n at or below `tick_pct * spot`, so
# strikes land on absolute board levels rather than stepping a percentage
# off spot.
[[ladder_pairs]]
underlying = "TBTC"
settlement = "TUSDC"
tick_pct   = 0.025

[[ladder_pairs]]
underlying = "TWAL"
settlement = "TUSDC"
tick_pct   = 0.05

[[ladder_pairs]]
underlying = "TSUI"
settlement = "TUSDC"
tick_pct   = 0.05

[[ladder_pairs]]
underlying  = "TBTC"
settlement  = "TUSDC"
option_type = "put"
tick_pct    = 0.025

[[ladder_pairs]]
underlying  = "TSUI"
settlement  = "TUSDC"
option_type = "put"
tick_pct    = 0.05

[package]
name = "api-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "api-service"
path = "src/main.rs"

[dependencies]
protocol-types = { workspace = true }
runtime-config = { workspace = true }
observability  = { workspace = true, features = ["axum"] }
cli-spec       = { workspace = true }
indexer-graphql = { workspace = true }
token-info-client = { workspace = true }
pricing        = { workspace = true }

config = { version = "0.14", features = ["toml"] }
clap = { workspace = true }
chrono = { workspace = true }

tokio = { workspace = true }

axum = { workspace = true }
tower-http = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

# social-bot secrets — copy to `secrets.toml` and fill in. `secrets*.toml` is
# gitignored. In deployed envs this file is rendered by render-secrets.sh from
# AWS Secrets Manager (options/<env>/social-bot).

# Slack app signing secret (api.slack.com → your app → Basic Information →
# App Credentials → Signing Secret). Verifies slash-command requests.
slack_signing_secret = "..."

# Discord application public key, hex (discord.com/developers → your app →
# General Information → Public Key). Verifies interaction signatures.
discord_public_key = "..."

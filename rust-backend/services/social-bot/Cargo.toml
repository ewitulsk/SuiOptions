[package]
name = "social-bot"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "social-bot"
path = "src/main.rs"

[dependencies]
runtime-config = { workspace = true }
observability  = { workspace = true, features = ["axum"] }
cli-spec       = { workspace = true }

clap = { workspace = true }

tokio = { workspace = true }

axum = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

reqwest = { workspace = true }

# Slack request signing (HMAC-SHA256) + Discord interaction verification
# (Ed25519), both over the raw request body.
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ed25519-dalek = { workspace = true }
url = { workspace = true }

anyhow = { workspace = true }

tracing = { workspace = true }

[dev-dependencies]
rand = { workspace = true }

# hedge-signer secrets — copy to `secrets.toml` and fill in the signing key.
# `secrets*.toml` is gitignored. In deployed envs this file is rendered by
# render-secrets.sh from AWS Secrets Manager (options/<env>/hedge-signer).
#
# The service's multisig member key (the protocol half of each vault's
# 2-of-2 external account), in Sui's `suiprivkey1…` bech32 format. The slot
# must match `network` in config: dev → testnet (local default),
# staging/prod → testnet. GET /pubkey serves the corresponding public key
# for the multisig-address ceremony.

[sui]
testnet = "suiprivkey1..."
# devnet  = "suiprivkey1..."
# mainnet = "suiprivkey1..."

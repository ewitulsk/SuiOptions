# hedge-signer config (local dev).
#
# Policy-gated co-signer for trading-vault external accounts (docs/mm-bot-v2
# 03/04 §3b). The service signing key — the protocol member of each 2-of-2
# multisig — is read from the secrets TOML (`--secrets`, default
# services/hedge-signer/config/secrets.toml) under the `[sui]` slot for
# `network` below; copy secrets.example.toml to secrets.toml and fill it in.

environment = "dev"

bind_addr   = "127.0.0.1:9017"
network     = "testnet"

allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

# token-info supplies the trading_vault package id the strict-tier
# `return_external` target is pinned against.
token_info_url = "http://127.0.0.1:9005"

# Append-only JSONL decision log; one line per /sign request.
audit_log_path = "services/hedge-signer/data/audit.jsonl"

# Per-vault FROST key shares (the service half of each vault's 2-of-2
# threshold-ed25519 Bluefin parent key), written by the /frost/keygen
# ceremony. Sibling of secrets.toml (gitignored), NOT inside it: deployed
# secrets.toml is re-rendered from AWS Secrets Manager on every deploy,
# which would discard runtime-generated shares.
frost_shares_path = "services/hedge-signer/config/frost-shares.toml"

# One [[vaults]] block per trading vault whose external account this service
# co-signs for. Empty by default — the service boots and refuses every /sign.
# Gates SIGNING only: /frost/keygen is permissionless (any live vault with no
# on-chain external account may run a DKG).
#
# [[vaults]]
# # TradingVault shared-object id (also the sweep destination address).
# vault_id         = "0x..."
# # The 2-of-2 multisig address (curator key + this service's /pubkey key).
# external_account = "0x..."
# # = vault_id as an address; every strict-tier transfer must pay it.
# vault_address    = "0x..."
# # Curator's flag-prefixed member pubkey, base64. Informational only.
# curator_pubkey_b64 = ""
# # Per-tx cap on the pure u64 amount of borrow_base / borrow_quote.
# max_borrow_amount = 1000000000
# # Shared-object allowlist for the perimeter: the DeepBook pools the account
# # may trade PLUS the margin registry / margin pools / the account's own
# # MarginManager. Clock (0x6) and the vault object are implicit.
# allowed_pools = ["0x...", "0x..."]
# # Canonical deepbook_margin package id (third-party — not in
# # deployments.json, so pinned here).
# deepbook_margin_package = "0x..."
# # Curator's day-to-day trading wallet: the ONLY wallet a Bluefin
# # authorize_account payload may authorize on the FROST parent account.
# curator_wallet = "0x..."
# # Optional Bluefin object-id pins for the FROST payload policy. package_id
# # + eds_id are REQUIRED before a parent-address deposit_to_asset_bank tx
# # can be co-signed (fail closed without them).
# [vaults.bluefin]
# ids_id     = "0x..."   # internal data store (authorize / order payloads)
# eds_id     = "0x..."   # external data store (withdraw payloads + deposits)
# package_id = "0x..."   # Bluefin Pro CURRENT package (deposit call target)

# Bluefin REST relay for the curator dashboard (SO-305). Bluefin serves CORS
# only to its own origins, so the browser reaches its API through this
# narrow allowlisted pass-through (see src/bluefin_proxy.rs). Local dev targets Bluefin's Sui-testnet env (sui-staging).
[bluefin_proxy]
auth_base_url  = "https://auth.api.sui-staging.bluefin.io"
api_base_url   = "https://api.sui-staging.bluefin.io"
trade_base_url = "https://trade.api.sui-staging.bluefin.io"

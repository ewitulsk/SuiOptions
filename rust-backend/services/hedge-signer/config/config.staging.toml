# hedge-signer config — staging env (testnet).

environment = "staging"

bind_addr   = "0.0.0.0:9017"
network     = "testnet"

allowed_origins = ["*"]

# token-info supplies the trading_vault package id the strict-tier
# `return_external` target is pinned against.
token_info_url = "http://token-info:9005"

# Persisted on the hedge_signer_data docker volume (see compose).
audit_log_path = "/app/data/audit.jsonl"

# Per-vault FROST key shares (the service half of each vault's 2-of-2
# threshold-ed25519 Bluefin parent key), written by the /frost/keygen
# ceremony. On the persistent data volume — NOT in secrets.toml, which is
# re-rendered from AWS Secrets Manager on every deploy.
frost_shares_path = "/app/data/frost-shares.toml"

# One [[vaults]] block per trading vault whose external account this service
# co-signs for. This gates SIGNING only — /frost/keygen is permissionless
# (any live vault with no on-chain external account may run a DKG), so a
# vault does NOT need a block here to get a parent address.
#
# [[vaults]]
# vault_id         = "0x..."   # TradingVault shared-object id
# external_account = "0x..."   # the 2-of-2 multisig address
# vault_address    = "0x..."   # = vault_id as an address
# curator_pubkey_b64 = ""      # informational
# max_borrow_amount = 1000000000
# allowed_pools = ["0x..."]    # pools + registry + margin pools + MarginManager
# deepbook_margin_package = "0x..."
# # Curator's day-to-day trading wallet: the ONLY wallet a Bluefin
# # authorize_account payload may authorize on the FROST parent account.
# curator_wallet = "0x..."
# # Optional Bluefin object-id pins for the FROST payload policy. package_id
# # + eds_id are REQUIRED before a parent-address deposit_to_asset_bank tx
# # can be co-signed (fail closed without them).
# [vaults.bluefin]
# ids_id     = "0x..."   # internal data store (authorize / order payloads)
# eds_id     = "0x..."   # external data store (withdraw payloads + deposits)
# package_id = "0x..."   # Bluefin Pro CURRENT package (deposit call target)

# The desk's trading vault (SO-299 DBM bring-up). allowed_pools: canonical
# testnet DeepBook registry + SUI/DBUSDC pool + both margin pools + the
# margin registry; the MarginManager id is appended after the creation
# ceremony (second config pass).
[[vaults]]
vault_id                = "0x138e122a28da92d03509403a314338ce491f4ad0b9d62e5cbc4a7cc112e3fceb"
external_account        = "0xec548755761294d67138a047e6b82d1c19181ee2e6a8bb42be46b57635abc329"
vault_address           = "0x138e122a28da92d03509403a314338ce491f4ad0b9d62e5cbc4a7cc112e3fceb"
curator_pubkey_b64      = "APA0XRE2zMOQIqzLHCnp0/cILfKUqRGZlwBWGMsXYWTe"
curator_wallet          = "0xab8d1b5a5311c9400e3eaf5c3b641f10fb48b43cc30d365fa8a98a6ca6bd4865"
max_borrow_amount       = 500000000000  # 500 SUI per tx
deepbook_margin_package = "0xd6a42f4df4db73d68cbeb52be66698d2fe6a9464f45ad113ca52b0c6ebd918b6"
allowed_pools = [
  "0x48d7640dfae2c6e9ceeada197a7a1643984b5a24c55a0c6c023dac77e0339f75",  # MarginRegistry
  "0x7c256edbda983a2cd6f946655f4bf3f00a41043993781f8674a7046e8c0e11d1",  # DeepBook Registry
  "0x1c19362ca52b8ffd7a33cee805a67d40f31e6ba303753fd3a4cfdfacea7163a5",  # SUI/DBUSDC pool
  "0xcdbbe6a72e639b647296788e2e4b1cac5cea4246028ba388ba1332ff9a382eea",  # SUI margin pool
  "0xf08568da93834e1ee04f09902ac7b1e78d3fdf113ab4d2106c7265e95318b14d",  # DBUSDC margin pool
  "0xa5d76785501f9779317599434e94109fba152e0fae357d896c411bb34dffe364",  # the vault's MarginManager
  "0x1ebb295c789cc42b3b2a1606482cd1c7124076a0f5676718501fda8c7fd075a0",  # SUI/USD PriceInfoObject
  "0x9c4dd4008297ffa5e480684b8100ec21cc934405ed9a25d4e4d7b6259aad9c81",  # USDC/USD PriceInfoObject
]

# Bluefin REST relay for the curator dashboard (SO-305). Bluefin serves CORS
# only to its own origins, so the browser reaches its API through this
# narrow allowlisted pass-through (see src/bluefin_proxy.rs). Staging targets Bluefin's Sui-testnet env (sui-staging).
[bluefin_proxy]
auth_base_url  = "https://auth.api.sui-staging.bluefin.io"
api_base_url   = "https://api.sui-staging.bluefin.io"
trade_base_url = "https://trade.api.sui-staging.bluefin.io"

# Curator vaults (Bluefin wizard flow) need a [[vaults]] block only for the
# SIGNING policy — keygen and external-account registration are self-serve
# since SO-306/SO-308. Add a block (curator_wallet, borrow cap 0, no pools,
# [vaults.bluefin] pins) when a curator vault reaches the co-signed
# deposit/authorize steps. The pre-redeploy vault 0xa4739be9… block was
# removed 2026-07-25: that vault died with the old package.

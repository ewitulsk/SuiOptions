  "0x48d7640dfae2c6e9ceeada197a7a1643984b5a24c55a0c6c023dac77e0339f75",  # MarginRegistry
  "0x7c256edbda983a2cd6f946655f4bf3f00a41043993781f8674a7046e8c0e11d1",  # DeepBook Registry
  "0x1c19362ca52b8ffd7a33cee805a67d40f31e6ba303753fd3a4cfdfacea7163a5",  # SUI/DBUSDC pool
  "0xcdbbe6a72e639b647296788e2e4b1cac5cea4246028ba388ba1332ff9a382eea",  # SUI margin pool
  "0xf08568da93834e1ee04f09902ac7b1e78d3fdf113ab4d2106c7265e95318b14d",  # DBUSDC margin pool
  "0xa5d76785501f9779317599434e94109fba152e0fae357d896c411bb34dffe364",  # the vault's MarginManager
  "0x1ebb295c789cc42b3b2a1606482cd1c7124076a0f5676718501fda8c7fd075a0",  # SUI/USD PriceInfoObject

[package]
name = "hedge-signer"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hedge-signer"
path = "src/main.rs"

[dependencies]
runtime-config    = { workspace = true }
observability     = { workspace = true, features = ["axum"] }
cli-spec          = { workspace = true }
sui-tx            = { workspace = true }
token-info-client = { workspace = true }

clap = { workspace = true }

tokio = { workspace = true }

axum = { workspace = true }
tower-http = { workspace = true }
# Bluefin REST relay for the curator dashboard (bluefin_proxy.rs).
reqwest = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
bcs = { workspace = true }
toml = { workspace = true }

sui-types = { workspace = true }
shared-crypto = { workspace = true }

# FROST 2-of-2 threshold-ed25519 substrate (Bluefin parent account).
frost-ed25519 = { workspace = true }
rand = { workspace = true }
blake2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }

anyhow = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }

[dev-dependencies]
# e2e test verifies the aggregated FROST signature as plain ed25519.
ed25519-dalek = { workspace = true }

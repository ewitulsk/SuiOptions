# solana-option-scheduler secrets — copy this to `secrets.toml` and fill in
# real keys. `secrets.toml` is in `.gitignore`; this example file is
# committed.
#
# Override the path with `--secrets <path>` (default:
# `services/solana-option-scheduler/config/secrets.toml`). There is no
# environment-variable fallback — if the relevant key is missing the binary
# refuses to start.
#
# The scheduler signs `create_bucket` / `create_vault` transactions with the
# **admin keypair** (options_core Config.admin / vault admin) — the only
# privileged service, as on Sui (deployer/AdminCap holder). The boot
# assertion rejects any other key.

[solana]
# Per-network keypairs: base58-encoded 64-byte (secret ‖ public) keypair, or
# the Solana-CLI JSON byte array ([12, 34, …]). The scheduler picks the slot
# matching `--network` (default: devnet) and falls back to `default`.
devnet  = "base58keypair..."
# testnet = "base58keypair..."
# mainnet = "base58keypair..."
# default = "base58keypair..."

# Optional operator RPC override (a keyed Helius URL). Public cluster
# default is used when unset. Rendered from options/<env>/solana-rpc in
# deployed envs.
# rpc_url = "https://devnet.helius-rpc.com/?api-key=..."

# Note: the scheduler doesn't read Pyth directly — it gets spot/vol from
# solana-oracle-service, which holds the Pyth API key.

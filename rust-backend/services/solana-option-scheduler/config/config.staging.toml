# solana-option-scheduler config — staging env (Solana devnet).
# Chain-side ids (program ids, admin pubkey, mints, pyth feed ids) come
# from solana-token-info.

# GraphQL endpoint of the solana-indexer inside the compose stack.
indexer_graphql_url = "http://solana-indexer:9002/graphql"

tick_secs         = 60
roll_threshold_ms = 604_800_000   # 1 week

# Scheduler rolls DB (mandatory). Single source of truth for which
# (pair, expiry) slots have been rolled; its partial UNIQUE index is the
# hard guard against duplicate bucket creation. ${DB_PASSWORD}/${DB_HOST}
# are injected by the compose env and expanded at load time.
scheduler_database_url = "postgresql://solana_scheduler_staging:${DB_PASSWORD}@${DB_HOST}:5432/solana_scheduler_staging"
reconciler_safety_margin = 100
reconciler_interval_secs = 30

# Spot + realized vol come from solana-oracle-service (ORACLE_URL, set in
# compose).

[[pairs]]
underlying          = "TBTC"
settlement          = "TUSDC"
product_type        = "call"
expiry_interval_ms  = 604_800_000
strikes_below       = 2
strikes_above       = 2
interval_pct        = 5.0

  [pairs.spot]
  source             = "pyth"
  max_publish_lag_ms = 30_000   # decline a roll on prices > 30s stale
  max_conf_bps       = 100      # decline a roll if conf/price > 1%

[[pairs]]
underlying          = "TSOL"
settlement          = "TUSDC"
product_type        = "call"
expiry_interval_ms  = 604_800_000
strikes_below       = 2
strikes_above       = 2
interval_pct        = 10.0

  # SOL/USD cross via Pyth. Both legs read their feed id from the
  # solana-token-info catalog (TSOL = SOL/USD, TUSDC = USDC/USD).
  [pairs.spot]
  source             = "pyth"
  max_publish_lag_ms = 30_000
  max_conf_bps       = 100

# ── Vault auto-provisioning ─────────────────────────────────────────────
# Presence of this table switches on the hourly vault-ensure pass: the
# scheduler creates exactly one covered-call vault per configured call pair
# with a Pyth feed on both legs (single-tx create; the share mint is a
# PDA). Per-asset oracle pins (feed ids, decimals) come from
# solana-token-info; the policy below applies to every vault. All fields
# are optional and fall back to the contract's reference config.
[vault_template]
mgmt_fee_bps_annual      = 200          # 2%/yr, charged only on profitable rounds
perf_fee_bps             = 1_000        # 10%
round_ms                 = 604_800_000  # weekly rounds
selling_window_ms        = 43_200_000   # 12h RFQ selling window
min_strike_bps_over_spot = 300          # bucket strike ≥ 1.03× spot
max_strike_bps_over_spot = 6_000        # bucket strike ≤ 1.60× spot
min_expiry_lead_ms       = 259_200_000  # bucket expiry ≥ now + 3d
max_expiry_lead_ms       = 777_600_000  # bucket expiry ≤ now + 9d
max_swap_slippage_bps    = 50           # proceeds-swap band vs Pyth
max_price_age_secs       = 60
max_conf_bps             = 100

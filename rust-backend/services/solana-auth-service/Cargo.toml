[package]
name = "solana-auth-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "solana-auth-service"
path = "src/main.rs"

[dependencies]
runtime-config = { workspace = true }
observability  = { workspace = true, features = ["axum"] }
cli-spec       = { workspace = true }

config = { version = "0.14", features = ["toml"] }
clap = { workspace = true }

tokio = { workspace = true }

axum = { workspace = true }
tower-http = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }

tracing = { workspace = true }
metrics = { workspace = true }

# Challenge nonce store.
dashmap = { workspace = true }
rand = { workspace = true }

# Solana wallet signature verification (detached ed25519 over raw message
# bytes; address == base58 pubkey), HS256 JWT signing.
ed25519-dalek = { workspace = true }
bs58 = "0.5"
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# oracle-service secrets — copy this to `secrets.toml` and fill in the key.
# `secrets.toml` is in `.gitignore`; this example file is committed.
#
# Override the path with `--secrets <path>` (default:
# `services/oracle-service/config/secrets.toml`; in the container it's
# rendered to /run/secrets/oracle-service.toml by render-secrets.sh).

[pyth]
# Pyth API key, sent as `Authorization: Bearer …` on the single Hermes SSE
# subscription + Benchmarks requests. Optional: omit to use the anonymous
# (rate-limited) tier. Required for Pyth Core access from 2026-07-31.
api_key = "..."

# oracle-service config — local dev defaults.

environment    = "dev"
bind_addr      = "0.0.0.0:9013"
token_info_url = "http://127.0.0.1:9005"
hermes_url     = "https://hermes.pyth.network"
benchmarks_url = "https://benchmarks.pyth.network"

# ── The oracle switch (SO-335) ──────────────────────────────────────────
# `provider` is the ONE field that moves the whole stack between oracle
# providers. oracle-service subscribes to that provider's feeds and
# publishes it on /oracle/descriptor, which is where both PTB composers
# (backend sui-tx, browser tx/appraisal.ts) learn which adapter to build
# legs for. No other service redeploys to switch.
#
# Both adapters are published and allowlisted on chain at deploy time, so
# flipping this and restarting oracle-service is the entire switch.
# RETIRING a provider is a separate, later step and the order is not
# reversible: allow -> verify -> disallow. Never disallow the last
# allowlisted adapter — that is a freeze on withdrawals, not a pause.
# See docs/oracle-abstraction-plan.md 4.
[oracle]
provider = "pyth"
# crossbar_url = "http://crossbar:8080"   # required when provider = "switchboard"

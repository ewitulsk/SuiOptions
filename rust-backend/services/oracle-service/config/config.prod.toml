# oracle-service config — prod env (prod is a distinct testnet).
#
# BETA hermes — prod feed ids are the beta set, served only by hermes-beta
# (stable hermes 404s). Benchmarks is stable-only; beta→stable mapping is
# applied service-side per request.

environment    = "prod"
bind_addr      = "0.0.0.0:9013"
token_info_url = "http://token-info:9005"
hermes_url     = "https://hermes-beta.pyth.network"
benchmarks_url = "https://benchmarks.pyth.network"

# ── The oracle switch (SO-335) ──────────────────────────────────────────
# `provider` is the ONE field that moves the whole stack between oracle
# providers. oracle-service subscribes to that provider's feeds and
# publishes it on /oracle/descriptor, which is where both PTB composers
# (backend sui-tx, browser tx/appraisal.ts) learn which adapter to build
# legs for. No other service redeploys to switch.
#
# Both adapters are published and allowlisted on chain at deploy time, so
# flipping this and restarting oracle-service is the entire switch.
# RETIRING a provider is a separate, later step and the order is not
# reversible: allow -> verify -> disallow. Never disallow the last
# allowlisted adapter — that is a freeze on withdrawals, not a pause.
# See docs/oracle-abstraction-plan.md 4.
[oracle]
provider = "pyth"
crossbar_url = "http://crossbar:8080"
# Switchboard oracle queue for this network (testnet), read from the
# Switchboard `State` object on chain. `run_N` validates every signing
# oracle against this Queue OBJECT, and the client refuses a bundle whose
# reported queue key differs — a cross-queue bundle otherwise aborts
# inside run_N with nothing useful in the error.
#
# NOTE: the PUBLIC crossbar.switchboard.xyz answers for a different queue
# (86807068…). Our own crossbar must be pointed at the RPC backing THIS
# queue, or every quote is rejected.
switchboard_queue_id  = "0xe645d8979dac2fb901fb7c7b0ef3c9fad5dfaaf7ae2b0ce38a0b5ec63b819a99"
switchboard_queue_key = "0xc9477bfb5ff1012859f336cf98725680e7705ba2abece17188cfb28ca66ca5b0"
# Switchboard's own `on_demand` package (exposes run_N). Testnet, taken
# from the published-at of the Move.toml branch we link -- the 8th
# publish; the id the docs quote (0x28005599...) is the stale 6th.
switchboard_package_id = "0x0ea79f9c3fa1e3f701885a00bf26f92a297223165f26529767d2f7d1e3c4ac1e"


[package]
name = "oracle-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "oracle-service"
path = "src/main.rs"

[dependencies]
observability     = { workspace = true, features = ["axum"] }
runtime-config    = { workspace = true }
cli-spec          = { workspace = true }
protocol-types  = { workspace = true }
pyth-client       = { workspace = true }
oracle-client     = { workspace = true }
switchboard-client = { workspace = true }
token-info-client = { workspace = true }
sui-types         = { workspace = true }

clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
metrics = { workspace = true }

# axum with the `ws` feature for the internal fanout endpoint (the workspace
# default omits `ws`; this mirrors price-charting's explicit dep).
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }

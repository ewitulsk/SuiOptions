# solana-keeper secrets — copy to secrets.toml (gitignored) locally; on
# deployed hosts render-secrets.sh writes this from
# options/<env>/solana-keeper + the shared options/<env>/solana-rpc secret.
#
# The keeper holds ONLY a funded gas wallet — every crank is validated
# on-chain, so this key carries no privileges beyond paying fees + rent.

[solana]
# 64-byte keypair, either base58 or a Solana-CLI JSON byte array.
devnet  = ""
# mainnet = ""
# Optional operator RPC override (keyed Helius URL); falls back to the
# public cluster endpoint when absent.
# rpc_url = "https://devnet.helius-rpc.com/?api-key=..."

[pyth]
# Optional Hermes API key (Bearer). Absent → anonymous rate-limited tier.
# api_key = ""

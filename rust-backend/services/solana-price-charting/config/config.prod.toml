# solana-price-charting — prod. The DB URL is the Tiger Data TimescaleDB
# secret (a separate `solana_tsdb` database on the shared instance),
# injected as SOLANA_CHART_DATABASE_URL by the deploy pipeline
# (Secrets Manager: options/prod/solana-price-charting).

environment   = "prod"
bind_addr     = "0.0.0.0:9011"

database_url  = "${SOLANA_CHART_DATABASE_URL}"
db_pool_size  = 4

token_info_url      = "http://solana-token-info:9005"
indexer_graphql_url = "http://solana-indexer:9002/graphql"
oracle_url          = "http://solana-oracle-service:9013"

# Kept for the future ingestion task's eviction pass; unused until then.
ttl_hours = 168

allowed_origins = ["*"]

# Vault-APY sampler (the live part of this service). Recomputes predicted
# APY (Pyth spot + vol + Black–Scholes over the venue's covered-call
# auctions) and mirrors the indexer's realized series into Timescale every
# tick.
apy_tick_secs = 120

# Spot + realized vol come from solana-oracle-service (oracle_url above);
# these only tune the consumer-side guards + vol window.
[pyth]
vol_window_days = 30
max_publish_lag_ms = 30_000
max_conf_bps       = 100

# Fees, strike band, and round cadence are NOT here — they're the vault's
# on-chain config, read per-vault from the served config.
[model]
forecast_horizon = 4
delta_target     = 0.10
# Predicted APY is net of expected assignment, simply annualized and capped.
apy_cap          = 5.0   # ±500% ceiling
assumed_vrp      = 0.04  # implied = realized + 4 vol points
vrp_band         = 0.02  # Tier-2 range: +2…+6 vol points
vol_band         = 0.25  # Tier-1 range: realized vol ±25%

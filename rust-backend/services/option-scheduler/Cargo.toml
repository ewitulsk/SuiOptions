[package]
name = "option-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "option-scheduler"
path = "src/main.rs"

[dependencies]
protocol-types = { workspace = true }
runtime-config = { workspace = true }
cli-spec       = { workspace = true }
sui-tx         = { workspace = true }
pyth-client    = { workspace = true }
deployments    = { workspace = true }

# Sui SDK (used to parse the rolled tx response and pull ObjectChanges).
sui-types = { workspace = true }
sui-json-rpc-types = { workspace = true }

# Async / WS
tokio = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

clap = { workspace = true }
config = { version = "0.14", features = ["toml"] }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

parking_lot = { workspace = true }
reqwest = { workspace = true }

# Postgres persistence for the local rolls table.
diesel = { workspace = true }
diesel_migrations = { workspace = true }
r2d2 = { workspace = true }

[dev-dependencies]
# Construct StructTag fixtures in roller tests. The production crate
# only ever pattern-matches against ObjectChange, so move-core-types
# stays out of the runtime dep tree.
move-core-types = { workspace = true }

# option-scheduler config — prod env (Sui mainnet).
# Chain-side ids (package, AdminCap, deployer address, token coin types,
# pyth feed ids) come from `deployments.json::mainnet`.
#
# Pairs / cadence intentionally left empty until prod mm-bot bootstrap
# (faucet-less mainnet flow) is resolved — the scheduler would create
# bucket families that no MM is around to quote on. Keep the deploy
# wiring in place but the [[pairs]] list empty so the binary boots and
# exits cleanly with "no pairs configured" at startup.

indexer_graphql_url       = "http://indexer:9002/graphql"
tick_secs         = 60
roll_threshold_ms = 604_800_000

# Scheduler rolls DB (mandatory). Single source of truth for which
# (pair, expiry) slots have been rolled; its partial UNIQUE index is the
# hard guard against duplicate bucket creation. The scheduler fails fast
# at boot if this is unreachable. (With no [[pairs]] the binary exits at
# the "no pairs configured" check before connecting, so the prod DB need
# not exist until pairs are enabled.) ${DB_PASSWORD}/${DB_HOST} are
# injected by the compose env and expanded at load time.
scheduler_database_url = "postgresql://scheduler_prod:${DB_PASSWORD}@${DB_HOST}:5432/scheduler_prod"

[pyth]
hermes_url = "https://hermes.pyth.network"

# No [[pairs]] entries — see header.

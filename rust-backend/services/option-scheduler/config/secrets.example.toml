# option-scheduler secrets — copy this to `secrets.toml` and fill in real
# keys. `secrets.toml` is in `.gitignore`; this example file is committed.
#
# Override the path with `--secrets <path>` (default:
# `services/option-scheduler/config/secrets.toml`). There is no
# environment-variable fallback — if the relevant Sui key is missing the
# binary refuses to start.
#
# The scheduler signs `new_call_option` transactions with the deployer
# key, since AdminCap is non-transferable.

[sui]
# Per-network Sui keys, encoded with Sui's `suiprivkey1…` bech32 format.
# The scheduler picks the slot matching `--network` (default: testnet)
# and falls back to `default` if that slot is unset.
testnet = "suiprivkey1..."
# mainnet = "suiprivkey1..."
# devnet  = "suiprivkey1..."
# default = "suiprivkey1..."

# option-scheduler config — staging env (Sui devnet).
# Chain-side ids (package, AdminCap, deployer address, test-token coin
# types, pyth feed ids) come from `deployments.json::devnet`.

# GraphQL endpoint of the indexer inside the compose stack.
indexer_graphql_url       = "http://indexer:9002/graphql"

tick_secs         = 60
roll_threshold_ms = 604_800_000   # 1 week

# Scheduler rolls DB (mandatory). Single source of truth for which
# (pair, expiry) slots have been rolled; its partial UNIQUE index is the
# hard guard against duplicate bucket creation. The scheduler fails fast
# at boot if this is unreachable. ${DB_PASSWORD}/${DB_HOST} are injected
# by the compose env and expanded at load time.
scheduler_database_url = "postgresql://scheduler_staging:${DB_PASSWORD}@${DB_HOST}:5432/scheduler_staging"
reconciler_safety_margin  = 100
reconciler_interval_secs  = 30

# Spot + realized vol come from oracle-service (ORACLE_URL, set in compose).

[[pairs]]
underlying          = "TBTC"
settlement          = "TUSDC"
product_type        = "call"
expiry_interval_ms  = 604_800_000
strikes_below       = 2
strikes_above       = 2
interval_pct        = 5.0

  [pairs.spot]
  source             = "pyth"
  max_publish_lag_ms = 30_000
  max_conf_bps       = 100

[[pairs]]
underlying          = "TWAL"
settlement          = "TUSDC"
product_type        = "call"
expiry_interval_ms  = 604_800_000
strikes_below       = 2
strikes_above       = 2
interval_pct        = 10.0

  # WAL/USD cross via Pyth Hermes. Both legs read their `pythFeedId` from
  # deployments.json::staging.token_info (TWAL = WAL/USD, TUSDC = USDC/USD).
  [pairs.spot]
  source             = "pyth"
  max_publish_lag_ms = 30_000   # decline a roll on prices > 30s stale
  max_conf_bps       = 100      # decline a roll if conf/price > 1%

[[pairs]]
underlying          = "TSUI"
settlement          = "TUSDC"
product_type        = "call"
expiry_interval_ms  = 604_800_000
strikes_below       = 2
strikes_above       = 2
interval_pct        = 10.0

  # SUI/USD cross via Pyth Hermes. Both legs read their `pythFeedId` from
  # deployments.json::staging.token_info (TSUI = SUI/USD, TUSDC = USDC/USD).
  [pairs.spot]
  source             = "pyth"
  max_publish_lag_ms = 30_000   # decline a roll on prices > 30s stale
  max_conf_bps       = 100      # decline a roll if conf/price > 1%

# ── Cash-secured put pairs ──────────────────────────────────────────────
# Mirror the TSUI/TBTC call pairs above; `product_type = "put"` selects the
# put coin codegen + `create_put_bucket` path. A put family shares the expiry
# slot with its call twin — the scheduler disambiguates by coin module
# (`put_<i>` vs `call_<i>`). Vault auto-provisioning is call-only, so these
# roll put buckets but create no vault.
[[pairs]]
underlying          = "TSUI"
settlement          = "TUSDC"
product_type        = "put"
expiry_interval_ms  = 604_800_000
strikes_below       = 2
strikes_above       = 2
interval_pct        = 10.0

  [pairs.spot]
  source             = "pyth"
  max_publish_lag_ms = 30_000
  max_conf_bps       = 100

[[pairs]]
underlying          = "TBTC"
settlement          = "TUSDC"
product_type        = "put"
expiry_interval_ms  = 604_800_000
strikes_below       = 2
strikes_above       = 2
interval_pct        = 5.0

  [pairs.spot]
  source             = "pyth"
  max_publish_lag_ms = 30_000
  max_conf_bps       = 100

# ── Vault auto-provisioning ─────────────────────────────────────────────
# Presence of this table switches on the hourly vault-ensure pass: the
# scheduler creates exactly one covered-call vault per configured pair with a
# Pyth feed on both legs (publishing a fresh 9-decimal share coin per vault).
# Per-asset oracle pins (feed ids, decimals) come from token-info; the policy
# below applies to every vault. All fields are optional and fall back to the
# contract's reference config, so omitted RFQ-mechanics knobs use sane
# defaults — an empty `[vault_template]` is enough to enable creation.
[vault_template]
mgmt_fee_bps_annual      = 200          # 2%/yr, charged only on profitable rounds
perf_fee_bps             = 1_000        # 10%
round_ms                 = 604_800_000  # weekly rounds
selling_window_ms        = 43_200_000   # 12h RFQ selling window
min_strike_bps_over_spot = 300          # bucket strike ≥ 1.03× spot
max_strike_bps_over_spot = 6_000        # bucket strike ≤ 1.60× spot
min_expiry_lead_ms       = 259_200_000  # bucket expiry ≥ now + 3d
max_expiry_lead_ms       = 777_600_000  # bucket expiry ≤ now + 9d
max_swap_slippage_bps    = 50           # proceeds-swap band vs Pyth
max_price_age_secs       = 60
max_conf_bps             = 100

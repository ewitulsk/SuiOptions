# option-scheduler config — staging env (Sui devnet).
# Chain-side ids (package, AdminCap, deployer address, test-token coin
# types, pyth feed ids) come from `deployments.json::devnet`.

# GraphQL endpoint of the indexer inside the compose stack.
indexer_graphql_url       = "http://indexer:9002/graphql"

tick_secs         = 60
roll_threshold_ms = 604_800_000   # 1 week

# Scheduler rolls DB (mandatory). Single source of truth for which
# (pair, expiry) slots have been rolled; its partial UNIQUE index is the
# hard guard against duplicate bucket creation. The scheduler fails fast
# at boot if this is unreachable. ${DB_PASSWORD}/${DB_HOST} are injected
# by the compose env and expanded at load time.
scheduler_database_url = "postgresql://scheduler_staging:${DB_PASSWORD}@${DB_HOST}:5432/scheduler_staging"
reconciler_safety_margin  = 100
reconciler_interval_secs  = 30

# Spot + realized vol come from oracle-service (ORACLE_URL, set in compose).

[[pairs]]
underlying          = "TBTC"
settlement          = "TUSDC"
product_type        = "call"
expiry_interval_ms  = 604_800_000
strikes_below       = 2
strikes_above       = 2
interval_pct        = 5.0

  [pairs.spot]
  source             = "pyth"
  max_publish_lag_ms = 30_000
  max_conf_bps       = 100

[[pairs]]
underlying          = "TWAL"
settlement          = "TUSDC"
product_type        = "call"
expiry_interval_ms  = 604_800_000
strikes_below       = 2
strikes_above       = 2
interval_pct        = 10.0

  # WAL/USD cross via Pyth Hermes. Both legs read their `pythFeedId` from
  # deployments.json::staging.token_info (TWAL = WAL/USD, TUSDC = USDC/USD).
  [pairs.spot]
  source             = "pyth"
  max_publish_lag_ms = 30_000   # decline a roll on prices > 30s stale
  max_conf_bps       = 100      # decline a roll if conf/price > 1%

[[pairs]]
underlying          = "TSUI"
settlement          = "TUSDC"
product_type        = "call"
expiry_interval_ms  = 604_800_000
strikes_below       = 2
strikes_above       = 2
interval_pct        = 10.0

  # SUI/USD cross via Pyth Hermes. Both legs read their `pythFeedId` from
  # deployments.json::staging.token_info (TSUI = SUI/USD, TUSDC = USDC/USD).
  [pairs.spot]
  source             = "pyth"
  max_publish_lag_ms = 30_000   # decline a roll on prices > 30s stale
  max_conf_bps       = 100      # decline a roll if conf/price > 1%

# ── Cash-secured put pairs ──────────────────────────────────────────────
# Mirror the TSUI/TBTC call pairs above; `product_type = "put"` selects the
# put coin codegen + `create_put_bucket` path. A put family shares the expiry
# slot with its call twin — the scheduler disambiguates by coin module
# (`put_<i>` vs `call_<i>`). Vault auto-provisioning is call-only, so these
# roll put buckets but create no vault.
[[pairs]]
underlying          = "TSUI"
settlement          = "TUSDC"
product_type        = "put"
expiry_interval_ms  = 604_800_000
strikes_below       = 2
strikes_above       = 2
interval_pct        = 10.0

  [pairs.spot]
  source             = "pyth"
  max_publish_lag_ms = 30_000
  max_conf_bps       = 100

[[pairs]]
underlying          = "TBTC"
settlement          = "TUSDC"
product_type        = "put"
expiry_interval_ms  = 604_800_000
strikes_below       = 2
strikes_above       = 2
interval_pct        = 5.0

  [pairs.spot]
  source             = "pyth"
  max_publish_lag_ms = 30_000
  max_conf_bps       = 100

# ── Vault auto-provisioning (DEPRECATED, SO-332) ────────────────────────
# The covered-call vault product is retired. `[vault_template]` is absent
# here on purpose: with no template on the global table and none on any
# pair, `vault_entries` is empty and the vault-ensure pass never runs.
#
# Do not reinstate it. Re-adding the table makes the scheduler provision a
# fresh vault against the `options_vault` package, which is no longer
# published (see contracts/vault/DEPRECATED.md).

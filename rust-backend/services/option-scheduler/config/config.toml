# option-scheduler config.
#
# Chain-side ids (package, AdminCap, deployer address, test-token coin
# types, pyth feed ids) come from `deployments.json`. This file controls
# which pairs the bot rolls buckets for and how aggressively.

# GraphQL endpoint of the local indexer. Consumed only to confirm
# submitted rolls and drive the reconciler — never to make a roll
# decision (that is sourced solely from the DB below).
indexer_graphql_url       = "http://127.0.0.1:9002/graphql"

# Scheduler rolls DB (mandatory). Single source of truth for which
# (pair, expiry) slots have been rolled; its partial UNIQUE index is the
# hard guard against duplicate bucket creation. The scheduler fails fast
# at boot if this is unreachable. Point a local Postgres here for
# `cargo run`. Supports env-var expansion for deployed envs.
scheduler_database_url = "postgresql://postgres:postgres@localhost:7653/scheduler"

# How often the tick loop wakes up. Cheap — reads the DB + maybe submits
# one tx.
tick_secs         = 60

# When the latest family for a pair is closer than this to expiry, roll
# the next family. Default = 7 days (the typical bucket cadence).
roll_threshold_ms = 604_800_000

# Pyth Hermes endpoint. One HTTP `GET /v2/updates/price/latest` is issued
# per pair per roll — no SSE, no long-lived connection. Override for a
# private mirror. Sui testnet feed ids are the BETA set, served only by
# hermes-beta — stable hermes 404s on them (see keeper config for details).
[pyth]
hermes_url = "https://hermes-beta.pyth.network"

# Each pair gets its own roll cadence + strike grid + spot source.
[[pairs]]
underlying          = "TBTC"
settlement          = "TUSDC"
# Cadence between consecutive expiries this scheduler will create.
expiry_interval_ms  = 604_800_000      # 1 week

# Strike grid: spot ± `strikes_below`/`strikes_above` strikes, spaced
# `interval_pct` apart. e.g. spot $50_000, ±2 strikes at 5% → five strikes
# from $45k to $55k, snapped down to the nearest grid step.
strikes_below       = 2
strikes_above       = 2
interval_pct        = 5.0

  # Pyth pulls the cross of TBTC and TUSDC USD prices at roll time. Both
  # legs go through Pyth uniformly (no special-casing TUSDC at 1.0); the
  # `pythFeedId` for each ticker lives in `deployments.json::token_info`.
  [pairs.spot]
  source             = "pyth"
  max_publish_lag_ms = 30_000   # decline a roll on prices > 30s stale
  max_conf_bps       = 100      # decline a roll if conf/price > 1%

# Grid v2 (vault-implementation-guide doc 05 §4.2): add a `[pairs.grid]`
# table to place strikes at standard-deviation multiples instead of fixed
# percentages, so the covered-call vault's 0.1-delta strike (z = 1.30) is
# on-grid by construction. `strikes_below`/`strikes_above`/`interval_pct`
# are ignored for such pairs. σ = realized vol from Pyth Benchmarks
# (daily closes over `vol_window_days`), clamped to
# [vol_floor, vol_ceiling]; `sigma_fallback` covers static-spot pairs and
# benchmark outages.
#
#   [pairs.grid]
#   mode            = "z_ladder"
#   ladder          = [0.0, 0.65, 1.3, 1.95, 2.6]   # 7-point ladder for BTC
#   vol_window_days = 30
#   vol_floor       = 0.2
#   vol_ceiling     = 3.0
#   sigma_fallback  = 0.85

# ── Vault auto-provisioning ─────────────────────────────────────────────
# Presence of this table switches on the hourly vault-ensure pass: the
# scheduler creates one covered-call vault per configured pair with a Pyth
# feed on both legs (publishing a fresh 9-decimal share coin per vault).
# Static-spot pairs have no feed and are skipped. All fields
# fall back to the contract's reference config; an empty `[vault_template]` is
# enough to enable creation. Comment this table out to disable vault creation.
[vault_template]
mgmt_fee_bps_annual      = 200
perf_fee_bps             = 1_000
round_ms                 = 604_800_000
selling_window_ms        = 43_200_000
min_strike_bps_over_spot = 300
max_strike_bps_over_spot = 6_000
min_expiry_lead_ms       = 259_200_000
max_expiry_lead_ms       = 777_600_000
max_swap_slippage_bps    = 50
max_price_age_secs       = 60
max_conf_bps             = 100

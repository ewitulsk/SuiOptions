# gas-station config — staging env (testnet).

environment = "staging"

bind_addr   = "0.0.0.0:9009"
network     = "testnet"

allowed_origins = ["*"]

min_balance_threshold_mist = 1000000000
max_gas_budget_mist = 500000000
min_gas_budget_mist = 1000000
gas_budget_buffer_bps = 2500

# token-info supplies the protocol package (and dev/staging test tokens) that
# seed the sponsored-PTB templates at boot.
token_info_url = "http://token-info:9005"

# CCTP bridge burn PTB sponsorship (frontend tx/bridge.ts). Deliberately
# UNSET: the staging bridge runs on MAINNET (see cctp-relay
# config.staging.toml) while this gas-station sponsors on testnet — it cannot
# sponsor a mainnet PTB. Fill this in only if the bridge is ever offered on
# this env's own network:
# cctp_token_messenger_package = "0x31cc14d80c175ae39777c0238f20594c6d4869cfab199f40b69f3319956b8beb"  # testnet (mainnet: 0x2aa6c5d56376c371f88a6cc42e852824994993cb9bab8d3e6450cbe3cb32b94e)

# Pyth price-update prefix sponsorship for attestation-bearing trading-vault
# deposits (SO-300): latest upgraded Pyth/Wormhole packages on this network
# (testnet ids, same as the keeper's [pyth] block).
[pyth]
pyth_package_id     = "0xabf837e98c26087cba0883c0a7a28326b1fa3c5e1e2c5abdb486f9e8f594c837"
wormhole_package_id = "0xf47329f4344f3bf0f8e436e2f7b485466cff300f12a166563995d3888c296a94"

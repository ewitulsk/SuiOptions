# gas-station secrets — copy to `secrets.toml` and fill in the sponsor key.
# `secrets*.toml` is gitignored. In deployed envs this file is rendered by
# render-secrets.sh from AWS Secrets Manager (options/<env>/gas-station).
#
# The sponsor (gas payer) key, in Sui's `suiprivkey1…` bech32 format. The slot
# must match `network` in config: dev → devnet, staging/prod → testnet.

[sui]
testnet = "suiprivkey1..."
# devnet  = "suiprivkey1..."
# mainnet = "suiprivkey1..."

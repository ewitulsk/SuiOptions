# gas-station config — prod env (testnet, matching render-secrets.sh).

environment = "prod"

bind_addr   = "0.0.0.0:9009"
network     = "testnet"

allowed_origins = ["*"]

min_balance_threshold_mist = 1000000000
max_gas_budget_mist = 500000000
min_gas_budget_mist = 1000000
gas_budget_buffer_bps = 2500

# token-info supplies the sponsorable packages: the protocol package plus every
# supported token's coin-type package.
token_info_url = "http://token-info:9005"

# Extra packages to sponsor beyond what token-info reports. Off-catalog only.
additional_allowed_packages = []

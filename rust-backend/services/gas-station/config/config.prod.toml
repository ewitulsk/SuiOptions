# gas-station config — prod env (testnet, matching render-secrets.sh).

environment = "prod"

bind_addr   = "0.0.0.0:9009"
network     = "testnet"

allowed_origins = ["*"]

min_balance_threshold_mist = 1000000000
max_gas_budget_mist = 500000000
min_gas_budget_mist = 1000000
gas_budget_buffer_bps = 2500

# token-info supplies the protocol package that seeds the sponsored-PTB
# templates at boot. (No faucet templates in prod.)
token_info_url = "http://token-info:9005"

# CCTP bridge burn PTB sponsorship (frontend tx/bridge.ts). Set to Circle's
# TokenMessengerMinter package for this network to sponsor the burn.
# cctp_token_messenger_package = "0x31cc14d80c175ae39777c0238f20594c6d4869cfab199f40b69f3319956b8beb"  # testnet (mainnet: 0x2aa6c5d56376c371f88a6cc42e852824994993cb9bab8d3e6450cbe3cb32b94e)

# Pyth price-update prefix sponsorship for attestation-bearing trading-vault
# deposits (SO-300): latest upgraded Pyth/Wormhole packages on this network
# (testnet ids, same as the keeper's [pyth] block).
[pyth]
pyth_package_id     = "0xabf837e98c26087cba0883c0a7a28326b1fa3c5e1e2c5abdb486f9e8f594c837"
wormhole_package_id = "0xf47329f4344f3bf0f8e436e2f7b485466cff300f12a166563995d3888c296a94"

# Switchboard's own `on_demand` package (SO-335), needed to allowlist the
# quote-submit prefix (`quote_submit_result_action::run_N`) on
# attestation-bearing deposits. Our `oracle_switchboard` adapter id comes
# from token-info; only Switchboard's own package does not, because it is
# a third-party deployment we do not publish.
#
# Verified 2026-08-02: this is `published-at` on the switchboard-xyz/sui
# `testnet` branch — the exact rev contracts/oracle-switchboard links —
# and the object resolves on chain as a package. NOT the 0x28005599… that
# Move.testnet.toml on `main` and the docs quote: that is the SIXTH
# publish; this is the eighth.
[switchboard]
package_id = "0x0ea79f9c3fa1e3f701885a00bf26f92a297223165f26529767d2f7d1e3c4ac1e"

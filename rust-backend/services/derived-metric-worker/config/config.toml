# derived-metric-worker config — local dev.

environment = "dev"
ops_addr    = "127.0.0.1:9013"
read_addr   = "127.0.0.1:9014"

indexer_graphql_url = "http://127.0.0.1:9002/graphql"
token_info_url      = "http://127.0.0.1:9005"
database_url        = "postgresql://derived_metrics_dev:dev@127.0.0.1:5432/derived_metrics_dev"

tick_secs = 120

# BETA hermes — Sui testnet feed ids are the beta set; stable hermes 404s.
# Benchmarks is stable-only, so beta-id vol lookups fall back to the model.
[pyth]
hermes_url      = "https://hermes-beta.pyth.network"
benchmarks_url  = "https://benchmarks.pyth.network"
vol_window_days = 30

[model]
forecast_horizon = 4
delta_target     = 0.10

# Market-maker bot config — the vol desk (SO-299).
#
# Everything chain-side (packages, objects, coin types, faucets) is
# resolved from token-info at boot. This file controls the bot's
# *behaviour*: what pairs it serves, the desk's risk parameters, and what
# it advertises to the quoting service.
#
# Secrets live in `secrets.toml` ([sui] for gas, [mm_bot].quote_key for
# the Quote signing key).

# Sui network: selects the deployments slot, the [sui].<network> secret
# slot, and the Sui RPC URL. One of: mainnet / testnet / devnet.
network            = "testnet"

quoting_url        = "ws://127.0.0.1:9002/"

# Signature scheme for both the WS auth challenge and every Quote.
# One of: "ed25519" / "secp256k1" / "secp256r1".
signing_scheme     = "ed25519"

# --- Collateral routing chassis ----------------------------------------
# Each MM publishes its own mm_collateral package (`mm-bot
# deploy-collateral`); the account backs the signer bootstrap funding.
# NOTE: the desk's QUOTES no longer route here — they release collateral
# from the trading vault ([desk] below, `vault_mm`).
# collateral_package = "0x..."
# collateral_account = "0x..."

# Pairs. `underlying_symbols` empty/unset ⇒ derive mode (every enabled
# token-info token with a Pyth feed; watcher restarts on new listings).
underlying_symbols = ["TBTC", "TWAL"]
settlement_symbol  = "TUSDC"

# Annualized risk-free rate. Protocol convention is r = 0.
rate               = 0.0

# How long the bot's signed quotes stay valid (also the premium
# reservation TTL).
quote_ttl_ms       = 30_000

# Both roles by default: writer_mm receives trader-flow RFQs so the desk
# can decline them explicitly (and record the decline) rather than
# silently unsubscribing — the desk never writes options (SO-426).
roles = ["trader_mm", "writer_mm"]

# Answer unsigned bulk-view RFQs (indicative premiums for the frontend's
# tiles). Priced by the desk but never signed and never reserved.
bulk_view_enabled = true

# First-run bootstrap funding of the MM's own CollateralAccount (chassis).
bootstrap_settlement_amount = 1_000_000_000_000
bootstrap_underlying_amount = 100_000_000_000

# Background inventory top-up (chassis). Threshold 0 disables.
underlying_replenish_threshold    = 20_000_000_000
underlying_replenish_amount       = 100_000_000_000
underlying_replenish_interval_secs = 60

# Live prices come from oracle-service (--oracle-url / ORACLE_URL).
[pyth]
max_price_age_ms       = 5_000
max_publish_lag_ms     = 10_000
# Pyth confidence gate, bps of price; 0 = off.
max_conf_bps           = 0
# Short + long realized-vol windows feeding the desk's vol surface.
vol_window_hours       = 24
vol_long_window_hours  = 168
vol_sample_interval_ms = 300_000
fallback_vol           = 0.6
[pyth.fallback_vols]
TBTC = 0.45
TWAL = 1.0

# ── The vol desk (SO-299) ───────────────────────────────────────────────
# V1: delta-hedged long-vol fund — buys retail's covered calls (WS RFQs +
# on-chain auctions), paper-hedges delta on bands, runs the exit ladder
# (resale → hold → automated/flash exercise), monitors + nightly stress.
# The desk never writes options (SO-426): trader-flow RFQs always decline.
#
# VAULT-ONLY MAKER: the bot trades exclusively as the trading vault's
# curator. Quotes release collateral from the vault (`vault_mm`); all
# outputs (positions, option coins, exit proceeds) land at the vault
# address. The desk refuses to boot without a vault it can actually use —
# every claim below is re-checked against chain state at startup.
#
# Vault resolution (SO-345):
#   vault_id set    -> adopt it, whatever its provenance (operator intent).
#   vault_id unset  -> adopt a vault THIS WALLET created, else provision
#                      one when [desk.provision].enabled = true.
# A CuratorCap someone else transferred here is never adopted on its own:
# create_vault is permissionless and names its curator freely, so holding
# a cap proves nothing. Only `creator` (the tx sender) does.
#
# All [desk.*] knobs default to the 00-plan starting parameters — only
# the vault wiring is required.
[desk]
enabled            = false
# vault_id           = "0x..."   # pin to adopt a vault made by someone else
# mm_release_enabled = true      # consent to flip vault_mm ON when chain says off
# expected_holding_years = 0.0575  # ~21d — hedge-cost horizon in the bid
# pnl_jsonl_path = "services/mm-bot/state/desk-pnl.jsonl"
# state_dir      = "services/mm-bot/state"
# refresh_secs   = 60
# Self-provisioning. Off by default: on prod a vault custodies real
# depositor funds, so provision it deliberately and pin the id.
# [desk.provision]
# enabled            = false
# lockup_ms          = 0          # depositor lockup
# curator_fee_bps    = 0
# unwind_grace_ms    = 86_400_000
# gas_budget         = 200_000_000
#
# v2 capital structure (SO-418). Defaults = UNTRANCHED; the desk vault
# stays untranched unless all six tranche params are set coherently
# (structure_code 1 aborts on-chain otherwise).
# structure_code             = 0   # 0 untranched / 1 senior-junior
# senior_hurdle_bps_annual   = 0
# target_junior_bps          = 0
# maintenance_junior_bps     = 0
# upside_code                = 0
# residual_participation_bps = 0
# total_return_cap_bps       = 0
# terms_version              = 1
# spec_hash                  = ""  # hex content hash of the terms doc
#
# Escrowed curator-commitment funding (deposit_into_commitment) at
# provision / on adoption when the slot is missing, accounting raw units.
# 0 disables — but an unfunded commitment parks the desk risk-off once
# the protocol floor is nonzero. Default $100k at 6 decimals.
# commitment_deposit         = 100_000_000_000
#
# Testnet-only faucet behaviour. Seeds a vault the desk PROVISIONS (never
# one it adopts) so it has NAV to quote against — an unseeded vault is
# NAV 0 and hard-declines every RFQ. Setting this on a non-testnet
# network is a hard config error, not a silent skip.
# [testnet]
# mint_and_deposit_liquidity = false
# mint_and_deposit_amount    = 1_000_000_000_000  # $1M at 6 decimals
#
# Per-underlying staking yield (BAW carry; drives early exercise):
# [desk.carry_yields]
# TSUI = 0.025

# Desk time-series history on TimescaleDB (SO-349): the recorder samples
# the /desk/state snapshot into desk_* hypertables and mirrors the P&L
# JSONL ledger; /desk/history serves range queries. The URL is a secret —
# deployed via the DESK_DATABASE_URL env var (compose maps it from the
# price-charting Tiger Data secret); the TOML field is for local dev
# (e.g. `docker run -p 5432:5432 timescale/timescaledb:latest-pg16`).
# Neither set ⇒ history disabled; the bot trades regardless.
#
# record_rfq_outcomes gates the RFQ funnel (desk_rfq_outcomes) and
# defaults OFF (doc 08 §3.1, decided 2026-09-01, SO-447): nothing
# observed on our own Earn RFQ channel while it runs on testnet is
# calibration data — it is telemetry only, and we are the only
# participants — so testnet deployments write no RFQ rows at all. State,
# P&L and reservation history are unaffected. Flip it on for mainnet.
# [desk.history]
# database_url = "postgres://postgres:password@127.0.0.1:5432/tsdb"
# db_pool_size = 2
# sample_secs  = 60
# record_rfq_outcomes = false

# [desk.surface]              # vol surface shaping
# risk_premium = 0.05         # +5 vol pts over realized
# skew = 0.0
# convexity = 0.0
# floor_vol = 0.10
# cap_vol = 5.0
# estimator = "windows"       # "har" = vol-forecast HAR-RV at q_bid (SO-440)
# q_bid = 0.35                # forecast quantile the bid prices at
# refit_secs = 86400          # HAR calibration refit cadence
# convexity_from_kurtosis = false

# [desk.v1]                   # bid discipline (vol pts are decimals)
# base_spread_volpts = 0.05   # bid at fair − 5 vol pts
# size_penalty_volpts_per_pct_nav = 0.01
# size_penalty_quadratic_from_pct = 3.0
# inventory_penalty_max_volpts = 0.10
# inventory_penalty_start_util = 0.6
# max_single_fill_pct_nav = 5.0
# composition_penalty_volpts = 0.05   # widening at a hard composition threshold (SO-445)

# [desk.limits]                     # long-only retrofit (doc 08 §0.4)
# premium_budget_soft = 0.25
# premium_budget_hard = 0.30
# call_premium_max = 0.20
# put_premium_max = 0.20
# vega_cap_nav_per_volpt = 0.005
# theta_soft_nav_per_day = 0.0010   # 10 bps
# theta_hard_nav_per_day = 0.0015   # 15 bps
# per_expiry_max = 0.10
# per_strike_bucket_max = 0.10
# kill_drawdown = 0.10              # stop new buys: NAV −10% in 7d
# kill_window_days = 7.0
# Composition limits (doc 08 §4.5, SO-445): soft = start of the bid
# widening (see [desk.v1] composition_penalty_volpts), hard = solvency
# decline. Provisional — the backtester selects them out of sample.
# gamma_soft_nav_per_pct_move = 0.05  # per type × expiry, delta-notional
# gamma_hard_nav_per_pct_move = 0.10  #   change per 1% spot move, of risk NAV
# hedge_stress_loss_soft = 0.05       # crash loss on put hedges / rally loss
# hedge_stress_loss_hard = 0.10       #   on call hedges, of risk NAV (§0.4 top-up)
# exercise_demand_soft = 0.80         # per-expiry strike cash / underlying vs sources
# exercise_demand_hard = 1.00
# concurrent_demand_soft = 0.80       # worst expiry + worst stress loss vs all sources
# concurrent_demand_hard = 1.00

# [desk.capital]              # capital snapshot + policy (doc 08 §0.4/§4.6, SO-444)
# Every dollar cap scales from risk_nav = min(fresh appraised NAV, local
# NAV) − queued withdrawals − liquidity reserve; stale inputs DECLINE new
# quotes. Flash / spot figures are measurements (settlement raw) standing
# in for pollers that do not exist yet — the snapshot labels them.
# appraisal_max_age_secs = 3600
# external_equity_max_age_secs = 900
# snapshot_max_age_secs = 300       # refresher stalled ⇒ decline
# reservation_grace_secs = 300      # reservation outlives the quote TTL by this
# liquidity_reserve_frac = 0.10     # 00-plan: 10% NAV (floor 5%)
# margin_topup_max = 0.10           # doc 08 §0.4: max margin top-up in 24h
# venue_margin_from_chain = false   # true on a live venue: margin capacity = on-chain
#                                   # external budget / daily release remaining
# maintenance_margin_fraction = 0.05
# base_flash_capacity = 0           # ASSUMPTION until a pool poller exists
# quote_flash_capacity = 0
# spot_buy_capacity_by_slippage = [{ slippageBps = 10, capacity = 0 }]
# spot_sell_capacity_by_slippage = [{ slippageBps = 10, capacity = 0 }]
# reference_hedge_notional_per_premium = 6.0   # headline /desk/state capacities only
# reference_exercise_cash_per_premium = 12.0

# [desk.hedge]                # paper venue until a real one lands
# band_pct_nav = 15.0         # doc 07 §5: risk reduction saturates at 10–20%
# band_wide_pct_nav = 25.0
# funding_widen_threshold = -0.25   # widen when shorts pay > 25%/yr
# interval_secs = 30
# paper_slippage_bps = 3.5    # doc 07 §6.1: Bluefin taker 3.5 bp + spread
# paper_funding_rate_annual = 0.0
# Bid-side hedge cost inputs (doc 08 §4.3, SO-437); all default to 0 except
# the Bluefin taker fee and a 10% initial margin fraction.
# taker_fee_bps = 3.5
# fixed_fee_per_fill = 0.0            # settlement raw units (Bluefin: 0.03 USDC)
# rebalance_turnover_per_year = 0.0   # doc 07 §5: ~137/yr at 20% bands
# margin_financing_rate_annual = 0.0
# initial_margin_fraction = 0.10
# order_timeout_secs = 60             # cancel a working hedge order after this (SO-438)

# Multi-venue hedging: declare [[desk.hedge.venues]] entries to run
# several venues (per-venue labelled gauges, min-margin alerts naming
# the venue, notional-weighted funding into pricing; the FIRST entry is
# the primary execution venue the rebalancer trades). Omit the array to
# keep the single legacy paper venue built from the paper_* knobs above.
# [[desk.hedge.venues]]
# kind = "paper"              # only "paper" until real venues land
# name = "paper"              # gauge/alert label + state-file key
# slippage_bps = 3.5          # default: paper_slippage_bps
# funding_rate_annual = 0.0   # default: paper_funding_rate_annual
# fill_fraction = 1.0         # paper: fraction filled at once; remainder fills next tick (SO-438)

# [desk.auctions]             # RETIRED on-chain RFQ channel
# The auction venue is deprecated (contracts/.deprecated/auction):
# `options_adapter::bid_on_auction` no longer exists in fresh
# deployments. Disabled by default; do not enable.
# enabled = false

# [desk.exits]
# enabled = true
# tick_secs = 300
# offset_close_enabled = true # step 0: net written vs held (close_offset)
# carry_mult = 1.1            # exercise when carry > time value × 1.1
# near_expiry_hours = 24.0
# max_slice = 1_000_000_000   # flash-exercise ladder chunk
# [desk.exits.spot_pools]     # UNDERLYING/SETTLEMENT pools for flash
# TSUI = "0x..."              # (also the put-exercise pool allowlist)

# [desk.exits.put]            # put exercise policy (SO-443, doc 08 §0.4/§4.4)
# enabled = true
# min_profit_usd = 10.0       # min profit = max($10, 5 bps × payout,
# min_profit_bps = 5.0        #   2 × route uncertainty)
# route_uncertainty_bps = 20.0 # cash bound on route drift, bps of payout
# route_uncertainty_mult = 2.0
# swap_fee_bps = 0.0          # repurchase taker fee bound (whitelisted: 0)
# flash_fee_bps = 0.0         # DeepBook v3 flash loans are fee-free
# gas_cost_usd = 0.05         # per-slice gas allowance in the profit test
# max_gas_mist = 100_000_000  # dev-inspect gas above this ⇒ not submitted
# ladder_tx_secs = 30         # per-slice inclusion allowance vs expiry
# expiry_margin_secs = 120    # no slice starts inside this margin
# ask_ticks = 50              # ask-ladder depth read for route pricing

# [desk.listings]             # exchange resting-ask exits (SO-416)
# The desk lists its option inventory as resting ASKS on the in-house
# exchange (orderbook service); the exchange's matching engine executes
# resales whenever a bid crosses. Replaces the retired per-option
# DeepBook taker resale. Requires curator refs + the exchangeAdapter /
# exchangeListing records in token-info.
# enabled = false
# orderbook_url = "http://127.0.0.1:9014"
# concession_bps = 200        # asks list at mark × (1 + 200 bps)
# requote_drift_bps = 50      # cancel-replace past this price drift
# order_ttl_secs = 900        # also bounded by the bucket's expiry
# max_fraction_bps = 10000    # list all vault units
# min_list_units = 0
# max_fee_bps = 50
# watermark_interval_secs = 3600
# gas_budget = 200_000_000

# [desk.monitors]
# interval_secs = 60
# bleed_window_hours = 24.0
# stress_interval_secs = 86_400
# stress_max_drawdown = 0.25
# stress_gap_down = 0.60      # crash the long-perp put hedges are sized for
# stress_gap_up = 0.80        # rally the short-perp call hedges are sized for

# ── Testnet counterparty sim (SO-299) ──────────────────────────────────
# The desk's test counterparty: redeems expired wallet Positions and
# funds via faucets. Hard-gated: testnet + faucets only; never raises
# alert_ids. (Its auction opener is retired with the options_rfq
# package — the opener idles when token-info carries no rfq id.)
# [sim]
# enabled = true
# fund_interval_secs = 120

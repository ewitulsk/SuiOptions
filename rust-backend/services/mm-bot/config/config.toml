# Market-maker bot config.
#
# Everything chain-side (package, ProtocolConfig, Treasury, test-token
# package, per-symbol faucets, coin types) is resolved from
# `deployments.json` at boot. This file controls the bot's *behaviour*:
# what pair to quote on, its pricing inputs, and what it advertises to
# the quoting service.
#
# Secrets live in `secrets.toml` ([sui] for gas, [mm_bot].quote_key for
# the Quote signing key).

# Sui network: selects the deployments.json slot, the [sui].<network>
# secret slot, and the Sui RPC URL. One of: mainnet / testnet / devnet.
network            = "testnet"

quoting_url        = "ws://127.0.0.1:9002/"

# Signature scheme this MM uses for both the WS auth challenge and every
# Quote. The chain's `Account.signing_scheme` must hold the same tag; if
# they diverge, every quote reverts with `quote_signature_invalid`.
# One of: "ed25519" / "secp256k1" / "secp256r1".
signing_scheme     = "ed25519"

# --- Collateral routing (collateral abstraction, plan 04 §8) -----------
# Core holds no MM funds: each MM publishes its own mm_collateral package
# (`mm-bot deploy-collateral`) and its quotes carry the routing INSIDE the
# signed payload. When these are unset, the bot reads the state file the
# deploy-collateral subcommand writes
# (services/mm-bot/config/collateral.<network>.toml).
# collateral_package = "0x..."
# collateral_account = "0x..."
# release_module     = "mm_collateral"


# Pair to make markets on. Must exist under
# `deployments.testTokens.tokens.<SYMBOL>`, and each entry there must
# carry a `pythFeedId` — the bot pulls live USD prices for both legs and
# computes the cross + scale into the bucket's on-chain units.
underlying_symbols = ["TBTC", "TWAL"]
settlement_symbol  = "TUSDC"

# Annualized risk-free rate. Protocol convention is r = 0 (settlement is a
# stablecoin with no funded rate leg), which keeps fair value identical
# across the keeper, api-service, vault-sim, and this bot. Note r > 0 also
# reintroduces the American-put early-exercise premium that European
# Black-Scholes doesn't model (see crates/pricing).
rate               = 0.0

# How long the bot's signed quotes stay valid.
quote_ttl_ms       = 30_000

# Two-sided spread. The primary spread is in VOL space — the ask leg prices
# at sigma × ask_vol_markup, the bid leg at sigma × bid_vol_markdown — so the
# spread scales with the vega being warehoused. The bps knobs are the
# *minimum* premium-space spread, all that separates the sides deep ITM where
# vega ≈ 0.
ask_markup_bps     = 100
bid_markdown_bps   = 100
ask_vol_markup     = 1.10
bid_vol_markdown   = 0.90

# Last-look charge: a signed quote is a free 30s option for the taker (they
# execute only when the market moved their way during the TTL). Charge the
# expected favorable move — mult × |delta|·spot·sigma·√(ttl_years) — on the
# ask, and shade it off the bid. 0.0 disables.
ttl_charge_mult    = 1.0

# Extra vol widening while quoting on the fallback sigma (vol buffer still
# cold): ask sigma ×= this, bid sigma ÷= this. 1.0 disables.
fallback_vol_penalty = 1.25

# Size awareness. max_quote_notional caps any single RFQ's notional
# (spot x write_amount, settlement smallest-units); 0 = no cap. Size
# widening adds size_widening_vol of proportional vol spread per
# size_ref_notional of notional, so big clips pay for the inventory they
# move. 100_000_000_000 = 100k TUSDC at 6 decimals.
max_quote_notional = 0
size_widening_vol  = 0.10
size_ref_notional  = 100_000_000_000


# Both roles by default; a single Account can serve writer + trader.
roles = ["trader_mm", "writer_mm"]

# Answer unsigned bulk-view RFQs (indicative premiums for the frontend's
# tiles). Priced with the same model as signed RFQs but never signed — no
# nonce is consumed and nothing reaches the chain. Defaults to false.
bulk_view_enabled = true

# Settlement deposited into the freshly-bootstrapped Account on first run
# so it can pay premiums right away (Trader-MM / bid side). In TUSDC
# smallest-units.
bootstrap_settlement_amount = 1_000_000_000_000

# Underlying deposited into the freshly-bootstrapped Account on first run so it
# can write calls to retail traders (Writer-MM / ask side). In TBTC
# smallest-units.
bootstrap_underlying_amount = 100_000_000_000

# Background inventory top-up (Writer-MM side): when the Account's underlying
# balance falls below `underlying_replenish_threshold`, mint+deposit
# `underlying_replenish_amount` more via the test faucet. Set the threshold to
# 0 to disable. `underlying_replenish_interval_secs` is how often we check.
underlying_replenish_threshold    = 20_000_000_000
underlying_replenish_amount       = 100_000_000_000
underlying_replenish_interval_secs = 60
# Optional: where minted call tokens / position NFTs should land. Leave
# unset to derive from the Sui wallet key.
# token_recipient = "0xabc..."

# Strike-dependent vol (see crates/pricing smile.rs): sigma(K) = sigma_atm x
# (1 + skew*z + convexity*z^2), z = ln(K/S)/(sigma_atm*sqrt(tau)). Flat (0/0)
# until calibrated from observed quotes; positive skew richens the upside
# wing, positive convexity richens both wings. Per-symbol overrides:
#   [smiles.TBTC]
#   skew = 0.05
[smile]
skew      = 0.0
convexity = 0.0


# Live prices come from oracle-service (--oracle-url / ORACLE_URL, default
# http://127.0.0.1:9013). All fields are optional — these are the defaults
# from `PythConfig::default()` written out explicitly so the knobs are
# discoverable.
[pyth]
# Reject an RFQ if our last *observation* of either price is older than
# this. Catches a wedged or disconnected oracle WS stream.
max_price_age_ms       = 5_000
# Reject if Pyth's publisher timestamp is older than this. Catches the
# case where the stream is alive but Pyth itself isn't publishing.
max_publish_lag_ms     = 10_000
# Reject if either feed's Pyth confidence interval exceeds this many bps of
# its price — fresh-but-unsure feeds are when quotes get picked off. 0 = off;
# observe conf/price on our feeds before enabling.
max_conf_bps           = 0
# Short rolling window for realized vol; the quoted sigma is
# max(short, long) so one calm day can't undercut the trailing week.
vol_window_hours       = 24
vol_long_window_hours  = 168
# Live-cache sample cadence into the vol buffers. Annualization uses the
# samples' actual timestamps, so skipped ticks don't bias sigma. 5-minute
# sampling: 1-minute bars mostly measure oracle jitter, not diffusion.
vol_sample_interval_ms = 300_000
# Sigma used until the buffer has enough samples, then live takes over.
# Per-symbol overrides below; this is the default for anything unlisted.
fallback_vol           = 0.6
[pyth.fallback_vols]
TBTC = 0.45
TWAL = 1.0

# DeepBook quoting (SO-158). Off by default for local runs — flip on once
# the local stack serves deepbook ids from token-info.
[deepbook]
enabled = false

# Market-maker bot config.
#
# Everything chain-side (package, ProtocolConfig, Treasury, test-token
# package, per-symbol faucets, coin types) is resolved from
# `deployments.json` at boot. This file controls the bot's *behaviour*:
# what pair to quote on, its pricing inputs, and what it advertises to
# the quoting service.
#
# Secrets live in `secrets.toml` ([sui] for gas, [mm_bot].quote_key for
# the Quote signing key).

# Sui network: selects the deployments.json slot, the [sui].<network>
# secret slot, and the Sui RPC URL. One of: mainnet / testnet / devnet.
network            = "testnet"

quoting_url        = "ws://127.0.0.1:9002/"

# Signature scheme this MM uses for both the WS auth challenge and every
# Quote. The chain's `Account.signing_scheme` must hold the same tag; if
# they diverge, every quote reverts with `quote_signature_invalid`.
# One of: "ed25519" / "secp256k1" / "secp256r1".
signing_scheme     = "ed25519"

# Pair to make markets on. Must exist under
# `deployments.testTokens.tokens.<SYMBOL>`, and each entry there must
# carry a `pythFeedId` — the bot pulls live USD prices for both legs and
# computes the cross + scale into the bucket's on-chain units.
underlying_symbols = ["TBTC", "TWAL"]
settlement_symbol  = "TUSDC"

# Annualized risk-free rate. Pyth doesn't model the curve; this stays a
# config knob.
rate               = 0.05

# How long the bot's signed quotes stay valid.
quote_ttl_ms       = 30_000

# Two-sided spread off the Black-Scholes mid, in basis points. We serve both
# sides from one Account, so the spread is what makes the book two-sided:
#   ask_markup_bps   — marked UP when we write to a retail trader (Side::Trader)
#   bid_markdown_bps — marked DOWN when we buy from a retail writer (Side::Writer)
ask_markup_bps     = 100
bid_markdown_bps   = 100

# --- Pricing model knobs (default to today's behavior; set after calibration) ---
# Variance-risk-premium multiplier (IV/RV) applied to the realized-vol estimate
# before pricing. 1.0 = price on raw realized vol (legacy). The vault keeper uses
# ~1.15; align the bot here once the backtester calibrates the live regime.
vrp_ratio          = 1.0
# OTM-wing skew slopes, in bps per unit of log-moneyness. 0 = flat smile.
#   call_skew_bps lifts OTM calls (K>S); put_skew_bps lifts OTM puts (K<S).
# Crypto typically carries a steeper downside (put) skew — calibrate separately.
call_skew_bps      = 0.0
put_skew_bps       = 0.0
# Continuous carry/dividend yield q of the underlying (staking, perp funding).
# 0 = none. Feeds the forward drift and the American pricer.
carry_yield        = 0.0
# Price the American early-exercise right (CRR binomial) instead of European.
# false = European (legacy). Mainly affects ITM puts on a positive rate.
american           = false

# Both roles by default; a single Account can serve writer + trader.
roles = ["trader_mm", "writer_mm"]

# Answer unsigned bulk-view RFQs (indicative premiums for the frontend's
# tiles). Priced with the same model as signed RFQs but never signed — no
# nonce is consumed and nothing reaches the chain. Defaults to false.
bulk_view_enabled = true

# Settlement deposited into the freshly-bootstrapped Account on first run
# so it can pay premiums right away (Trader-MM / bid side). In TUSDC
# smallest-units.
bootstrap_settlement_amount = 1_000_000_000_000

# Underlying deposited into the freshly-bootstrapped Account on first run so it
# can write calls to retail traders (Writer-MM / ask side). In TBTC
# smallest-units.
bootstrap_underlying_amount = 100_000_000_000

# Background inventory top-up (Writer-MM side): when the Account's underlying
# balance falls below `underlying_replenish_threshold`, mint+deposit
# `underlying_replenish_amount` more via the test faucet. Set the threshold to
# 0 to disable. `underlying_replenish_interval_secs` is how often we check.
underlying_replenish_threshold    = 20_000_000_000
underlying_replenish_amount       = 100_000_000_000
underlying_replenish_interval_secs = 60

# Optional: where minted call tokens / position NFTs should land. Leave
# unset to derive from the Sui wallet key.
# token_recipient = "0xabc..."

# Live prices come from oracle-service (--oracle-url / ORACLE_URL, default
# http://127.0.0.1:9013). All fields are optional — these are the defaults
# from `PythConfig::default()` written out explicitly so the knobs are
# discoverable.
[pyth]
# Reject an RFQ if our last *observation* of either price is older than
# this. Catches a wedged or disconnected oracle WS stream.
max_price_age_ms       = 5_000
# Reject if Pyth's publisher timestamp is older than this. Catches the
# case where the stream is alive but Pyth itself isn't publishing.
max_publish_lag_ms     = 10_000
# Rolling window for realized vol.
vol_window_hours       = 24
# Live-cache sample cadence into the vol buffer. Annualization follows
# this cadence: sigma_year = stddev_log_returns * sqrt(samples_per_year).
vol_sample_interval_ms = 60_000
# Sigma used until the buffer has enough samples, then live takes over.
fallback_vol           = 0.6
# Realized-vol estimator: "sample_stddev" (legacy; subtracts the sample mean,
# biases σ down on short trending windows), "zero_mean" (no drift subtraction —
# preferred for option vol), or "ewma" (exponentially-weighted, tracks regimes).
vol_estimator          = "sample_stddev"
# EWMA decay λ when vol_estimator = "ewma". 0.94 = RiskMetrics daily.
ewma_lambda            = 0.94
# Decline a quote when Pyth's confidence band exceeds this fraction of price
# (conf/price). 0 disables the guard. e.g. 0.02 = decline above a 2% band.
max_conf_ratio         = 0.0

# DeepBook quoting (SO-158). Off by default for local runs — flip on once
# the local stack serves deepbook ids from token-info.
[deepbook]
enabled = false

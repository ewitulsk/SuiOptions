# Market-maker bot config — the vol desk (SO-299).
#
# Everything chain-side (packages, objects, coin types, faucets) is
# resolved from token-info at boot. This file controls the bot's
# *behaviour*: what pairs it serves, the desk's risk parameters, and what
# it advertises to the quoting service.
#
# Secrets live in `secrets.toml` ([sui] for gas, [mm_bot].quote_key for
# the Quote signing key).

# Sui network: selects the deployments slot, the [sui].<network> secret
# slot, and the Sui RPC URL. One of: mainnet / testnet / devnet.
network            = "testnet"

quoting_url        = "ws://127.0.0.1:9002/"

# Signature scheme for both the WS auth challenge and every Quote.
# One of: "ed25519" / "secp256k1" / "secp256r1".
signing_scheme     = "ed25519"

# --- Collateral routing chassis ----------------------------------------
# Each MM publishes its own mm_collateral package (`mm-bot
# deploy-collateral`); the account backs the signer bootstrap funding.
# NOTE: the desk's QUOTES no longer route here — they release collateral
# from the trading vault ([desk] below, `vault_mm`).
# collateral_package = "0x..."
# collateral_account = "0x..."

# Pairs. `underlying_symbols` empty/unset ⇒ derive mode (every enabled
# token-info token with a Pyth feed; watcher restarts on new listings).
underlying_symbols = ["TBTC", "TWAL"]
settlement_symbol  = "TUSDC"

# Annualized risk-free rate. Protocol convention is r = 0.
rate               = 0.0

# How long the bot's signed quotes stay valid (also the premium
# reservation TTL).
quote_ttl_ms       = 30_000

# Both roles by default; writer_mm only matters once [desk.v2] is on.
roles = ["trader_mm", "writer_mm"]

# Answer unsigned bulk-view RFQs (indicative premiums for the frontend's
# tiles). Priced by the desk but never signed and never reserved.
bulk_view_enabled = true

# First-run bootstrap funding of the MM's own CollateralAccount (chassis).
bootstrap_settlement_amount = 1_000_000_000_000
bootstrap_underlying_amount = 100_000_000_000

# Background inventory top-up (chassis). Threshold 0 disables.
underlying_replenish_threshold    = 20_000_000_000
underlying_replenish_amount       = 100_000_000_000
underlying_replenish_interval_secs = 60

# Live prices come from oracle-service (--oracle-url / ORACLE_URL).
[pyth]
max_price_age_ms       = 5_000
max_publish_lag_ms     = 10_000
# Pyth confidence gate, bps of price; 0 = off.
max_conf_bps           = 0
# Short + long realized-vol windows feeding the desk's vol surface.
vol_window_hours       = 24
vol_long_window_hours  = 168
vol_sample_interval_ms = 300_000
fallback_vol           = 0.6
[pyth.fallback_vols]
TBTC = 0.45
TWAL = 1.0

# ── The vol desk (SO-299) ───────────────────────────────────────────────
# V1: delta-hedged long-vol fund — buys retail's covered calls (WS RFQs +
# on-chain auctions), paper-hedges delta on bands, runs the exit ladder
# (resale → hold → automated/flash exercise), monitors + nightly stress.
# V2 (two-sided writing) stays behind [desk.v2].
#
# VAULT-ONLY MAKER: the bot trades exclusively as the trading vault's
# curator. Quotes release collateral from the vault (`vault_mm`); all
# outputs (positions, option coins, exit proceeds) land at the vault
# address. The desk refuses to boot without vault_id and the
# mm_release_enabled attestation (curator must have toggled the vault's
# vault_mm release path ON).
#
# All [desk.*] knobs default to the 00-plan starting parameters — only
# the vault wiring is required.
[desk]
enabled            = false
# vault_id           = "0x..."   # the TradingVault this desk curates
# mm_release_enabled = true      # attestation: vault_mm toggled on-chain
# expected_holding_years = 0.0575  # ~21d — hedge-cost horizon in the bid
# pnl_jsonl_path = "services/mm-bot/state/desk-pnl.jsonl"
# state_dir      = "services/mm-bot/state"
# refresh_secs   = 60
# Per-underlying staking yield (BAW carry; drives early exercise):
# [desk.carry_yields]
# TSUI = 0.025

# [desk.surface]              # vol surface shaping
# risk_premium = 0.05         # +5 vol pts over realized
# skew = 0.0
# convexity = 0.0
# floor_vol = 0.10
# cap_vol = 5.0

# [desk.v1]                   # bid discipline (vol pts are decimals)
# base_spread_volpts = 0.05   # bid at fair − 5 vol pts
# size_penalty_volpts_per_pct_nav = 0.01
# size_penalty_quadratic_from_pct = 3.0
# inventory_penalty_max_volpts = 0.10
# inventory_penalty_start_util = 0.6
# max_single_fill_pct_nav = 5.0

# [desk.limits]
# premium_budget_soft = 0.30
# premium_budget_hard = 0.35
# vega_cap_nav_per_volpt = 0.005
# theta_soft_nav_per_day = 0.0010   # 10 bps
# theta_hard_nav_per_day = 0.0015   # 15 bps
# per_expiry_max = 0.30
# per_strike_bucket_max = 0.15
# kill_drawdown = 0.10              # stop new buys: NAV −10% in 7d
# kill_window_days = 7.0

# [desk.hedge]                # paper venue until a real one lands
# band_pct_nav = 1.5
# band_wide_pct_nav = 2.5
# funding_widen_threshold = -0.25   # widen when shorts pay > 25%/yr
# interval_secs = 30
# paper_slippage_bps = 5.0
# paper_funding_rate_annual = 0.0

# [desk.auctions]             # on-chain RFQ channel (calls + puts)
# enabled = true
# poll_secs = 10
# initial_bid = "reserve_plus"
# max_concurrent_escrow = 5_000_000_000

# [desk.exits]
# enabled = true
# tick_secs = 300
# concession_volpts = 1.0     # resale accepts fair − 1 vol pt
# carry_mult = 1.1            # exercise when carry > time value × 1.1
# near_expiry_hours = 24.0
# max_slice = 1_000_000_000   # flash-exercise ladder chunk
# [desk.exits.spot_pools]     # UNDERLYING/SETTLEMENT pools for flash
# TSUI = "0x..."

# [desk.monitors]
# interval_secs = 60
# bleed_window_hours = 24.0
# stress_interval_secs = 86_400
# stress_max_drawdown = 0.25  # V2 gate

# [desk.v2]                   # two-sided maker — OFF until ungated
# enabled = false
# base_spread_volpts = 0.03
# vega_band_long = 0.005
# vega_band_short = 0.0015
# skew_k = -0.01              # negative: sell inventory when long
# write_cap_pct_nav = 3.0
# buy_cap_pct_nav = 5.0
# near_expiry_hours = 48.0
# near_expiry_spread_mult = 2.0
# near_expiry_size_mult = 0.5
# naked_vega_cap_nav_per_volpt = 0.001


# mm-bot config — prod env (testnet). The vol desk (SO-299).
#
# prod is a distinct testnet deployment from staging; this config mirrors
# config.staging.toml (minus the sim — prod gets no synthetic retail).
# Requires the options/prod/mm-bot secret (sui_key + quote_key). See
# config.toml for full knob documentation.

network            = "testnet"

quoting_url        = "ws://quoting:9002/"

signing_scheme     = "ed25519"

# --- Collateral routing chassis ----------------------------------------
# Unset: read from the deploy-bundle state file. Desk quotes route
# through the trading vault (vault_mm), not here.
# collateral_package = "0x..."
# collateral_account = "0x..."

# Derive mode (see staging).
settlement_symbol  = "TUSDC"

rate               = 0.0
quote_ttl_ms       = 30_000

roles = ["trader_mm", "writer_mm"]
bulk_view_enabled = true

bootstrap_settlement_amount = 1_000_000_000_000
bootstrap_underlying_amount = 100_000_000_000

underlying_replenish_threshold    = 20_000_000_000
underlying_replenish_amount       = 100_000_000_000
underlying_replenish_interval_secs = 60

# Live prices come from oracle-service (ORACLE_URL, set in compose).
[pyth]
max_price_age_ms       = 5_000
max_publish_lag_ms     = 10_000
max_conf_bps           = 0
vol_window_hours       = 24
vol_long_window_hours  = 168
vol_sample_interval_ms = 300_000
fallback_vol           = 0.6
[pyth.fallback_vols]
TBTC = 0.45
TWAL = 1.0

# ── The vol desk (SO-299) ───────────────────────────────────────────────
# OFF until a prod TradingVault is provisioned for the desk (vault +
# CuratorCap to this wallet + curator vault_mm toggle). Risk knobs
# default to the 00-plan starting parameters — see config.toml.
[desk]
enabled = false
# vault_id           = "0x..."
# mm_release_enabled = true

# Exchange resting-ask exits (SO-416): off until the prod desk is live.
[desk.listings]
enabled = false
# orderbook_url = "http://orderbook:9014"
# Hedge venues: omit for the single legacy paper venue; declare
# [[desk.hedge.venues]] entries (kind = "paper", name, slippage_bps,
# funding_rate_annual) for multi-venue monitoring — see config.toml.

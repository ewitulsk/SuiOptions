# mm-bot config — prod env (mainnet).
#
# WARNING: mm-bot's bootstrap step calls the test-token faucet to mint
# settlement. There is no faucet on mainnet, so booting this against
# mainnet will fail unless `bootstrap_settlement_amount` is zero AND the
# bootstrap code path is changed to skip the faucet call (or the Account
# is created + funded manually first by the bot's Sui key with its quote
# pubkey, so the on-chain lookup adopts it instead of bootstrapping).
#
# Until that's resolved, the mm-bot service should be commented out of
# docker-compose.prod.yml. The indexer + quoting-service deploy and run
# normally on mainnet; mm-bot is the only one that needs the faucet.

network            = "mainnet"

quoting_url        = "ws://quoting:9002/"

signing_scheme     = "ed25519"

# Replace these with the real mainnet pair(s) you intend to make markets on.
underlying_symbols = ["WBTC"]
settlement_symbol  = "USDC"

rate               = 0.05
quote_ttl_ms       = 30_000

ask_markup_bps     = 100
bid_markdown_bps   = 100

roles = ["trader_mm", "writer_mm"]

# Mainnet: no auto-bootstrap and no faucet-based replenish. Pre-fund the
# Account (settlement + underlying) out-of-band; keep these at 0 so the bot
# never reaches for a faucet that doesn't exist on mainnet.
bootstrap_settlement_amount = 0
bootstrap_underlying_amount = 0
underlying_replenish_threshold = 0

[pyth]
hermes_url             = "https://hermes.pyth.network"
benchmarks_url         = "https://benchmarks.pyth.network"
max_price_age_ms       = 5_000
max_publish_lag_ms     = 10_000
vol_window_hours       = 24
vol_sample_interval_ms = 60_000
bootstrap_samples      = 24
bootstrap_interval_secs = 3_600
fallback_vol           = 0.6

# DeepBook quoting — parity with staging (mm-bot is not in the prod compose
# yet; see the faucet warning above, this section is dormant until then).
[deepbook]
enabled             = true
quote_interval_secs = 30
max_quote_age_secs  = 120
requote_drift_bps   = 50
expiry_cutoff_secs  = 3600
order_lifetime_secs = 600
# Bid-side floor when quote_full_inventory is on.
quote_size          = 1_000_000
quote_full_inventory = true
# BM settlement top-up chunk, atomic (1,000 USDC).
tusdc_deposit_chunk = 1_000_000_000
gas_budget          = 200_000_000

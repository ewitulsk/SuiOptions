# mm-bot config — staging env (testnet).

network            = "testnet"

quoting_url        = "ws://quoting:9002/"

signing_scheme     = "ed25519"

# Derive mode: `underlying_symbols` left unset, so the bot makes markets in
# every enabled token-info token with a Pyth feed (currently TBTC, TWAL)
# and a watcher restarts the bot to pick up newly-listed underlyings. Pin an
# explicit `underlying_symbols = [...]` list to opt out of auto-pickup, or add
# `underlying_exclude = [...]` to skip specific tickers.
settlement_symbol  = "TUSDC"

rate               = 0.05
quote_ttl_ms       = 30_000

ask_markup_bps     = 100
bid_markdown_bps   = 100

roles = ["trader_mm", "writer_mm"]
bulk_view_enabled = true

bootstrap_settlement_amount = 1_000_000_000_000
bootstrap_underlying_amount = 100_000_000_000

underlying_replenish_threshold    = 20_000_000_000
underlying_replenish_amount       = 100_000_000_000
underlying_replenish_interval_secs = 60

# Live prices come from oracle-service (ORACLE_URL, set in compose). These
# only tune the consumer-side staleness guards + the rolling-vol sampler.
[pyth]
max_price_age_ms       = 5_000
max_publish_lag_ms     = 10_000
vol_window_hours       = 24
vol_sample_interval_ms = 60_000
fallback_vol           = 0.6

# DeepBook quoting (SO-158): rest two-sided limit orders on every tradeable
# bucket pool of the configured pair. The bot finds (or creates+registers)
# its BalanceManager on first run and logs the id — pin it here afterwards
# to skip the event scan at boot:
#   balance_manager_id = "0x…"
[deepbook]
enabled             = true
# SO-173: refresh on-chain quotes once a day, and place every pool's quotes in
# one (chunked) tx. order_lifetime matches the cadence, so a missed daily
# refresh simply lets the orders self-expire.
quote_interval_secs = 86_400
order_lifetime_secs = 86_400
max_pools_per_tx    = 12
max_quote_age_secs  = 120
requote_drift_bps   = 50
expiry_cutoff_secs  = 3600
# Per-side size in call-coin atomic units (8-dec TBTC calls: 0.01 / side).
# With quote_full_inventory on, this is the bid-side floor instead.
quote_size          = 1_000_000
# Demo mode: rest the bot's ENTIRE call-coin inventory as the ask, bid
# mirrored to the same quantity (floored at quote_size).
quote_full_inventory = true
# BM settlement top-up chunk, atomic (1,000 TUSDC).
tusdc_deposit_chunk = 1_000_000_000
gas_budget          = 200_000_000

# On-chain RFQ bidder (C2): the mm-bot is the intended counterparty for the
# vaults' on-chain RFQ auctions. Poll open auctions, price them with the same
# Black-Scholes brain, and bid from the wallet under the escrow cap. Without
# this the keeper's slices expire unsold every round. Tuning uses the struct
# defaults (poll 10s, ReservePlus, 300bps shade, 5,000-TUSDC escrow cap).
[onchain_rfq]
enabled = true

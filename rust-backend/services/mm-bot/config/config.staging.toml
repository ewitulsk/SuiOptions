# mm-bot config — staging env (testnet). The vol desk (SO-299).
#
# See config.toml for full knob documentation. Every legacy strategy
# section ([deepbook], [trading_vault], [onchain_rfq], [onchain_put_rfq],
# [onchain_swap], the spread/smile pricing knobs) died in the SO-299
# strategy reset.

network            = "testnet"

quoting_url        = "ws://quoting:9002/"

signing_scheme     = "ed25519"

# --- Collateral routing chassis ----------------------------------------
# Deliberately unset: the redeploy-contract workflow re-publishes
# mm_collateral after every core publish and the bot reads the resulting
# state file from the deploy-bundle mount (/run/mm-bot/collateral.testnet.toml
# — see collateral::state_path_candidates). Pin these only to override.
# NOTE: desk quotes route through the trading vault (vault_mm), not here.
# collateral_package = "0x..."
# collateral_account = "0x..."

# --- Quote signer ------------------------------------------------------
# This bot's existing QuoteSigner under the current deployment. Pinned
# because discovering it from SignerCreated events no longer works: the
# creating transaction is not servable by our RPC provider (SO-325), which
# left mm-bot unable to boot. The id is verified against chain state at
# startup — right package, right owner, right key — and ignored if it does
# not match, so this is a hint rather than something the bot trusts.
#
# Re-pin after a core republish, or drop the line to let the bot bootstrap
# a fresh signer.
quote_signer_id    = "0xadae1712d2efdf7cf7d7ce16e6bff32c937395e76732aca744d9763b148797dc"

# Derive mode: `underlying_symbols` left unset, so the bot makes markets in
# every enabled token-info token with a Pyth feed and a watcher restarts
# the bot to pick up newly-listed underlyings.
settlement_symbol  = "TUSDC"

rate               = 0.0
quote_ttl_ms       = 30_000

roles = ["trader_mm", "writer_mm"]
bulk_view_enabled = true

bootstrap_settlement_amount = 1_000_000_000_000
bootstrap_underlying_amount = 100_000_000_000

underlying_replenish_threshold    = 20_000_000_000
underlying_replenish_amount       = 100_000_000_000
underlying_replenish_interval_secs = 60

# Live prices come from oracle-service (ORACLE_URL, set in compose).
[pyth]
max_price_age_ms       = 5_000
max_publish_lag_ms     = 10_000
max_conf_bps           = 0
vol_window_hours       = 24
vol_long_window_hours  = 168
vol_sample_interval_ms = 300_000
fallback_vol           = 0.6
[pyth.fallback_vols]
TBTC = 0.45
TWAL = 1.0

# ── The vol desk (SO-299) ───────────────────────────────────────────────
# OFF until a staging TradingVault is provisioned for the desk: create the
# vault, hand its CuratorCap to this wallet, toggle the vault_mm release
# on as curator, then fill these in (all risk knobs default to the 00-plan
# starting parameters — see config.toml for the full list).
[desk]
enabled = true
vault_id           = "0x8da89c40ad922ca3447af60c2214f13a93860d04df3072646020d94ccc4fae49"
mm_release_enabled = true
# [desk.exits.spot_pools]     # spot pools for flash-exercise, per symbol
# TSUI = "0x..."
# Hedge venues: omit for the single legacy paper venue; declare
# [[desk.hedge.venues]] entries (kind = "paper", name, slippage_bps,
# funding_rate_annual) for multi-venue monitoring — see config.toml.
# Real venues (Bluefin) land behind the same HedgeVenue seam.
[[desk.hedge.venues]]
kind                = "paper"
name                = "paper"
slippage_bps        = 5
funding_rate_annual = 0.05

# ── Testnet counterparty sim (SO-299) ──────────────────────────────────
# Retail stand-in: opens covered-call RFQ auctions (the desk's auction
# channel is the intended bidder) + redeems expired wallet Positions.
[sim]
enabled = true

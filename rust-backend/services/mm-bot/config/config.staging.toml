# mm-bot config — staging env (testnet). The vol desk (SO-299).
#
# See config.toml for full knob documentation. Every legacy strategy
# section ([deepbook], [trading_vault], [onchain_rfq], [onchain_put_rfq],
# [onchain_swap], the spread/smile pricing knobs) died in the SO-299
# strategy reset.

network            = "testnet"

quoting_url        = "ws://quoting:9002/"

signing_scheme     = "ed25519"

# --- Collateral routing chassis ----------------------------------------
# Deliberately unset: the redeploy-contract workflow re-publishes
# mm_collateral after every core publish and the bot reads the resulting
# state file from the deploy-bundle mount (/run/mm-bot/collateral.testnet.toml
# — see collateral::state_path_candidates). Pin these only to override.
# NOTE: desk quotes route through the trading vault (vault_mm), not here.
# collateral_package = "0x..."
# collateral_account = "0x..."

# --- Quote signer ------------------------------------------------------
# Manual override only. The redeploy ceremony creates the QuoteSigner and
# records it as quoteSignerId in deployments.json, which the bot reads via
# token-info — no re-pinning needed after a republish. Any id (here or in
# deployments.json) is verified against chain state at startup — right
# package, right owner, right key — and ignored if it does not match.
#
# This pin covers the 2026-08-04 deployment, whose signer was bootstrapped
# by the bot itself (before the ceremony recorded ids); the SO-325 archival
# gap makes event re-discovery unreliable, hence the pin. Safe to drop
# after the next contract redeploy.
quote_signer_id    = "0x05e12bb47a76cd3ab4c83690da778f53769d10dd7ad63981969aaeff57708ad4"

# Derive mode: `underlying_symbols` left unset, so the bot makes markets in
# every enabled token-info token with a Pyth feed and a watcher restarts
# the bot to pick up newly-listed underlyings.
settlement_symbol  = "TUSDC"

rate               = 0.0
quote_ttl_ms       = 30_000

roles = ["trader_mm", "writer_mm"]
bulk_view_enabled = true

bootstrap_settlement_amount = 1_000_000_000_000
bootstrap_underlying_amount = 100_000_000_000

underlying_replenish_threshold    = 20_000_000_000
underlying_replenish_amount       = 100_000_000_000
underlying_replenish_interval_secs = 60

# Live prices come from oracle-service (ORACLE_URL, set in compose).
[pyth]
max_price_age_ms       = 5_000
max_publish_lag_ms     = 10_000
max_conf_bps           = 0
vol_window_hours       = 24
vol_long_window_hours  = 168
vol_sample_interval_ms = 300_000
fallback_vol           = 0.6
[pyth.fallback_vols]
TBTC = 0.45
TWAL = 1.0

# ── The vol desk (SO-299) ───────────────────────────────────────────────
# vault_id is deliberately UNSET on staging: a contract redeploy invalidates
# any pinned vault, and a stale pin used to leave the desk booting at NAV 0
# and declining every RFQ. With it empty the bot adopts a vault it created
# under the current deployment, or provisions one (SO-345). Pin it only to
# adopt a vault someone else created.
[desk]
enabled = true
# mm_release_enabled is now consent to flip the vault_mm release gate when
# the chain says it is off, not an attestation that it is on — chain state
# decides, and the bot holds its own CuratorCap.
mm_release_enabled = true
# [desk.exits.spot_pools]     # spot pools for flash-exercise, per symbol
# TSUI = "0x..."

# Self-provisioning: create a vault when there is none of ours to adopt.
# Funds the escrowed curator commitment with commitment_deposit ($100k
# TUSDC default) via deposit_into_commitment — the boot fails if the
# commitment can't be funded on a fresh vault, and the desk idles
# (healthy-but-idle, no rollback) if an adopted vault is risk-off.
#
# SO-420: the desk vault is TRANCHED (senior/junior, preferred-only
# senior upside). Takes effect on the next fresh provision — the desk
# keeps adopting its existing vault until a redeploy orphans it. The
# testnet seed lands all-junior; senior stays empty until someone
# deposits senior.
[desk.provision]
enabled = true
commitment_deposit = 100_000_000_000 # $100k at TUSDC's 6 decimals
structure_code             = 1     # senior/junior
senior_hurdle_bps_annual   = 1_000 # 10% annual senior hurdle
target_junior_bps          = 2_000 # 20% junior target
maintenance_junior_bps     = 1_000 # 10% maintenance floor
upside_code                = 0     # preferred-only senior
residual_participation_bps = 0
total_return_cap_bps       = 0
terms_version              = 1

# Exchange resting-ask exits (SO-416): list option inventory as asks on
# the in-house exchange; the matching engine executes the resales.
[desk.listings]
enabled       = true
orderbook_url = "http://orderbook:9014"

# Hedge venues: omit for the single legacy paper venue; declare
# [[desk.hedge.venues]] entries (kind = "paper", name, slippage_bps,
# funding_rate_annual) for multi-venue monitoring — see config.toml.
# Real venues (Bluefin) land behind the same HedgeVenue seam.
# Bid-side hedge cost inputs (doc 08 §4.3 / doc 09 G2, SO-437). Bluefin
# taker 3.5 bp + 0.03 USDC flat (doc 07 §6.1); ~137 rebalance fills/yr per
# unit of initial notional at 20% bands (doc 07 §5: 11.3× per 30d turn);
# 5%/yr financing on the 10% initial margin the hedge parks.
[desk.hedge]
taker_fee_bps                = 3.5
fixed_fee_per_fill           = 30_000      # 0.03 TUSDC at 6 decimals
rebalance_turnover_per_year  = 137.0
margin_financing_rate_annual = 0.05
initial_margin_fraction      = 0.10

[[desk.hedge.venues]]
kind                = "paper"
name                = "paper"
slippage_bps        = 3.5                  # doc 07 §6.1: taker 3.5 bp + spread
funding_rate_annual = 0.05

# ── Testnet counterparty sim (SO-299) ──────────────────────────────────
# Retail stand-in: redeems expired wallet Positions + faucet funding.
# (Its RFQ-auction opener is retired with the options_rfq package and
# idles now that token-info carries no rfq id.)
[sim]
enabled = true

# ── Testnet faucet behaviour (SO-345) ──────────────────────────────────
# Seed a vault the desk provisions with $1M TUSDC (1e12 raw at 6 decimals)
# so it can quote immediately. Only fires on the create path — adopting an
# existing vault never mints. Loading this section on a non-testnet
# network is a hard error.
[testnet]
mint_and_deposit_liquidity = true
mint_and_deposit_amount    = 1_000_000_000_000

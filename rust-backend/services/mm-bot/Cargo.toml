[package]
name = "mm-bot"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mm-bot"
path = "src/main.rs"

[dependencies]
protocol-types = { workspace = true }
runtime-config = { workspace = true }
observability  = { workspace = true }
cli-spec       = { workspace = true }
sui-tx         = { workspace = true }
pyth-client    = { workspace = true }
oracle-client  = { workspace = true }
pricing        = { workspace = true }
token-info-client = { workspace = true }
api-service-client = { workspace = true }
indexer-graphql = { workspace = true }
move-publish   = { workspace = true }

# Sui SDK (used directly for derive token recipient from secret key).
sui-types = { workspace = true }
# Live RfqAuction object reads for the on-chain bidder (C2).
# StructTag for the swap-auction event filter (onchain_swap discovery).
move-core-types = { workspace = true }
# Async / WS
tokio = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
bcs = { workspace = true }
async-trait = { workspace = true }

ed25519-dalek = { workspace = true }
hex = { workspace = true }

clap = { workspace = true }
config = { version = "0.14", features = ["toml"] }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }

# Pyth wiring
reqwest = { workspace = true }
parking_lot = { workspace = true }

[package]
name = "mm-bot"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mm-bot"
path = "src/main.rs"

[dependencies]
protocol-types = { workspace = true }
runtime-config = { workspace = true }
observability  = { workspace = true, features = ["axum"] }
cli-spec       = { workspace = true }
sui-tx         = { workspace = true }
pyth-client    = { workspace = true }
oracle-client  = { workspace = true }
pricing        = { workspace = true }
vol-forecast   = { workspace = true }
token-info-client = { workspace = true }
api-service-client = { workspace = true }
indexer-graphql = { workspace = true }
move-publish   = { workspace = true }

# Exchange listings (SO-416): the desk rests asks on the in-house exchange.
exchange-types   = { workspace = true }
exchange-signing = { workspace = true }
base64           = { workspace = true }
thiserror        = { workspace = true }

# Sui SDK (used directly for derive token recipient from secret key).
sui-types = { workspace = true }
# Live RfqAuction object reads for the on-chain bidder (C2).
# StructTag for the swap-auction event filter (onchain_swap discovery).
move-core-types = { workspace = true }
# Async / WS
tokio = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
bcs = { workspace = true }
async-trait = { workspace = true }

ed25519-dalek = { workspace = true }
hex = { workspace = true }

clap = { workspace = true }
config = { version = "0.14", features = ["toml"] }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }

# Pyth wiring
reqwest = { workspace = true }
parking_lot = { workspace = true }

# Desk state API (SO-348): /health + /metrics + /desk/state.
axum = { workspace = true }
tower-http = { workspace = true }

# Desk history on TimescaleDB (SO-349).
diesel = { workspace = true }
diesel_migrations = { workspace = true }

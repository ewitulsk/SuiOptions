# Quoting service config.
#
# The service holds no funds and signs no transactions — it routes RFQs
# between retail clients and market makers, and tracks reservations against
# the indexer's on-chain balance view.

bind_addr            = "127.0.0.1:9002"
indexer_url          = "ws://127.0.0.1:9001/"

# Window during which the service collects MM quotes for one retail RFQ
# before responding. Spec default is 2s; tighten in latency-sensitive setups.
rfq_window_ms        = 2000

# WS keep-alive cadence.
ping_interval_secs   = 15

# Which slot in `deployments.json` to resolve `protocol_id` from. The
# service derives the domain separator (the AdminCap object id) from the
# deployment, exactly as the contract and mm-bot do, so a redeploy doesn't
# require editing this file. One of: mainnet / testnet / devnet.
network              = "testnet"

# Path to `deployments.json`. Relative paths resolve from the working
# directory; running from `rust-backend/` matches the default.
# deployments_path   = "deployments.json"

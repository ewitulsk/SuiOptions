# Quoting service config — prod env (mainnet).

bind_addr                       = "0.0.0.0:9002"
indexer_url                     = "ws://indexer:9001/"
rfq_window_ms                   = 2000
ping_interval_secs              = 15
# Resolve protocol_id (the AdminCap object id) from deployments.json,
# matching the contract and mm-bot. Requires a populated `mainnet` slot in
# deployments.json — the service refuses to boot without it, same as the
# indexer.
network                         = "mainnet"
max_inflight_rfqs_per_session   = 16
max_inflight_rfqs_global        = 256

# market-sim secrets — copy to `secrets.toml` and fill in the wallet key.
# `secrets*.toml` is gitignored. In deployed envs this file is rendered by
# render-secrets.sh from AWS Secrets Manager (options/<env>/market-sim).
#
# A dedicated wallet (NOT mm-bot's): needs testnet SUI for gas and vendored
# DEEP for any spot pool it must create (500 DEEP each, no faucet — transfer
# from the deployer wallet). Everything else it faucet-mints itself.

[sui]
testnet = "suiprivkey1..."

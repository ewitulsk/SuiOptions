# market-sim config — staging env (testnet).
#
# The DeepBook spot-liquidity simulator: faucet-funded bid/ask bands around
# the Pyth cross on the pairs below. token-info / oracle-service URLs come
# from the TOKEN_INFO_URL / ORACLE_URL env vars (compose).

environment = "staging"
network     = "testnet"

health_addr = "0.0.0.0:9018"

enabled = true

# Every faucet token against the settlement asset. Pools are created lazily
# (500 vendored DEEP each from the service wallet — see the SO-302 runbook).
spot_pairs = ["TBTC/TUSDC", "TSUI/TUSDC", "TWAL/TUSDC"]

# Re-quote twice a day. The sim is a fill target, not a live market maker, so
# a stable book is fine and this keeps gas burn to a trickle (each pass places
# real orders on every pool). Order expiry tracks this interval (see sim.rs),
# so the book stays resting the whole 12h between passes.
spot_interval_secs     = 43200
spot_band_bps          = 200
spot_notional_per_side = 100000000

# Created at boot and logged on first run — pin the logged id here so
# restarts reuse it instead of minting a new BalanceManager.
# UN-PINNED 2026-07-26: the service wallet moved to the shared staging deployer
# key (0xab8d), but a BalanceManager's owner is fixed at creation and the old
# BM (0x8eb2d599…) is owned by the retired sim wallet (0x178f7355) — its
# generate_proof_as_owner would abort EInvalidOwner. Boot mints a fresh BM
# owned by the deployer; re-pin its logged id in a follow-up pass.
# spot_balance_manager_id = "0x8eb2d599a5de9458823a550fe045938a27b2f3f1da064e197037a08b0d9a53fd"

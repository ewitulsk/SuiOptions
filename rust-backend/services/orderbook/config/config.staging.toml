# Orderbook service config — staging env (Sui testnet).
#
# Markets and the exchange package id come from deployments.json (`exchange`
# block, written by `deployment-manager --deploy-exchange`); the relayer key
# and endpoint overrides from the rendered secrets file.

network      = "testnet"
env          = "staging"
deployments  = "/app/deployments.json"

database_url = "postgresql://orderbook_staging:${DB_PASSWORD}@${DB_HOST}:5432/orderbook_staging"
db_pool_size = 16

bind         = "0.0.0.0:9014"

# gas budget per match_orders settlement, in MIST
gas_budget   = 50000000

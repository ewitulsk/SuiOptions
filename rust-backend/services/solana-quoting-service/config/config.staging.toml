# Solana quoting service config — staging env.

bind_addr                       = "0.0.0.0:9002"
indexer_graphql_url             = "http://solana-indexer:9002/graphql"
rfq_window_ms                   = 2000
bulk_view_cache_ttl_ms          = 30000
ping_interval_secs              = 15
# solana-token-info public API over the compose-internal network. The
# protocol_id domain separator (the options_core Config PDA) is fetched from
# here at boot, matching the program and solana-mm-bot.
token_info_url                  = "http://solana-token-info:9005"
max_inflight_rfqs_per_session   = 16
max_inflight_rfqs_global        = 256

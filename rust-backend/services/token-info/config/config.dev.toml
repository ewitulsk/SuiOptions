# token-info config — dev env (devnet).
#
# `database_url` is templated by deploy.sh against the Terraform RDS
# (DB_PASSWORD / DB_HOST injected at deploy time, expanded by config_load).
# The internal port is bound on all interfaces but is NOT proxied by nginx,
# so it stays reachable only inside the docker network / over the VPN.

environment        = "dev"
network            = "devnet"
deployments_path   = "/app/deployments.json"

database_url       = "postgresql://token_info_dev:${DB_PASSWORD}@${DB_HOST}:5432/token_info_dev"
db_pool_size       = 8

public_bind_addr   = "0.0.0.0:9005"
internal_bind_addr = "0.0.0.0:9006"

allowed_origins    = ["*"]

# auth-service internal verify route (compose-internal) — gates the public
# mutate endpoints.
auth_service_url   = "http://auth-service:9008"

# Display metadata for the dev test-token overlay. Keyed by ticker.
[seed_meta.TBTC]
name     = "Test Bitcoin"
logo_uri = "https://assets.coingecko.com/coins/images/1/small/bitcoin.png"
[seed_meta.TUSDC]
name     = "Test USDC"
logo_uri = "https://assets.coingecko.com/coins/images/6319/small/usdc.png"
[seed_meta.TWAL]
name = "Test Walrus"
[seed_meta.TDEEP]
name = "Test DeepBook"

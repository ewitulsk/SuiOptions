# token-info config — prod env (mainnet).
#
# prod serves the DB catalog only (no test-token overlay). The mainnet catalog
# is populated via the internal mutate API. deployments.json still supplies
# package_info.

environment        = "prod"
network            = "mainnet"
deployments_path   = "/app/deployments.json"

database_url       = "postgresql://token_info_prod:${DB_PASSWORD}@${DB_HOST}:5432/token_info_prod"
db_pool_size       = 8

public_bind_addr   = "0.0.0.0:9005"
internal_bind_addr = "0.0.0.0:9006"

allowed_origins    = ["*"]

# auth-service internal verify route (compose-internal) — gates the public
# mutate endpoints.
auth_service_url   = "http://auth-service:9008"

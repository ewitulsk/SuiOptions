# token-info config — prod env (Sui testnet).
#
# prod is a distinct testnet deployment (its own published package, separate
# from staging). package_info comes from the `prod` slot in deployments.json;
# because the network is testnet, the test-token overlay is folded into
# `/tokens` just like staging.

environment        = "prod"
network            = "testnet"
deployments_path   = "/app/deployments.json"

database_url       = "postgresql://token_info_prod:${DB_PASSWORD}@${DB_HOST}:5432/token_info_prod"
db_pool_size       = 8

public_bind_addr   = "0.0.0.0:9005"
internal_bind_addr = "0.0.0.0:9006"

allowed_origins    = ["*"]

# auth-service internal verify route (compose-internal) — gates the public
# mutate endpoints.
auth_service_url   = "http://auth-service:9008"

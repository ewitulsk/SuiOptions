# token-info config — staging env (testnet).

environment        = "staging"
network            = "testnet"
deployments_path   = "/app/deployments.json"

database_url       = "postgresql://token_info_staging:${DB_PASSWORD}@${DB_HOST}:5432/token_info_staging"
db_pool_size       = 8

public_bind_addr   = "0.0.0.0:9005"
internal_bind_addr = "0.0.0.0:9006"

allowed_origins    = ["*"]

# auth-service internal verify route (compose-internal) — gates the public
# mutate endpoints.
auth_service_url   = "http://auth-service:9008"


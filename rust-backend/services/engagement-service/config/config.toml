# engagement-service config (local dev).
#
# Tracks engagement on tweets mentioning our account (via twitter-service)
# and serves the airdrop leaderboard. Point database_url at any Postgres.

environment = "dev"

bind_addr   = "127.0.0.1:9017"

database_url = "${ENGAGEMENT_DATABASE_URL}"
db_pool_size = 4

twitter_service_url = "http://127.0.0.1:9014"
# twitter-service account name (= the @handle whose mentions accrue points).
twitter_account     = "suioptions"

poll_interval_secs    = 300
refresh_max_age_hours = 168

[points]
# engagement_points = likes*1 + replies*2 + retweets*3 + quotes*4
like_weight    = 1.0
reply_weight   = 2.0
retweet_weight = 3.0
quote_weight   = 4.0

# airdrop_points = engagement_points * rate * (ambassador ? multiplier : 1)
airdrop_points_per_engagement_point = 10.0
ambassador_multiplier               = 1.5
# Ambassador twitter handles (without @, case-insensitive).
ambassadors = []

# solana-oracle-service config — local dev defaults.
#
# BETA hermes — the solana-token-info catalog carries the beta feed id set
# (devnet parity with the Sui stack's testnet posture). Benchmarks is
# stable-only; beta→stable mapping is applied service-side per request.

environment    = "dev"
bind_addr      = "127.0.0.1:9013"
token_info_url = "http://127.0.0.1:9005"
hermes_url     = "https://hermes-beta.pyth.network"
benchmarks_url = "https://benchmarks.pyth.network"

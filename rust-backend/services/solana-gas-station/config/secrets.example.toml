# solana-gas-station secrets — copy to `secrets.toml` and fill in the
# station key. `secrets*.toml` is gitignored. In deployed envs this file
# is rendered by render-secrets.sh from AWS Secrets Manager
# (options/<env>/solana-gas-station + the shared options/<env>/solana-rpc
# override).
#
# The station (fee payer + faucet mint authority) keypair: either the
# base58-encoded 64-byte secret‖public keypair, or the Solana-CLI JSON
# byte array (`[12, 34, …]`). The slot must match `network` in config.

[solana]
devnet = "base58-64-byte-keypair-or-json-array..."
# testnet = "..."
# mainnet = "..."
# default = "..."

# Optional operator RPC override (keyed Helius URL). Falls back to the
# public cluster endpoint when absent.
# rpc_url = "https://devnet.helius-rpc.com/?api-key=..."

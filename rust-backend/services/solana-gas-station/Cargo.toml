# Standalone workspace, deliberately NOT a member of the rust-backend
# workspace: the Sui crates there are pinned to the framework/mainnet git
# branch, while this service needs the Solana SDK version tree (same
# pattern as services/solana-indexer and crates/solana-tx). The shared
# runtime-config / observability / solana-token-info-client crates are
# pulled in by path — their `workspace = true` deps resolve against
# rust-backend/Cargo.toml; the program crates' against
# solana-contracts/Cargo.toml (anchor-lang 1.1.2).
[workspace]

[package]
name = "solana-gas-station"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "solana-gas-station"
path = "src/main.rs"

[dependencies]
runtime-config           = { path = "../../crates/runtime-config" }
observability            = { path = "../../crates/observability", features = ["axum"] }
solana-tx                = { path = "../../crates/solana-tx" }
solana-token-info-client = { path = "../../crates/solana-token-info-client" }

# The deployed programs themselves: instruction types carry the 8-byte
# Anchor discriminators the template matcher pins — zero drift with what's
# on chain (same reason solana-tx deps them).
options_core  = { path = "../../../solana-contracts/programs/options_core", features = ["no-entrypoint"] }
auction_venue = { path = "../../../solana-contracts/programs/auction_venue", features = ["no-entrypoint"] }
options_vault = { path = "../../../solana-contracts/programs/options_vault", features = ["no-entrypoint"] }

# Pinned to the solana-contracts tree (anchor-lang 1.1.2 → solana v3
# crates), matching crates/solana-tx.
anchor-lang = "1.1.2"
anchor-spl  = "1.1.2"

solana-sdk     = { version = "3.0", features = ["full"] }
solana-client  = "3.1"
solana-sdk-ids = "3.1"

# Solana's wire encoding for transactions (VersionedTransaction).
bincode = "1.3"
base64  = "0.22"
bs58    = "0.5"

tokio = { version = "1", features = ["full"] }

axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4", features = ["derive"] }

anyhow = "1"

tracing = "0.1"
metrics = "0.24"

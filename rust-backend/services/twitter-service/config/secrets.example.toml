# twitter-service secrets — copy to `secrets.toml` and fill in one
# [accounts.<name>] section per Twitter/X account. `secrets*.toml` is
# gitignored. In deployed envs this file is rendered by render-secrets.sh
# from AWS Secrets Manager (options/<env>/twitter-service).
#
# Credentials are the OAuth 1.0a user-context set from the Twitter developer
# portal (the app must have Read and Write permission; regenerate the access
# token after changing permissions).

[accounts.suioptions]
api_key             = "..."
api_key_secret      = "..."
access_token        = "..."
access_token_secret = "..."

# [accounts.another]
# api_key             = "..."
# api_key_secret      = "..."
# access_token        = "..."
# access_token_secret = "..."

# Indexer config for Sui testnet.
#
# The package id is NOT in this file — it's fetched at startup from the
# token-info service. A redeploy only requires updating token-info.

network                 = "testnet"
token_info_url          = "http://127.0.0.1:9005"
remote_store_url        = "https://checkpoints.testnet.sui.io"
concurrency             = 5
graphql_addr            = "127.0.0.1:9002"

# Local dev: scope CORS to the Vite dev server and serve the GraphiQL playground.
allowed_origins         = ["http://localhost:5173", "http://127.0.0.1:5173"]
expose_playground       = true

# Postgres persistence. The docker-compose at services/indexer/docker-compose.yml
# stands up a matching DB on port 7654. Migrations are embedded in the binary
# and run on boot.
database_url            = "postgresql://postgres:postgres@localhost:7654/indexer"
db_pool_size            = 8

# Checkpoint to start ingesting from. Leave commented out to tail from the
# current tip (the indexer asks `sui_getLatestCheckpointSequenceNumber` at
# boot). Set to a specific number to backfill from there — `0` is genesis.
# Sits just before the SO-55 contract republish so a freshly-wiped local
# DB picks up the new package's BucketCreated / AccountCreated events
# from inception. Pre-republish events use a Move struct without
# strike_scale and would fail to parse against current protocol-types.
# Only consulted when `indexer_progress` is empty (i.e. on a fresh DB).
start_checkpoint = 343702757

# Optional JSON-RPC override for the latest-checkpoint lookup. Defaults to
# Sui's public fullnode for `network` (mainnet/testnet/devnet). Only used
# when `start_checkpoint` is unset.
# rpc_url = "https://your-fullnode.example.com:443"

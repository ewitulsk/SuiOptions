# Indexer config — dev env (Sui devnet).
#
# `${DB_PASSWORD}` is interpolated from process env at boot (rendered by
# the deploy script from Secrets Manager). The host portion of
# `database_url` is templated by `deploy.sh` against the Terraform RDS
# output, then committed back by `terraform output` — see deployment.md §6.

network                 = "devnet"
token_info_url          = "http://token-info:9005"
remote_store_url        = "https://checkpoints.devnet.sui.io"
concurrency             = 5
fanout_addr             = "0.0.0.0:9001"
heartbeat_interval_secs = 5

database_url            = "postgresql://indexer_dev:${DB_PASSWORD}@${DB_HOST}:5432/indexer_dev"
db_pool_size            = 8
recent_log_capacity     = 1024

# Tail from current tip on first boot.

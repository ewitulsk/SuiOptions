# Indexer config — staging env (Sui testnet).

network                 = "testnet"
deployments_path        = "/app/deployments.json"
remote_store_url        = "https://checkpoints.testnet.sui.io"
concurrency             = 5
fanout_addr             = "0.0.0.0:9001"
heartbeat_interval_secs = 5

database_url            = "postgresql://indexer_staging:${DB_PASSWORD}@${DB_HOST}:5432/indexer_staging"
db_pool_size            = 8
recent_log_capacity     = 1024

# Backfill from just before the SO-55 contract republish so we capture
# the new package's BucketCreated/AccountCreated events from inception.
# Only consulted when `indexer_progress` is empty (i.e. on a fresh DB).
start_checkpoint = 340804360

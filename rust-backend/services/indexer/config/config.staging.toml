# Indexer config — staging env (Sui testnet).

network                 = "testnet"
token_info_url          = "http://token-info:9005"
remote_store_url        = "https://checkpoints.testnet.sui.io"
# 25 (SO-430): the remote store times out per-request; at 5 the indexer
# ingested slower than the chain produced (1.8 vs 3.3 cp/s) and fell 78k
# checkpoints behind. Fetches are latency-bound — overlap them.
concurrency             = 25
graphql_addr            = "0.0.0.0:9002"

# GraphQL is publicly routed via nginx (/staging/indexer/graphql). `["*"]`
# matches the other public services; scope to explicit origins to tighten.
allowed_origins         = ["*"]
expose_playground       = true

database_url            = "postgresql://indexer_staging:${DB_PASSWORD}@${DB_HOST}:25060/indexer_staging?sslmode=require"
db_pool_size            = 8

# Auto-set by redeploy-contract workflow.
start_checkpoint = 374858519

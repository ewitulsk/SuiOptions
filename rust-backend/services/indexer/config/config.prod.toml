# Indexer config — prod env (Sui testnet).

network                 = "testnet"
token_info_url          = "http://token-info:9005"
remote_store_url        = "https://checkpoints.testnet.sui.io"
concurrency             = 5
graphql_addr            = "0.0.0.0:9002"

# GraphQL is publicly routed via nginx (/prod/indexer/graphql). `["*"]`
# matches the other public services; scope to explicit origins to tighten.
allowed_origins         = ["*"]
expose_playground       = true

database_url            = "postgresql://indexer_prod:${DB_PASSWORD}@${DB_HOST}:5432/indexer_prod"
db_pool_size            = 8

# Tail from current tip on first boot. The redeploy-contract workflow
# overwrites this with the publish checkpoint when prod is (re)deployed.

# Auto-set by redeploy-contract workflow.
start_checkpoint = 345862884

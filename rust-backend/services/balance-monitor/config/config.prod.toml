# balance-monitor config — prod env (testnet, same as staging for now).

environment = "prod"
network     = "testnet"
ops_addr    = "0.0.0.0:9012"

poll_interval_secs = 60

[[watch]]
name = "gas-station"
secrets_file = "/run/secrets/gas-station.toml"
low_balance_sui = 5.0

[[watch]]
name = "deployer"
secrets_file = "/run/secrets/deployer.toml"
low_balance_sui = 2.0

# mm-bot is optional in prod (render-secrets.sh skips absent secrets); the
# watch is skipped with a warning when the file isn't rendered.
[[watch]]
name = "mm-bot"
secrets_file = "/run/secrets/mm-bot.toml"
low_balance_sui = 2.0

# ── Protocol watches (SO-387) ───────────────────────────────────────────
# Admin-change watch enabled via TOKEN_INFO_URL in the compose env.
# Drain watches: see config.staging.toml for the shape and the top-level-
# field limitation; seed the current roll's buckets after each redeploy.

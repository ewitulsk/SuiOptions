[package]
name = "solana-token-info"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "solana-token-info"
path = "src/main.rs"

[dependencies]
runtime-config           = { workspace = true }
observability            = { workspace = true, features = ["axum"] }
cli-spec                 = { workspace = true }
solana-deployments       = { workspace = true }
solana-token-info-client = { workspace = true }
auth-client              = { workspace = true }

config = { version = "0.14", features = ["toml"] }
clap = { workspace = true }
chrono = { workspace = true }

tokio = { workspace = true }

axum = { workspace = true }
tower-http = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }

# Postgres persistence (catalog).
diesel = { workspace = true }
diesel_migrations = { workspace = true }
r2d2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

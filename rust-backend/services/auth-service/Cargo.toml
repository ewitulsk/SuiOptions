[package]
name = "auth-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "auth-service"
path = "src/main.rs"

[dependencies]
runtime-config = { workspace = true }
observability  = { workspace = true, features = ["axum"] }
cli-spec       = { workspace = true }
protocol-types = { workspace = true }
# On-chain AdminCap login fallback (SO-422): package id via token-info,
# ownership via a Sui GraphQL owned-objects query.
token-info-client = { workspace = true }
reqwest = { workspace = true }

# Local verification of every Sui signature scheme incl. zkLogin (SO-423):
# the validator-grade GenericSignature::verify_authenticator path.
sui-types = { workspace = true }
shared-crypto = { workspace = true }
fastcrypto-zkp = { workspace = true }
im = { workspace = true }

config = { version = "0.14", features = ["toml"] }
clap = { workspace = true }
chrono = { workspace = true }

tokio = { workspace = true }

axum = { workspace = true }
tower-http = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

thiserror = { workspace = true }
anyhow = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }

# Challenge nonce store.
dashmap = { workspace = true }
rand = { workspace = true }

# Sui personal-message digest + signature decoding, HS256 JWT signing.
blake2 = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }

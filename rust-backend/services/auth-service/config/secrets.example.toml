# auth-service secrets — copy to `secrets.toml` and fill in a real secret.
# `secrets.toml` is gitignored (the workspace ignores `secrets*.toml`); this
# example is committed. Override the path with `--secrets <path>`.
#
# In deployed envs this file is rendered to /run/secrets/auth-service.toml by
# render-secrets.sh from AWS Secrets Manager (options/<env>/auth-service).

[auth]
# HMAC-SHA256 secret used to sign + verify admin JWTs. Use a long, random
# value (e.g. `openssl rand -hex 32`). auth-service is the ONLY holder.
jwt_secret = "replace-with-a-long-random-secret"

# cctp-relay — prod. NOTE: prod runs the same testnet networks as staging
# (prod is a distinct testnet deployment); flip the [sui]/[solana] blocks and
# iris_base_url to the mainnet values below when a real mainnet instance is
# provisioned.
#
# Mainnet values (for that future flip):
#   iris_base_url                  = "https://iris-api.circle.com"
#   sui.network                    = "mainnet"
#   message_transmitter_package    = "0x08d87d37ba49e785dde270a83f8e979605b03dc552b5548f26fdf2f49bf7ed1b"
#   token_messenger_minter_package = "0x2aa6c5d56376c371f88a6cc42e852824994993cb9bab8d3e6450cbe3cb32b94e"
#   message_transmitter_state      = "0xf68268c3d9b1df3215f2439400c1c4ea08ac4ef4bb7d6f3ca6a2a239e17510af"
#   token_messenger_minter_state   = "0x45993eecc0382f37419864992c12faee2238f5cfe22b98ad3bf455baf65c8a2f"
#   usdc_treasury                  = "0x57d6725e7a8b49a7b2a612f6bd66ab5f39fc95332ca48be421c3229d514a6de7"
#   usdc_coin_type                 = "0xdba34672e30cb065b1f93e3ab55318768fd6fef66c15942c9f7cb846e2f900e7::usdc::USDC"
#   solana.network                 = "mainnet"

# cctp-relay — staging (Sui Testnet <-> Solana Devnet, Circle sandbox iris).

environment = "staging"
bind_addr   = "0.0.0.0:9015"

database_url = "postgresql://cctp_relay_staging:${DB_PASSWORD}@${DB_HOST}:5432/cctp_relay_staging"
db_pool_size = 4

iris_base_url = "https://iris-api-sandbox.circle.com"

poll_interval_secs  = 10
relay_interval_secs = 10
max_mint_attempts   = 5

allowed_origins = ["*"]

[sui]
network                        = "testnet"
message_transmitter_package    = "0x4931e06dce648b3931f890035bd196920770e913e43e45990b383f6486fdd0a5"

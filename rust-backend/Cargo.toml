[workspace]
resolver = "2"
members = [
    "crates/protocol-types",
    "crates/runtime-config",
    "crates/cli-spec",
    "crates/pyth-client",
    "crates/sui-tx",
    "crates/pricing",
    "crates/vol-forecast",
    "crates/deployments",
    "crates/token-info-client",
    "crates/oracle-client",
    "crates/api-service-client",
    "crates/indexer-graphql",
    "crates/move-publish",
    "crates/auth-client",
    "crates/switchboard-client",
    "crates/observability",
    "crates/exchange-types",
    "crates/exchange-signing",
    "crates/exchange-book",
    "crates/exchange-router",
    "crates/backtester",
    "services/indexer",
    "services/keeper",
    "services/quoting-service",
    "services/mm-bot",
    "services/api-service",
    "services/token-info",
    "services/auth-service",
    "services/gas-station",
    "services/hedge-signer",
    "services/market-sim",
    "services/price-charting",
    "services/cctp-relay",
    "services/balance-monitor",
    "services/oracle-service",
    "services/twitter-service",
    "services/social-bot",
    "services/orderbook",
    "services/staging-mm-bot",
    "tools/deployment-manager",
    "tools/exchange",
    "tools/writer",
    "tools/trader",
    "tools/rfq-monitor",
    "tools/control-panel",
    "tools/mm-quote",
    "tools/deepbook-pool-test",
    "tools/trading-vault-smoke",
    "tools/trading-vault-close",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
protocol-types = { path = "crates/protocol-types" }
runtime-config = { path = "crates/runtime-config" }
cli-spec       = { path = "crates/cli-spec" }
pyth-client    = { path = "crates/pyth-client" }
sui-tx         = { path = "crates/sui-tx" }
pricing        = { path = "crates/pricing" }
vol-forecast   = { path = "crates/vol-forecast" }
deployments    = { path = "crates/deployments" }
token-info-client = { path = "crates/token-info-client" }
oracle-client  = { path = "crates/oracle-client" }
api-service-client = { path = "crates/api-service-client" }
indexer-graphql = { path = "crates/indexer-graphql" }
move-publish   = { path = "crates/move-publish" }
auth-client    = { path = "crates/auth-client" }
switchboard-client = { path = "crates/switchboard-client" }
observability  = { path = "crates/observability" }
# Hybrid exchange (SO: contracts/exchange + services/orderbook). The four
# shared crates carry no Sui-SDK deps: types/signing are the consensus-
# critical mirror of the Move package, book/router are pure engines.
exchange-types   = { path = "crates/exchange-types" }
exchange-signing = { path = "crates/exchange-signing" }
exchange-book    = { path = "crates/exchange-book" }
exchange-router  = { path = "crates/exchange-router" }

# Pinned to match sui-keys's exact requirement on the framework/mainnet branch.
tokio = { version = "=1.49.0", features = ["full"] }
tokio-tungstenite = { version = "0.24" }
futures = "0.3"
object_store = { version = "0.12", features = ["aws"] }
arrow = "56"
parquet = { version = "56", features = ["arrow", "zstd"] }
futures-util = "0.3"
async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcs = "0.1"

toml = "0.8"

ed25519-dalek = { version = "2", features = ["rand_core"] }
# hedge-signer: FROST 2-of-2 threshold-ed25519 (ZF frost project). Pinned
# exactly — key-share and ceremony wire formats must not drift under us.
frost-ed25519 = "=3.0.0"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
# auth-service: HS256 JWT signing (hmac+sha2), Sui personal-message digest
# (blake2b-256), and base64 (de)coding of wallet signatures.
hmac = "0.12"
blake2 = "0.10"
base64 = "0.22"

thiserror = "1"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Observability (SO-180): Prometheus metrics + OpenTelemetry traces (Tempo).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
metrics-process = "2"
opentelemetry = "0.30"
opentelemetry_sdk = "0.30"
# OTLP over HTTP (Tempo :4318) — no tonic, avoids gRPC version clashes with
# the pinned Sui crates.
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
opentelemetry-http = "0.30"
tracing-opentelemetry = "0.31"

dashmap = "6"
uuid = { version = "1", features = ["v4"] }
url = "2"
parking_lot = "0.12"

# HTTP client (Pyth Hermes + Benchmarks).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Sui Rust crates. Pinned to the framework/mainnet branch — same code path
# the production Sui mainnet validators run. Every binary in the workspace
# resolves to a single ABI by going through this list.
sui-types = { git = "https://github.com/mystenlabs/sui", package = "sui-types", branch = "framework/mainnet" }
sui-keys = { git = "https://github.com/mystenlabs/sui", package = "sui-keys", branch = "framework/mainnet" }
sui-move-build = { git = "https://github.com/mystenlabs/sui", package = "sui-move-build", branch = "framework/mainnet" }
sui-json = { git = "https://github.com/mystenlabs/sui", package = "sui-json", branch = "framework/mainnet" }
sui-transaction-builder = { git = "https://github.com/mystenlabs/sui", package = "sui-transaction-builder", branch = "framework/mainnet" }
sui-data-ingestion-core = { git = "https://github.com/mystenlabs/sui", package = "sui-data-ingestion-core", branch = "framework/mainnet" }
shared-crypto = { git = "https://github.com/mystenlabs/sui", package = "shared-crypto", branch = "framework/mainnet" }
sui-package-alt = { git = "https://github.com/mystenlabs/sui", package = "sui-package-alt", branch = "framework/mainnet" }
move-core-types = { git = "https://github.com/mystenlabs/sui", package = "move-core-types", branch = "framework/mainnet" }
# zkLogin types (JwkId/JWK/ZkLoginEnv) for auth-service's local signature
# verification (SO-423). MUST stay on the exact rev sui-types pins (see
# Cargo.lock) — a divergent rev is a loud compile error, not silent drift.
fastcrypto-zkp = { git = "https://github.com/MystenLabs/fastcrypto", rev = "5f87e04bb21d295ef6b39375a06615d45cbb906c" }
# VerifyParams carries its JWK map as an im::HashMap; pinned loosely —
# Cargo unifies with sui-types'.
im = "15"
# gRPC chain access (replaces the deactivated JSON-RPC). Same pin as the
# crates above, so the proto types convert to/from `sui-types` for free.
sui-rpc-api = { git = "https://github.com/mystenlabs/sui", package = "sui-rpc-api", branch = "framework/mainnet" }
sui-rpc = { git = "https://github.com/MystenLabs/sui-rust-sdk.git", package = "sui-rpc", rev = "e494a36a76a0aab8c5d66d5557995faee5c1fb09" }
# Must match the tonic that sui-rpc/sui-rpc-api build their Status on, or
# the error types stop unifying.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }

clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP server (api-service).
axum = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# GraphQL query API (indexer, SO-97).
async-graphql = { version = "7" }
async-graphql-axum = { version = "7" }

# Postgres persistence for the indexer.
diesel = { version = "2.2", features = ["postgres", "r2d2", "chrono", "numeric", "serde_json"] }
diesel_migrations = { version = "2", features = ["postgres"] }
r2d2 = "0.8"
bigdecimal = { version = "0.4", features = ["serde"] }

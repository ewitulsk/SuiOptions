[workspace]
resolver = "2"
members = [
    "crates/protocol-types",
    "crates/indexer",
    "crates/quoting-service",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
protocol-types = { path = "crates/protocol-types" }

tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24" }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcs = "0.1"

ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"

thiserror = "1"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

dashmap = "6"
uuid = { version = "1", features = ["v4"] }
url = "2"
parking_lot = "0.12"

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Conservative target: HyperEVM's opcode support vs Cancun is an open item
# (bridge-spec.md §4/§9). "paris" avoids PUSH0/transient-storage assumptions
# until finality + opcode support are confirmed against Hyperliquid docs.
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
hyperevm_testnet = "${HYPEREVM_TESTNET_RPC}"

# `forge fmt` defaults are fine; pinned here for determinism.
[fmt]
line_length = 100

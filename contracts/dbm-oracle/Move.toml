[package]
name = "dbm_oracle"
version = "0.0.1"
edition = "2024.alpha"

[dependencies]
trading_vault = { local = "../trading-vault" }
options_core = { local = "../core" }
deepbook_margin = { git = "https://github.com/MystenLabs/deepbookv3.git", subdir = "packages/deepbook_margin", rev = "5417e9ae5398fbd107dcf68e6d9c345101528118" }
deepbook = { git = "https://github.com/MystenLabs/deepbookv3.git", subdir = "packages/deepbook", rev = "5417e9ae5398fbd107dcf68e6d9c345101528118" }
pyth = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "target_chains/sui/contracts", rev = "sui-contract-mainnet" }

# Mirror deepbook_margin's own env split: testnet builds/publishes resolve
# the testnet Pyth deployment (published ids); the mainnet default keeps
# source-mode Pyth for unit tests.
[dep-replacements.testnet]
pyth = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "target_chains/sui/contracts", rev = "sui-contract-testnet" }

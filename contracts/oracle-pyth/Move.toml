[package]
name = "oracle_pyth"
version = "0.0.1"
edition = "2024.beta"

[dependencies]
pyth = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "target_chains/sui/contracts", rev = "sui-pro-compatible-contract-mainnet" }
trading_vault = { local = "../trading-vault" }
options_core = { local = "../core" }

# Pyth ships separate testnet/mainnet contracts (different on-chain package
# IDs, declared in each branch's own manifest). The default above targets
# mainnet; swap the source branch for testnet builds.
#
# `sui-pro-compatible-contract-*` is Pyth's new architecture (migration
# deadline 2026-08-18). There is no automatic upgrade path on Sui — the new
# revision is a DIFFERENT on-chain package, so bumping this rev obliges a
# republish of oracle_pyth and a fresh `oraclePyth.packageId` in
# deployments.json. See docs/oracle-abstraction-plan.md §Phase 2b.
[dep-replacements]
testnet.pyth = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "target_chains/sui/contracts", rev = "sui-pro-compatible-contract-testnet" }

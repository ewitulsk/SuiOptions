[package]
name = "options_protocol"
version = "0.0.1"
edition = "2024.beta"

[dependencies]
pyth = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "target_chains/sui/contracts", rev = "sui-contract-mainnet" }
# deepbook + DEEP are vendored (see vendor/…/Move.toml): testnet links our
# self-hosted deployment, mainnet the official packages — the resolver reads a
# dep's on-chain addresses only from its own Published.toml, so address-only
# [dep-replacements] entries are silently ignored.
deepbook = { local = "./vendor/deepbookv3/packages/deepbook" }
token = { local = "./vendor/deepbookv3/packages/token" }
siws_session = { local = "../session-tokens/contracts" }

# Pyth ships separate testnet/mainnet contracts (different on-chain package
# IDs, declared in each branch's own manifest). The default above targets
# mainnet; swap the source branch for testnet builds.
[dep-replacements]
testnet.pyth = { git = "https://github.com/pyth-network/pyth-crosschain.git", subdir = "target_chains/sui/contracts", rev = "sui-contract-testnet" }

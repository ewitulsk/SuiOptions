[package]
name = "oracle_switchboard"
version = "0.0.1"
edition = "2024.beta"

[dependencies]
switchboard = { git = "https://github.com/switchboard-xyz/sui.git", subdir = "on_demand/", rev = "mainnet" }
trading_vault = { local = "../trading-vault" }
options_core = { local = "../core" }

# Switchboard ships separate testnet/mainnet branches whose manifests pin
# different on-chain package ids (`published-at`), exactly like Pyth. The
# default above targets mainnet; testnet builds resolve the testnet branch.
[dep-replacements]
testnet.switchboard = { git = "https://github.com/switchboard-xyz/sui.git", subdir = "on_demand/", rev = "testnet" }

# Geomi no-code processor template: one-time HISTORICAL backfill for the
# NFT aggregator. Import via dashboard: Processors > Import Processor.
# Covers our venue + wapal + rarible + topaz-v2 (reference family, both Event
# suffix variants) + tradeport v1/v2. Single transport table; our importer
# (cmd/nft-backfill) replays rows through the production venue mappers.
# Addresses generated from internal/venues/addrs.go + NFT_VENUE_ADDRESS.
# After validation: pause/delete the processor. Never used for steady state.
spec_identifier:
  spec_creator: nft-backfill
  spec_name: nft-backfill-processor
  spec_version: 0.0.1
common_config:
  network: mainnet
  # SCOPE ME in the dashboard per Geomi best practice: earliest venue
  # deployment beats 0. Cost scales with scanned history.
  starting_version: 0
  starting_version_override: null
custom_config:
  transaction_metadata:
    timestamp:
      - table: venue_events_backfill
        column: timestamp_us
    version:
      - table: venue_events_backfill
        column: version
    epoch: []
    block_height: []
